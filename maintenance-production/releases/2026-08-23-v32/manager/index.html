<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b28a3c"><link rel="manifest" href="/manifest.webmanifest"><title>إدارة الصيانة</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f7f4ee;color:#70531d;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center}.l{width:34px;height:34px;border:4px solid #eadbbd;border-top-color:#b28a3c;border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><div class="l"></div><p>جاري فتح نظام الصيانة...</p></main><script>async function go(){try{const r=await fetch('https://vvkrladsjicbvopvszsb.supabase.co/functions/v1/maintenance-app-bundle-v32',{cache:'no-store'});if(!r.ok)throw new Error('bundle '+r.status);const B=(await r.text()).trim();const a=Uint8Array.from(atob(B),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}catch(e){document.body.innerHTML='<main><h2>تعذر فتح النظام</h2><p>يرجى تحديث الصفحة.</p><small>'+String(e)+'</small></main>'}}go();</script></body></html>
