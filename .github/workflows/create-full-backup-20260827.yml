name: Create full project backup 20260827
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-full-backup-20260827.yml
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full backup zip
        run: |
          mkdir -p backups
          zip -r backups/damascene-links-full-backup-2026-08-27.zip . -x '.git/*' 'backups/*.zip'
      - name: Commit backup zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/damascene-links-full-backup-2026-08-27.zip
          git commit -m "chore: add full project backup 2026-08-27 [skip ci]"
          git push
