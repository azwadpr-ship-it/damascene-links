name: Fix morning report brand resolution v78
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-morning-brand-resolution-v78.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch morning branch identity and reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- Morning report ----------
          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(window.__morningReportV12)return;window.__morningReportV12=true;","if(window.__morningReportV13)return;window.__morningReportV13=true;",1)

          theme_line="function themeForBranch(id){if(id==='mazaq')return{paper:'#f5f5f5',card:'#fff',accent:'#b51f2e',dark:'#181818',ink:'#202020',muted:'#666',line:'#d6d6d6',soft:'#f3e8ea'};if(id==='individuals')return{paper:'#f4f5f5',card:'#fff',accent:'#df9022',dark:'#3b3d3f',ink:'#3b3d3f',muted:'#717477',line:'#d3d4d5',soft:'#f7efe4'};if(id==='families')return{paper:'#faf7f0',card:'#fffdf9',accent:'#b1740a',dark:'#6b4310',ink:'#3d3021',muted:'#7a6a57',line:'#e4d3b8',soft:'#f4eadb'};return{paper:'#f7fbfb',card:'#fbffff',accent:'#0f6f78',dark:'#0a4f57',ink:'#183638',muted:'#63787a',line:'#cfe2e3',soft:'#e5f3f4'}}"
          helper=r'''function reportBranchKey(branch){
 const raw=String(branch?.id||branch?.branch_id||'').trim().toLowerCase(),name=String(branch?.name||branch?.branch_name||'').trim();
 if(raw==='individuals'||raw.includes('individual')||name.includes('أفراد'))return'individuals';
 if(raw==='families'||raw.includes('famil')||name.includes('عوائل'))return'families';
 if(raw==='mazaq'||raw.includes('mazaq')||name.includes('المذاق'))return'mazaq';
 return raw;
}
function cleanReportLogo(img){
 try{
  const w=img.naturalWidth||img.width||300,h=img.naturalHeight||img.height||300,src=document.createElement('canvas');src.width=w;src.height=h;const x=src.getContext('2d');x.drawImage(img,0,0,w,h);
  const im=x.getImageData(0,0,w,h),d=im.data;let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const k=(yy*w+xx)*4,r=d[k],g=d[k+1],b=d[k+2];if(r>242&&g>242&&b>242)d[k+3]=0;else if(r>230&&g>230&&b>230)d[k+3]=Math.round(d[k+3]*.28);if(d[k+3]>16){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy}}
  x.putImageData(im,0,0);if(maxX<minX||maxY<minY)return img;
  const pad=Math.max(3,Math.round(Math.min(w,h)*.02)),sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=sw;out.height=sh;out.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,sw,sh);return out;
 }catch{return img}
}'''
          if helper not in s:
              if theme_line not in s: raise SystemExit('theme line missing')
              s=s.replace(theme_line,theme_line+'\n'+helper,1)

          s=s.replace("function loadIndividualsReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=INDIVIDUALS_REPORT_LOGO})}","function loadIndividualsReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(cleanReportLogo(i));i.onerror=()=>resolve(null);i.src=INDIVIDUALS_REPORT_LOGO})}",1)
          s=s.replace("function loadFamiliesReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=FAMILIES_REPORT_LOGO})}","function loadFamiliesReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(cleanReportLogo(i));i.onerror=()=>resolve(null);i.src=FAMILIES_REPORT_LOGO})}",1)
          s=s.replace("if(window.__morningReceivingState?.branch?.id==='families'&&action==='receiving_load')","if(reportBranchKey(window.__morningReceivingState?.branch)==='families'&&action==='receiving_load')",1)

          # Replace report header with a consistent branded header.
          a=s.index('function drawHeader('); b=s.index('function drawSummary(',a)
          new_header=r'''function drawHeader(ctx,branch,date,user,page,total){
 const t=reportTheme,branded=!!reportLogo;
 ctx.direction='rtl';ctx.textAlign='right';
 if(branded){
  let lw=100,lh=100,lx=918,ly=28,tx=900;
  if(reportBranchId==='mazaq'){lw=82;lh=105;lx=936;ly=25;tx=914}
  else if(reportBranchId==='families'){lw=98;lh=98;lx=920;ly=30;tx=900}
  else if(reportBranchId==='individuals'){lw=108;lh=108;lx=910;ly=24;tx=890}
  ctx.drawImage(reportLogo,lx,ly,lw,lh);
  ctx.fillStyle=t.accent;ctx.font='800 43px Tahoma,Arial';ctx.fillText(branch,tx,88);
  ctx.fillStyle=t.ink;ctx.font='700 28px Tahoma,Arial';ctx.fillText('تقرير الاستلام الصباحي',tx,132);
  ctx.fillStyle=t.accent;ctx.fillRect(tx-145,151,145,4);
 }else{
  ctx.fillStyle=t.dark;ctx.font='700 48px Tahoma,Arial';ctx.fillText(branch,1020,92);ctx.fillStyle=t.ink;ctx.font='700 31px Tahoma,Arial';ctx.fillText('تقرير الاستلام الصباحي',1020,140)
 }
 ctx.textAlign='left';ctx.fillStyle=t.ink;ctx.font='700 30px Tahoma,Arial';ctx.fillText(dayName(date),60,76);ctx.font='700 36px Tahoma,Arial';ctx.fillText(ddmmyyyy(date),60,116);ctx.fillStyle=t.muted;ctx.font='20px Tahoma,Arial';ctx.fillText(hijri(date),60,148);ctx.strokeStyle=t.line;ctx.beginPath();ctx.moveTo(55,174);ctx.lineTo(1025,174);ctx.stroke();ctx.textAlign='right';if(user){ctx.fillStyle=t.muted;ctx.font='21px Tahoma,Arial';ctx.fillText('المستلم: '+user,1020,204)}ctx.textAlign='left';ctx.fillStyle=t.muted;ctx.font='18px Tahoma,Arial';ctx.fillText(`${page}/${total}`,60,204)
}
'''
          s=s[:a]+new_header+s[b:]

          a=s.index('function drawColumn('); b=s.index('function drawFooter(',a)
          new_col=r'''function drawColumn(ctx,entries,x,y,w){
 const t=reportTheme,branded=['individuals','families','mazaq'].includes(reportBranchId);let cy=y;
 for(const e of entries){
  if(e.type==='section'){
   rounded(ctx,x,cy,w,58,12,branded?t.dark:t.accent);
   if(branded){ctx.fillStyle=t.accent;ctx.fillRect(x+8,cy,w-16,4)}
   ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='700 28px Tahoma,Arial';ctx.fillText(e.text,x+w-18,cy+39);cy+=66;continue
  }
  rounded(ctx,x,cy,w,66,8,t.card,t.line);ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle=t.ink;ctx.font='700 26px Tahoma,Arial';ctx.fillText(e.name,x+w-18,cy+41);ctx.textAlign='left';ctx.fillStyle=t.muted;ctx.font='20px Tahoma,Arial';ctx.fillText(e.unit,x+16,cy+41);ctx.fillStyle=t.accent;ctx.font='700 28px Tahoma,Arial';ctx.fillText(fmt(e.qty),x+88,cy+41);cy+=70
 }
 return cy
}
'''
          s=s[:a]+new_col+s[b:]

          old_build="async function build(){const date=reportDate(),[boot,loaded]=await Promise.all([post('bootstrap'),loadDay(date)]);reportBranchId=boot.branch?.id||'';reportTheme=themeForBranch(reportBranchId);reportLogo=reportBranchId==='mazaq'?await loadMazaqReportLogo():reportBranchId==='individuals'?await loadIndividualsReportLogo():reportBranchId==='families'?await loadFamiliesReportLogo():null;const raw=loaded.data||{},data=cumulativeDayData(raw),branch=boot.branch?.name||'الفرع',user=boot.user?.display_name||boot.user?.username||'',groups=groupTotals(data),fallback=!(data.batches||[]).length&&Number(data.inventory_snapshot?.count||0)>0;"
          new_build="async function build(){const date=reportDate(),[boot,loaded]=await Promise.all([post('bootstrap'),loadDay(date)]),live=window.__morningReceivingState||{},branchObj=live.branch||boot.branch||{},userObj=live.user||boot.user||{};reportBranchId=reportBranchKey(branchObj);reportTheme=themeForBranch(reportBranchId);reportLogo=reportBranchId==='mazaq'?await loadMazaqReportLogo():reportBranchId==='individuals'?await loadIndividualsReportLogo():reportBranchId==='families'?await loadFamiliesReportLogo():null;const raw=loaded.data||{},data=cumulativeDayData(raw),branch=branchObj.name||boot.branch?.name||'الفرع',user=userObj.display_name||userObj.username||boot.user?.display_name||boot.user?.username||'',groups=groupTotals(data),fallback=!(data.batches||[]).length&&Number(data.inventory_snapshot?.count||0)>0;"
          if old_build not in s: raise SystemExit('build marker missing')
          s=s.replace(old_build,new_build,1)
          p.write_text(s,encoding='utf-8')

          # ---------- Morning UI branch identity resolver ----------
          p=Path('inventory/morning/index.html'); h=p.read_text(encoding='utf-8')
          state_marker="const S={token:localStorage.getItem(KEY)||'',user:null,branch:null,data:null,date:null,draft:{},query:''};"
          branch_helper=r'''function branchKey(branch){const raw=String(branch?.id||branch?.branch_id||'').trim().toLowerCase(),name=String(branch?.name||branch?.branch_name||'').trim();if(raw==='individuals'||raw.includes('individual')||name.includes('أفراد'))return'individuals';if(raw==='families'||raw.includes('famil')||name.includes('عوائل'))return'families';if(raw==='mazaq'||raw.includes('mazaq')||name.includes('المذاق'))return'mazaq';return raw}'''
          if branch_helper not in h:
              if state_marker not in h: raise SystemExit('state marker missing')
              h=h.replace(state_marker,state_marker+'\n'+branch_helper,1)
          h=h.replace("const root=document.documentElement,id=S.branch?.id||'',brand=", "const root=document.documentElement,id=branchKey(S.branch),brand=",1)
          h=h.replace("if(S.branch?.id!=='mazaq')return data;","if(branchKey(S.branch)!=='mazaq')return data;",1)
          h=h.replace("return S.branch?.id==='mazaq'?(MAZAQ_MORNING_SECTIONS[i.name]||i.section):i.section","return branchKey(S.branch)==='mazaq'?(MAZAQ_MORNING_SECTIONS[i.name]||i.section):i.section",1)
          h=h.replace("if(S.branch?.id!=='mazaq')return g;","if(branchKey(S.branch)!=='mazaq')return g;",1)
          h=h.replace("S.query||(S.branch?.id!=='families'&&idx===0)","S.query||(branchKey(S.branch)!=='families'&&idx===0)",1)
          h=h.replace("S.branch?.id==='mazaq'&&snap!==undefined&&snap!==null","branchKey(S.branch)==='mazaq'&&snap!==undefined&&snap!==null",1)
          h=h.replace("S.branch?.id==='mazaq'&&d.inventory_snapshot?.count","branchKey(S.branch)==='mazaq'&&d.inventory_snapshot?.count",1)
          p.write_text(h,encoding='utf-8')

          # ---------- Cache/version ----------
          p=Path('inventory/morning-shell.html'); sh=p.read_text(encoding='utf-8')
          sh=sh.replace('/inventory/morning/index.html?inner=15','/inventory/morning/index.html?inner=16')
          sh=sh.replace("script.src='/inventory/morning/morning-report-v1.js?v=11'","script.src='/inventory/morning/morning-report-v1.js?v=12'")
          p.write_text(sh,encoding='utf-8')

          # Verification
          report=Path('inventory/morning/morning-report-v1.js').read_text(encoding='utf-8')
          ui=Path('inventory/morning/index.html').read_text(encoding='utf-8')
          shell=Path('inventory/morning-shell.html').read_text(encoding='utf-8')
          checks=[
            ('V13 guard','__morningReportV13' in report),
            ('branch resolver','function reportBranchKey' in report),
            ('live state','live=window.__morningReceivingState' in report),
            ('individual logo cleanup','resolve(cleanReportLogo(i))' in report),
            ('dark branded sections',"['individuals','families','mazaq'].includes(reportBranchId)" in report),
            ('UI resolver','function branchKey(branch)' in ui and 'id=branchKey(S.branch)' in ui),
            ('shell inner16','index.html?inner=16' in shell),
            ('shell report v12','morning-report-v1.js?v=12' in shell),
            ('OG untouched','morning-og-whatsapp-1200x630.jpg' in shell),
          ]
          bad=[n for n,ok in checks if not ok]
          if bad: raise SystemExit('verification failed: '+', '.join(bad))
          print('Morning identity/report v78 PASS')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/morning/morning-report-v1.js inventory/morning/index.html inventory/morning-shell.html
          git commit -m 'Fix morning report branch identities and logos'
          git push origin main
