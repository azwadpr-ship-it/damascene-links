name: Patch morning report history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morning-report-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add historical morning report selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing pattern: '+old[:100])
              s=s.replace(old,new,1)
          rep("if(window.__morningReportV3)return;window.__morningReportV3=true;","if(window.__morningReportV4)return;window.__morningReportV4=true;")
          old="function visibleDate(){const t=$('.hero .date')?.textContent||'';const m=t.match(/\\d{4}-\\d{2}-\\d{2}/);return m?.[0]||today()}"
          new=old+"\nfunction previousDay(d){const x=new Date(d+'T12:00:00+03:00');x.setDate(x.getDate()-1);const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(x),o={};p.forEach(v=>o[v.type]=v.value);return`${o.year}-${o.month}-${o.day}`}\nfunction reportDate(){return $('#morningReportDate')?.value||visibleDate()}\nlet reportCheckSeq=0;"
          rep(old,new)
          old="function injectActions(){if(!$('#appScreen')||$('#appScreen').classList.contains('hidden'))return;const history=$('.history');if(!history||$('#morningReportActions'))return;const card=document.createElement('section');card.id='morningReportActions';card.className='morning-report-actions';card.innerHTML='<div class=\"morning-report-copy\"><h3>تقرير الاستلام الصباحي</h3><p id=\"morningReportHint\">إرسال استلامات اليوم كصور واضحة أو ملف PDF.</p></div><div class=\"morning-report-buttons\"><button type=\"button\" class=\"btn primary\" id=\"morningShareImages\">مشاركة كصور</button><button type=\"button\" class=\"btn\" id=\"morningSharePdf\">مشاركة PDF</button></div>';history.after(card);$('#morningShareImages').onclick=()=>share('images');$('#morningSharePdf').onclick=()=>share('pdf')}"
          new="function injectActions(){if(!$('#appScreen')||$('#appScreen').classList.contains('hidden'))return false;const history=$('.history');if(!history||$('#morningReportActions'))return false;const card=document.createElement('section');card.id='morningReportActions';card.className='morning-report-actions';card.innerHTML='<div class=\"morning-report-copy\"><h3>تقرير الاستلام الصباحي</h3><p id=\"morningReportHint\">اختر تاريخ التقرير ثم أرسله كصور أو PDF.</p></div><div class=\"morning-report-date\"><label for=\"morningReportDate\">تاريخ التقرير</label><div class=\"morning-report-date-row\"><input type=\"date\" id=\"morningReportDate\"><button type=\"button\" class=\"morning-date-shortcut\" id=\"morningToday\">اليوم</button><button type=\"button\" class=\"morning-date-shortcut\" id=\"morningYesterday\">أمس</button></div></div><div class=\"morning-report-buttons\"><button type=\"button\" class=\"btn primary\" id=\"morningShareImages\">مشاركة كصور</button><button type=\"button\" class=\"btn\" id=\"morningSharePdf\">مشاركة PDF</button></div>';history.after(card);const input=$('#morningReportDate');input.value=visibleDate();input.max=today();input.onchange=()=>refreshReportState();$('#morningToday').onclick=()=>{input.value=today();refreshReportState()};$('#morningYesterday').onclick=()=>{input.value=previousDay(today());refreshReportState()};$('#morningShareImages').onclick=()=>share('images');$('#morningSharePdf').onclick=()=>share('pdf');return true}"
          rep(old,new)
          old="function savedBatchCount(){const st=window.__morningReceivingState;if(st?.data&&st.date===visibleDate())return (st.data.batches||[]).length;return document.querySelectorAll('.history .batch').length}\nfunction syncActionState(){injectActions();const card=$('#morningReportActions');if(!card)return;const count=savedBatchCount(),disabled=count===0,hint=$('#morningReportHint'),images=$('#morningShareImages'),pdf=$('#morningSharePdf');if(images)images.disabled=disabled;if(pdf)pdf.disabled=disabled;card.classList.toggle('morning-report-empty',disabled);const msg=disabled?'احفظ دفعة الاستلام أولًا، وبعد الحفظ تتفعّل أزرار التقرير تلقائيًا.':'إرسال استلامات اليوم المحفوظة كصور واضحة أو ملف PDF.';if(hint&&hint.textContent!==msg)hint.textContent=msg}"
          new="async function refreshReportState(){injectActions();const card=$('#morningReportActions');if(!card)return;const date=reportDate(),seq=++reportCheckSeq,hint=$('#morningReportHint'),images=$('#morningShareImages'),pdf=$('#morningSharePdf');if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.add('morning-report-empty');if(hint)hint.textContent='جاري التحقق من التقرير المحفوظ...';try{const loaded=await post('receiving_load',{date});if(seq!==reportCheckSeq)return;const count=(loaded.data?.batches||[]).length,disabled=count===0;if(images)images.disabled=disabled;if(pdf)pdf.disabled=disabled;card.classList.toggle('morning-report-empty',disabled);if(hint)hint.textContent=count?`${count} دفعة محفوظة بتاريخ ${ddmmyyyy(date)} — التقرير جاهز لإعادة الإرسال.`:(date===today()?'احفظ دفعة الاستلام أولًا، وبعد الحفظ تتفعّل أزرار التقرير تلقائيًا.':`لا توجد دفعات استلام محفوظة بتاريخ ${ddmmyyyy(date)}.`)}catch(e){if(seq!==reportCheckSeq)return;if(hint)hint.textContent=e?.message||'تعذر التحقق من التقرير'}}"
          rep(old,new)
          old=".morning-report-empty .morning-report-copy p{font-weight:800;color:var(--dark)}`"
          new=".morning-report-empty .morning-report-copy p{font-weight:800;color:var(--dark)}.morning-report-date{margin-top:12px;text-align:right}.morning-report-date label{display:block;font-size:12px;font-weight:800;color:var(--dark);margin-bottom:6px}.morning-report-date-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px}.morning-report-date-row input{width:100%;box-sizing:border-box;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:700 14px Tahoma,Arial;padding:0 10px}.morning-date-shortcut{min-width:58px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--dark);font-weight:800;padding:0 10px}`"
          rep(old,new)
          rep("async function build(){const date=visibleDate(),","async function build(){const date=reportDate(),")
          old="addStyle();syncActionState();window.addEventListener('morning-receiving-state',syncActionState);const content=$('#content');if(content){let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;syncActionState()})}).observe(content,{childList:true})}"
          new="addStyle();injectActions();refreshReportState();window.addEventListener('morning-receiving-state',()=>{if(reportDate()===visibleDate())refreshReportState()});const content=$('#content');if(content){let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;if(injectActions())refreshReportState()})}).observe(content,{childList:true})}"
          rep(old,new)
          p.write_text(s,encoding='utf-8')

          shell=Path('inventory/morning-shell.html')
          h=shell.read_text(encoding='utf-8')
          if 'morning-report-v1.js?v=2' not in h: raise SystemExit('missing shell report cache pattern')
          h=h.replace('morning-report-v1.js?v=2','morning-report-v1.js?v=3',1)
          h=h.replace('/inventory/morning/index.html?inner=5','/inventory/morning/index.html?inner=6',1)
          shell.write_text(h,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'morningReportDate' inventory/morning/morning-report-v1.js
          grep -q 'function reportDate' inventory/morning/morning-report-v1.js
          grep -q 'morning-report-v1.js?v=3' inventory/morning-shell.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m 'Morning receiving: add historical report resend' || exit 0
          git push
