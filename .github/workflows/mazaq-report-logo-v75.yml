name: Mazaq report logo v75
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mazaq-report-logo-v75.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Mazaq report branding
        run: python3 .github/scripts/mazaq_report_logo_v75.py
      - name: Commit and clean temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mazaq-report-logo-v75.yml .github/scripts/mazaq_report_logo_v75.py
          git add inventory/report-v32.js inventory/branch-report-stable-v57.js inventory/index.html inventory/morning/index.html inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m 'Add Mazaq logo to daily and morning reports'
          git push origin main
