name: Mazaq report logo v75
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mazaq-report-logo-v75.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Mazaq report branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Daily inventory report: load and render the real Mazaq logo.
          p=Path('inventory/report-v32.js')
          s=p.read_text()
          old="const INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nconst FAMILIES_REPORT_LOGO='/inventory/families-brand-logo.jpg?v=1';"
          new="const MAZAQ_REPORT_LOGO='/inventory/mazaq-brand-logo.png?v=1';\nconst INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nconst FAMILIES_REPORT_LOGO='/inventory/families-brand-logo.jpg?v=1';"
          if old not in s: raise SystemExit('daily logo constants marker missing')
          s=s.replace(old,new,1)
          old="let individualsReportLogo=null,individualsReportLogoLoading=null,familiesReportLogo=null,familiesReportLogoLoading=null;"
          new="let mazaqReportLogo=null,mazaqReportLogoLoading=null,individualsReportLogo=null,individualsReportLogoLoading=null,familiesReportLogo=null,familiesReportLogoLoading=null;"
          if old not in s: raise SystemExit('daily logo vars marker missing')
          s=s.replace(old,new,1)
          marker="""function loadFamiliesReportLogo(){
 if(familiesReportLogo)return Promise.resolve(familiesReportLogo);
 if(familiesReportLogoLoading)return familiesReportLogoLoading;
 familiesReportLogoLoading=new Promise(resolve=>{const img=new Image();img.onload=()=>{familiesReportLogo=img;resolve(img)};img.onerror=()=>resolve(null);img.src=FAMILIES_REPORT_LOGO});
 return familiesReportLogoLoading;
}
"""
          addition=marker+"""function loadMazaqReportLogo(){
 if(mazaqReportLogo)return Promise.resolve(mazaqReportLogo);
 if(mazaqReportLogoLoading)return mazaqReportLogoLoading;
 mazaqReportLogoLoading=new Promise(resolve=>{const img=new Image();img.onload=()=>{mazaqReportLogo=img;resolve(img)};img.onerror=()=>resolve(null);img.src=MAZAQ_REPORT_LOGO});
 return mazaqReportLogoLoading;
}
"""
          if marker not in s: raise SystemExit('daily families loader marker missing')
          s=s.replace(marker,addition,1)
          old="const d=dateParts(r.reportDate),logo=t.mode==='individuals'?individualsReportLogo:t.mode==='families'?familiesReportLogo:null,branded=!!logo;"
          new="const d=dateParts(r.reportDate),logo=t.mode==='mazaq'?mazaqReportLogo:t.mode==='individuals'?individualsReportLogo:t.mode==='families'?familiesReportLogo:null,branded=!!logo;"
          if old not in s: raise SystemExit('daily header logo selector missing')
          s=s.replace(old,new,1)
          old=""" if(branded){
  if(t.mode==='individuals'){
"""
          new=""" if(branded){
  if(t.mode==='mazaq'){
   const lw=96,lh=123,lx=P.W-P.M-lw,ly=26,tx=lx-22;
   c.drawImage(logo,lx,ly,lw,lh);
   c.fillStyle=t.accent;c.font='900 48px Tahoma,Arial';c.fillText(r.branch,tx,88);
   c.fillStyle=t.text;c.font='800 30px Tahoma,Arial';c.fillText('تقرير الجرد اليومي',tx,130);
   c.fillStyle=t.accent;round(c,tx-150,154,150,4,2);c.fill();
  }else if(t.mode==='individuals'){
"""
          if old not in s: raise SystemExit('daily branded header marker missing')
          s=s.replace(old,new,1)
          old="await document.fonts.ready;const t=theme(r),out=[];if(t.mode==='individuals')await loadIndividualsReportLogo();if(t.mode==='families')await loadFamiliesReportLogo();"
          new="await document.fonts.ready;const t=theme(r),out=[];if(t.mode==='mazaq')await loadMazaqReportLogo();if(t.mode==='individuals')await loadIndividualsReportLogo();if(t.mode==='families')await loadFamiliesReportLogo();"
          if old not in s: raise SystemExit('daily canvas logo loading marker missing')
          s=s.replace(old,new,1)
          for m in ['MAZAQ_REPORT_LOGO','loadMazaqReportLogo',"t.mode==='mazaq'?mazaqReportLogo",'const lw=96,lh=123']:
              if m not in s: raise SystemExit('daily verification missing '+m)
          p.write_text(s)

          # Daily lazy-loader cache bump.
          p=Path('inventory/branch-report-stable-v57.js');s=p.read_text()
          if 'report-v32-v67-js' not in s or '/inventory/report-v32.js?v=67' not in s: raise SystemExit('daily report cache marker missing')
          s=s.replace('report-v32-v67-js','report-v32-v68-js').replace('/inventory/report-v32.js?v=67','/inventory/report-v32.js?v=68')
          p.write_text(s)
          p=Path('inventory/index.html');s=p.read_text()
          if '/inventory/branch-report-stable-v57.js?v=8' not in s: raise SystemExit('inventory shell cache marker missing')
          s=s.replace('/inventory/branch-report-stable-v57.js?v=8','/inventory/branch-report-stable-v57.js?v=9')
          if 'https://damascene-links.vercel.app/inventory/whatsapp-preview.jpg' not in s: raise SystemExit('main OG metadata unexpectedly changed')
          p.write_text(s)

          # Morning receiving page: use the same real Mazaq logo in its header.
          p=Path('inventory/morning/index.html');s=p.read_text()
          old="brand?.classList.remove('individuals-logo','families-logo');"
          if old not in s: raise SystemExit('morning branch logo class marker missing')
          s=s.replace(old,"brand?.classList.remove('mazaq-logo','individuals-logo','families-logo');",1)
          needle="root.style.setProperty('--accent','#b51f2e');root.style.setProperty('--dark','#181818');root.style.setProperty('--bg','#f1f1f1');root.style.setProperty('--card','#fff');root.style.setProperty('--ink','#202020');root.style.setProperty('--muted','#666');root.style.setProperty('--line','#d6d6d6');root.style.setProperty('--soft','#f3e8ea');if(theme)theme.content='#b51f2e';"
          if needle not in s: raise SystemExit('morning Mazaq theme marker missing')
          s=s.replace(needle,needle+"\n  if(brand){brand.src='/inventory/mazaq-brand-logo.png?v=1';brand.alt='المذاق الدمشقي';brand.classList.add('mazaq-logo')}if(title)title.textContent='المذاق الدمشقي - تقرير الاستلام الصباحي';if(sub)sub.textContent='تسجيل المواد الواردة';",1)
          p.write_text(s)

          # Morning report: load/render Mazaq logo too.
          p=Path('inventory/morning/morning-report-v1.js');s=p.read_text()
          if "if(window.__morningReportV11)return;window.__morningReportV11=true;" not in s: raise SystemExit('morning report guard marker missing')
          s=s.replace("if(window.__morningReportV11)return;window.__morningReportV11=true;","if(window.__morningReportV12)return;window.__morningReportV12=true;",1)
          old="const INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nconst FAMILIES_REPORT_LOGO='/inventory/families-brand-logo.jpg?v=1';"
          new="const MAZAQ_REPORT_LOGO='/inventory/mazaq-brand-logo.png?v=1';\nconst INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nconst FAMILIES_REPORT_LOGO='/inventory/families-brand-logo.jpg?v=1';"
          if old not in s: raise SystemExit('morning report constants marker missing')
          s=s.replace(old,new,1)
          old="reportLogo=null;"
          if old not in s: raise SystemExit('morning report state marker missing')
          s=s.replace(old,"reportLogo=null,reportBranchId='';",1)
          marker="function loadIndividualsReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=INDIVIDUALS_REPORT_LOGO})}"
          if marker not in s: raise SystemExit('morning report individuals loader missing')
          s=s.replace(marker,"function loadMazaqReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=MAZAQ_REPORT_LOGO})}\n"+marker,1)
          old="if(branded){ctx.drawImage(reportLogo,940,43,76,76);ctx.fillStyle=t.accent;ctx.font='700 43px Tahoma,Arial';ctx.fillText(branch,920,90);ctx.fillStyle=t.ink;ctx.font='700 28px Tahoma,Arial';ctx.fillText('تقرير الاستلام الصباحي',920,136)}"
          new="if(branded){if(reportBranchId==='mazaq'){ctx.drawImage(reportLogo,935,31,72,92);ctx.fillStyle=t.accent;ctx.font='700 43px Tahoma,Arial';ctx.fillText(branch,913,90);ctx.fillStyle=t.ink;ctx.font='700 28px Tahoma,Arial';ctx.fillText('تقرير الاستلام الصباحي',913,136)}else{ctx.drawImage(reportLogo,940,43,76,76);ctx.fillStyle=t.accent;ctx.font='700 43px Tahoma,Arial';ctx.fillText(branch,920,90);ctx.fillStyle=t.ink;ctx.font='700 28px Tahoma,Arial';ctx.fillText('تقرير الاستلام الصباحي',920,136)}}"
          if old not in s: raise SystemExit('morning report header marker missing')
          s=s.replace(old,new,1)
          pat=r"reportTheme=themeForBranch\(boot\.branch\?\.id\|\|''\);reportLogo=boot\.branch\?\.id==='individuals'\?await loadIndividualsReportLogo\(\):boot\.branch\?\.id==='families'\?await loadFamiliesReportLogo\(\):null;"
          repl="reportBranchId=boot.branch?.id||'';reportTheme=themeForBranch(reportBranchId);reportLogo=reportBranchId==='mazaq'?await loadMazaqReportLogo():reportBranchId==='individuals'?await loadIndividualsReportLogo():reportBranchId==='families'?await loadFamiliesReportLogo():null;"
          s,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit('morning report build logo selector missing')
          for m in ['MAZAQ_REPORT_LOGO','loadMazaqReportLogo',"reportBranchId==='mazaq'",'935,31,72,92']:
              if m not in s: raise SystemExit('morning report verification missing '+m)
          p.write_text(s)

          # Morning shell cache + Mazaq header sizing. Keep OG metadata untouched.
          p=Path('inventory/morning-shell.html');s=p.read_text()
          if 'index.html?inner=14' not in s or 'morning-report-v1.js?v=10' not in s: raise SystemExit('morning shell cache markers missing')
          s=s.replace('index.html?inner=14','index.html?inner=15',1).replace('morning-report-v1.js?v=10','morning-report-v1.js?v=11',1)
          css='html[data-branch="mazaq"] .topbrand img.mazaq-logo{width:54px!important;height:54px!important;object-fit:contain!important;max-width:none!important}\\nhtml[data-branch="mazaq"] .top-title{border-right-color:#d6d6d6!important}html[data-branch="mazaq"] .top-title b{color:#181818!important}html[data-branch="mazaq"] .top-title small{color:#b51f2e!important;font-weight:800!important}\\n'
          anchor='html[data-branch="mazaq"] .hero{border-top-color:#b51f2e!important}\\n'
          if anchor not in s: raise SystemExit('morning shell Mazaq CSS anchor missing')
          s=s.replace(anchor,anchor+css,1)
          if 'https://damascene-links.vercel.app/inventory/morning/morning-og-whatsapp-1200x630.jpg' not in s: raise SystemExit('morning OG metadata unexpectedly changed')
          p.write_text(s)

          # Asset must be present in this checkout.
          asset=Path('inventory/mazaq-brand-logo.png')
          if not asset.exists() or asset.stat().st_size<1000: raise SystemExit('Mazaq logo asset missing')
          print('MAZAQ_REPORT_LOGO_V75: PASS')
          PY
      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mazaq-report-logo-v75.yml
          git add inventory/report-v32.js inventory/branch-report-stable-v57.js inventory/index.html inventory/morning/index.html inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m 'Add Mazaq logo to daily and morning reports'
          git push origin main
