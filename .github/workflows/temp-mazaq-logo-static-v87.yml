name: Temporary Mazaq static logo v87
on:
  push:
    paths:
      - '.github/workflows/temp-mazaq-logo-static-v87.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create static SVG and wire reports
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js=Path('inventory/mazaq-report-logo-v86.js').read_text(encoding='utf-8')
          m=re.search(r"data:image/png;base64,([^']+)", js)
          if not m: raise SystemExit('embedded mazaq logo not found')
          b64=''.join(m.group(1).split())
          b64 += '=' * (-len(b64) % 4)
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900"><image x="0" y="0" width="700" height="900" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,{b64}"/></svg>'''
          Path('inventory/mazaq-report-logo-v87.svg').write_text(svg,encoding='utf-8')

          p=Path('inventory/report-v32.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const MAZAQ_REPORT_LOGO=.*?;", "const MAZAQ_REPORT_LOGO='/inventory/mazaq-report-logo-v87.svg?v=1';", s, count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/morning/morning-report-v1-base-v12.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const MAZAQ_REPORT_LOGO=.*?;", "const MAZAQ_REPORT_LOGO='/inventory/mazaq-report-logo-v87.svg?v=1';", s, count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text(encoding='utf-8')
          marker="const loadBase=()=>{"
          if marker in s:
              start=s.index(marker)
              s=s[:start]+"const s=document.createElement('script');s.id='morning-report-base-v12-js';s.src='/inventory/morning/morning-report-v1-base-v12.js?v=8';s.async=false;s.onload=()=>{fireCurrentState();setTimeout(fireCurrentState,120);setTimeout(fireCurrentState,650)};s.onerror=()=>console.error('تعذر تحميل قالب تقرير الاستلام الصباحي الأساسي');document.body.appendChild(s);\n})();\n"
          else:
              s=re.sub(r"morning-report-v1-base-v12\.js\?v=\d+","morning-report-v1-base-v12.js?v=8",s)
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("addScript(d,'mazaq-report-logo-v86-js','/inventory/mazaq-report-logo-v86.js?v=1');","")
          s=re.sub(r'/inventory/branch-report-stable-v57\.js\?v=\d+','/inventory/branch-report-stable-v57.js?v=15',s)
          s=re.sub(r'/inventory/historical-share-v85\.js\?v=\d+','/inventory/historical-share-v85.js?v=4',s)
          s=re.sub(r'/inventory/original\.html\?v=\d+','/inventory/original.html?v=70',s)
          p.write_text(s,encoding='utf-8')

          for fn in ['inventory/branch-report-stable-v57.js','inventory/historical-share-v85.js']:
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'report-v32-v\d+-js','report-v32-v74-js',s)
              s=re.sub(r'/inventory/report-v32\.js\?v=\d+','/inventory/report-v32.js?v=74',s)
              p.write_text(s,encoding='utf-8')

          p=Path('inventory/morning-shell.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'morning-report-v1\.js\?v=\d+','morning-report-v1.js?v=16',s)
          p.write_text(s,encoding='utf-8')

          print('svg bytes',Path('inventory/mazaq-report-logo-v87.svg').stat().st_size)
          print('daily logo ref', 'mazaq-report-logo-v87.svg' in Path('inventory/report-v32.js').read_text(encoding='utf-8'))
          print('morning logo ref', 'mazaq-report-logo-v87.svg' in Path('inventory/morning/morning-report-v1-base-v12.js').read_text(encoding='utf-8'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/mazaq-report-logo-v87.svg inventory/report-v32.js inventory/morning/morning-report-v1-base-v12.js inventory/morning/morning-report-v1.js inventory/index.html inventory/branch-report-stable-v57.js inventory/historical-share-v85.js inventory/morning-shell.html
          git status --short
          if git diff --cached --quiet; then
            echo "No file changes to commit"
          else
            git commit -m "Use static Mazaq SVG in all reports v87"
            git push
          fi
