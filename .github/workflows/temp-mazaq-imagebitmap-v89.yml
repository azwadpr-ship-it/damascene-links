name: Temporary Mazaq ImageBitmap v89
on:
  push:
    paths:
      - '.github/workflows/temp-mazaq-imagebitmap-v89.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch robust logo loading
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('inventory/report-v32.js')
          s=p.read_text(encoding='utf-8')
          old="""function loadMazaqReportLogo(){
 if(mazaqReportLogo)return Promise.resolve(mazaqReportLogo);
 if(mazaqReportLogoLoading)return mazaqReportLogoLoading;
 mazaqReportLogoLoading=new Promise(resolve=>{const img=new Image();img.onload=()=>{mazaqReportLogo=img;resolve(img)};img.onerror=()=>resolve(null);img.src=MAZAQ_REPORT_LOGO});
 return mazaqReportLogoLoading;
}"""
          new="""function loadMazaqReportLogo(){
 if(mazaqReportLogo)return Promise.resolve(mazaqReportLogo);
 if(mazaqReportLogoLoading)return mazaqReportLogoLoading;
 mazaqReportLogoLoading=(async()=>{
  try{
   const r=await fetch(MAZAQ_REPORT_LOGO,{cache:'no-store'});if(!r.ok)throw Error('logo '+r.status);
   const b=await r.blob();
   if(typeof createImageBitmap==='function'){mazaqReportLogo=await createImageBitmap(b);return mazaqReportLogo}
   const u=URL.createObjectURL(b);try{mazaqReportLogo=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=u});return mazaqReportLogo}finally{URL.revokeObjectURL(u)}
  }catch(e){console.error('Mazaq report logo load failed',e);return null}
 })();
 return mazaqReportLogoLoading;
}"""
          if old not in s: raise SystemExit('daily Mazaq loader pattern not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('inventory/morning/morning-report-v1-base-v12.js')
          s=p.read_text(encoding='utf-8')
          old="function loadMazaqReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=MAZAQ_REPORT_LOGO})}"
          new="""function loadMazaqReportLogo(){return (async()=>{try{const r=await fetch(MAZAQ_REPORT_LOGO,{cache:'no-store'});if(!r.ok)throw Error('logo '+r.status);const b=await r.blob();if(typeof createImageBitmap==='function')return await createImageBitmap(b);const u=URL.createObjectURL(b);try{return await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=u})}finally{URL.revokeObjectURL(u)}}catch(e){console.error('Mazaq morning logo load failed',e);return null}})()}"""
          if old not in s: raise SystemExit('morning Mazaq loader pattern not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('inventory/branch-report-stable-v57.js')
          s=p.read_text(encoding='utf-8').replace('report-v32-v75-js','report-v32-v76-js').replace('/inventory/report-v32.js?v=75','/inventory/report-v32.js?v=76')
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/historical-share-v85.js')
          s=p.read_text(encoding='utf-8').replace('report-v32-v75-js','report-v32-v76-js').replace('/inventory/report-v32.js?v=75','/inventory/report-v32.js?v=76')
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8').replace('/inventory/branch-report-stable-v57.js?v=16','/inventory/branch-report-stable-v57.js?v=17').replace('/inventory/historical-share-v85.js?v=5','/inventory/historical-share-v85.js?v=6').replace('/inventory/original.html?v=71','/inventory/original.html?v=72')
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text(encoding='utf-8').replace('/inventory/morning/morning-report-v1-base-v12.js?v=9','/inventory/morning/morning-report-v1-base-v12.js?v=10')
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/morning-shell.html')
          s=p.read_text(encoding='utf-8').replace('/inventory/morning/morning-report-v1.js?v=17','/inventory/morning/morning-report-v1.js?v=18')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/morning/morning-report-v1-base-v12.js inventory/branch-report-stable-v57.js inventory/historical-share-v85.js inventory/index.html inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m "Load Mazaq report logo via ImageBitmap v89"
          git push
