name: Temporary Mazaq report logo v86
on:
  push:
    paths:
      - '.github/workflows/temp-mazaq-logo-v86.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire Mazaq logo into daily and morning reports
        run: |
          python - <<'PY'
          from pathlib import Path

          # Daily report uses the embedded cleaned logo when present.
          p=Path('inventory/report-v32.js')
          s=p.read_text(encoding='utf-8')
          old="const MAZAQ_REPORT_LOGO='/inventory/mazaq-brand-logo.png?v=1';"
          new="const MAZAQ_REPORT_LOGO=window.__MAZAQ_REPORT_LOGO_V86||'/inventory/mazaq-brand-logo.png?v=1';"
          if old not in s and new not in s: raise SystemExit('daily mazaq logo marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Morning report uses exactly the same logo source.
          p=Path('inventory/morning/morning-report-v1-base-v12.js')
          s=p.read_text(encoding='utf-8')
          old="const MAZAQ_REPORT_LOGO='/inventory/mazaq-brand-logo.png?v=1';"
          new="const MAZAQ_REPORT_LOGO=window.__MAZAQ_REPORT_LOGO_V86||'/inventory/mazaq-brand-logo.png?v=1';"
          if old not in s and new not in s: raise SystemExit('morning mazaq logo marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Load the embedded logo before the daily report helpers.
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          marker="addScript(d,'historical-share-v85-js','/inventory/historical-share-v85.js?v=1');"
          repl="addScript(d,'mazaq-report-logo-v86-js','/inventory/mazaq-report-logo-v86.js?v=1');"+marker
          if "mazaq-report-logo-v86-js" not in s:
              if marker not in s: raise SystemExit('daily loader marker not found')
              s=s.replace(marker,repl)
          s=s.replace("/inventory/branch-report-stable-v57.js?v=11","/inventory/branch-report-stable-v57.js?v=13")
          s=s.replace("/inventory/historical-share-v85.js?v=1","/inventory/historical-share-v85.js?v=2")
          s=s.replace("/inventory/original.html?v=67","/inventory/original.html?v=68")
          p.write_text(s,encoding='utf-8')

          # Bump daily generator URL everywhere so browsers cannot reuse v70.
          p=Path('inventory/branch-report-stable-v57.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('report-v32-v70-js','report-v32-v72-js').replace('/inventory/report-v32.js?v=70','/inventory/report-v32.js?v=72')
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/historical-share-v85.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('report-v32-v70-js','report-v32-v72-js').replace('report-v32-v71-js','report-v32-v72-js').replace('/inventory/report-v32.js?v=70','/inventory/report-v32.js?v=72').replace('/inventory/report-v32.js?v=71','/inventory/report-v32.js?v=72')
          p.write_text(s,encoding='utf-8')

          # Load logo script before morning base report template.
          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text(encoding='utf-8')
          old="const s=document.createElement('script');s.id='morning-report-base-v12-js';s.src='/inventory/morning/morning-report-v1-base-v12.js?v=5';s.async=false;s.onload=()=>{fireCurrentState();setTimeout(fireCurrentState,120);setTimeout(fireCurrentState,650)};s.onerror=()=>console.error('تعذر تحميل قالب تقرير الاستلام الصباحي الأساسي');document.body.appendChild(s);"
          new="const loadBase=()=>{const s=document.createElement('script');s.id='morning-report-base-v12-js';s.src='/inventory/morning/morning-report-v1-base-v12.js?v=6';s.async=false;s.onload=()=>{fireCurrentState();setTimeout(fireCurrentState,120);setTimeout(fireCurrentState,650)};s.onerror=()=>console.error('تعذر تحميل قالب تقرير الاستلام الصباحي الأساسي');document.body.appendChild(s)};if(window.__MAZAQ_REPORT_LOGO_V86){loadBase()}else{const l=document.createElement('script');l.id='mazaq-report-logo-v86-js';l.src='/inventory/mazaq-report-logo-v86.js?v=1';l.async=false;l.onload=loadBase;l.onerror=loadBase;document.body.appendChild(l)};"
          if old not in s and "const loadBase=()=>" not in s: raise SystemExit('morning wrapper loader marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Bump morning shell cache if present.
          p=Path('inventory/morning-shell.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('morning-report-v1.js?v=13','morning-report-v1.js?v=14').replace('morning-report-v1.js?v=12','morning-report-v1.js?v=14').replace('morning-report-v1.js?v=11','morning-report-v1.js?v=14')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/index.html inventory/branch-report-stable-v57.js inventory/historical-share-v85.js inventory/morning/morning-report-v1.js inventory/morning/morning-report-v1-base-v12.js inventory/morning-shell.html
          git commit -m "Use cleaned Mazaq logo across reports v86"
          git push
