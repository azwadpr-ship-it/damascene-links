name: Families morning receiving v69

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/families-morning-receiving-v69.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply families morning receiving
        run: python .github/scripts/families_morning_receiving_v69.py

      - name: Verify
        run: |
          grep -q 'inventory_family_morning_load_v1' inventory/morning/index.html
          grep -q 'inventory_family_morning_post_v1' inventory/morning/index.html
          grep -q 'inventory_family_morning_load_v1' inventory/morning/morning-report-v1.js
          grep -q '__morningReportV9' inventory/morning/morning-report-v1.js
          grep -q 'index.html?inner=11' inventory/morning-shell.html
          grep -q 'morning-report-v1.js?v=8' inventory/morning-shell.html

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/families-morning-receiving-v69.yml .github/scripts/families_morning_receiving_v69.py
          git add inventory/morning/index.html inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m "Update families morning receiving items"
          git push
