name: Patch morning receiving save and share v66
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morning-save-share-v66.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch morning receiving
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('inventory/morning/index.html')
          s=p.read_text(encoding='utf-8')
          old="const S={token:localStorage.getItem(KEY)||'',user:null,branch:null,data:null,date:null,draft:{},query:''};"
          assert old in s, 'state anchor missing'
          s=s.replace(old,old+"\nlet dateSyncing=false;",1)
          old="function clearDraft(){localStorage.removeItem(draftKey());S.draft={}}\nfunction signOut(call=true)"
          new="function clearDraft(){localStorage.removeItem(draftKey());S.draft={}}\nfunction publishState(){const state={date:S.date,user:S.user,branch:S.branch,data:S.data};window.__morningReceivingState=state;window.dispatchEvent(new CustomEvent('morning-receiving-state',{detail:state}))}\nasync function ensureCurrentDay(migrateDraft=true){const now=today();if(!S.date||S.date===now)return false;const oldKey=draftKey(),draft={...S.draft};S.date=now;if(migrateDraft&&Object.keys(draft).length){localStorage.removeItem(oldKey);S.draft=draft;localStorage.setItem(draftKey(),JSON.stringify(S.draft))}else S.draft={};const d=await api('receiving_load',{date:S.date});S.data=d.data;render();return true}\nasync function syncDateOnResume(){if(dateSyncing||!S.token||!S.user||S.date===today())return;dateSyncing=true;try{const moved=await ensureCurrentDay(true);if(moved)toast('تم الانتقال تلقائيًا إلى استلامات اليوم')}catch(e){toast(e.message,true)}finally{dateSyncing=false}}\nfunction signOut(call=true)"
          assert old in s, 'helper anchor missing'
          s=s.replace(old,new,1)
          old="document.querySelectorAll('.qty').forEach(inp=>inp.oninput=()=>{const v=inp.value;if(v===''||Number(v)<=0)delete S.draft[inp.dataset.id];else S.draft[inp.dataset.id]=v;saveDraft()});updatePending()}"
          new="document.querySelectorAll('.qty').forEach(inp=>inp.oninput=()=>{const v=inp.value;if(v===''||Number(v)<=0)delete S.draft[inp.dataset.id];else S.draft[inp.dataset.id]=v;saveDraft()});updatePending();publishState()}"
          assert old in s, 'render tail missing'
          s=s.replace(old,new,1)
          pattern=re.compile(r"\$\('#saveBtn'\)\.onclick=async\(\)=>\{.*?\};\nif\(S\.token\)bootstrap\(\);",re.S)
          repl="$('#saveBtn').onclick=async()=>{\n const b=$('#saveBtn');if(b.disabled)return;\n const note=$('#batchNote')?.value.trim()||'',oldText=b.textContent;\n b.disabled=true;b.textContent='جاري التحقق...';\n try{\n  const moved=await ensureCurrentDay(true);\n  const entries={};for(const [id,v] of Object.entries(S.draft)){const q=Number(v);if(q>0)entries[id]=q}\n  const n=Object.keys(entries).length;if(!n){updatePending();return}\n  if(moved)toast('تم تحديث تاريخ الاستلام تلقائيًا إلى اليوم');\n  if(!confirm(`حفظ دفعة استلام تحتوي على ${n} صنف؟\\nسيتم إضافتها إلى إجمالي استلامات اليوم.`))return;\n  b.textContent='جاري الحفظ...';\n  const d=await api('receiving_post',{date:S.date,entries,note});S.data=d.data;clearDraft();render();toast('تم حفظ دفعة الاستلام وربط الوارد بالجرد المسائي')\n }catch(e){toast(e.message,true);updatePending()}finally{b.textContent=oldText;updatePending()}\n};\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDateOnResume()});\nwindow.addEventListener('focus',syncDateOnResume);\nif(S.token)bootstrap();"
          s2,n=pattern.subn(repl,s,count=1)
          assert n==1, f'save handler replacement count={n}'
          p.write_text(s2,encoding='utf-8')
          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text(encoding='utf-8')
          assert "if(window.__morningReportV2)return;window.__morningReportV2=true;" in s, 'report guard missing'
          s=s.replace("if(window.__morningReportV2)return;window.__morningReportV2=true;","if(window.__morningReportV3)return;window.__morningReportV3=true;",1)
          old="function savedBatchCount(){return document.querySelectorAll('.history .batch').length}"
          new="function savedBatchCount(){const st=window.__morningReceivingState;if(st?.data&&st.date===visibleDate())return (st.data.batches||[]).length;return document.querySelectorAll('.history .batch').length}"
          assert old in s, 'savedBatchCount anchor missing'
          s=s.replace(old,new,1)
          pattern=re.compile(r"async function share\(kind\)\{.*?\}\naddStyle\(\);",re.S)
          repl="async function share(kind){const box=$('#morningReportActions');if(box?.classList.contains('morning-report-busy'))return;box?.classList.add('morning-report-busy');try{const r=await build(),date=ddmmyyyy(r.date),caption=`الاستلام الصباحي - ${r.branch} - ${date}`;if(kind==='images'){const files=r.blobs.map((b,i)=>new File([b],`${r.branch} ${date} ${i+1}.jpg`,{type:'image/jpeg'}));if(navigator.share){const canImages=!navigator.canShare||navigator.canShare({files});if(canImages){try{await navigator.share({files,text:caption});return}catch(e){if(e?.name==='AbortError')return}}}files.forEach(f=>download(f,f.name));alert('تم تنزيل صور التقرير لأن المشاركة المباشرة غير مدعومة على هذا الجهاز.')}else{const pdf=await pdfFromJpegs(r.blobs),file=new File([pdf],`${r.branch} ${date}.pdf`,{type:'application/pdf'});if(navigator.share){const canPdf=!navigator.canShare||navigator.canShare({files:[file]});if(canPdf){try{await navigator.share({files:[file],title:'تقرير الاستلام الصباحي',text:caption});return}catch(e){if(e?.name==='AbortError')return}}}download(file,file.name);alert('تم تنزيل ملف PDF لأن المشاركة المباشرة غير مدعومة على هذا الجهاز.')}}catch(e){if(e?.name!=='AbortError')alert(e?.message||'تعذر تجهيز تقرير الاستلام')}finally{box?.classList.remove('morning-report-busy')}}\naddStyle();"
          s2,n=pattern.subn(repl,s,count=1)
          assert n==1, f'share replacement count={n}'
          s=s2
          old="addStyle();syncActionState();const content=$('#content');"
          new="addStyle();syncActionState();window.addEventListener('morning-receiving-state',syncActionState);const content=$('#content');"
          assert old in s, 'state listener anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          p=Path('inventory/morning-shell.html')
          s=p.read_text(encoding='utf-8')
          assert '/inventory/morning/index.html?inner=2' in s, 'iframe version anchor missing'
          assert 'morning-report-v1.js?v=1' in s, 'report version anchor missing'
          s=s.replace('/inventory/morning/index.html?inner=2','/inventory/morning/index.html?inner=3',1)
          s=s.replace('morning-report-v1.js?v=1','morning-report-v1.js?v=2',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify patches
        run: |
          grep -q "ensureCurrentDay" inventory/morning/index.html
          grep -q "morning-receiving-state" inventory/morning/index.html
          grep -q "__morningReportV3" inventory/morning/morning-report-v1.js
          grep -q "navigator.share({files,text:caption})" inventory/morning/morning-report-v1.js
          grep -q "inner=3" inventory/morning-shell.html
          grep -q "morning-report-v1.js?v=2" inventory/morning-shell.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/morning/index.html inventory/morning/morning-report-v1.js inventory/morning-shell.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix morning receiving save state and report sharing"
            git push origin main
          fi