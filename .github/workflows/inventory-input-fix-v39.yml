name: Inventory input unlock v39
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-input-fix-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix incoming input locking
        shell: python
        run: |
          from pathlib import Path
          p = Path('inventory/receiving-link-v4.js')
          s = p.read_text(encoding='utf-8')
          start = s.index("incoming.forEach(inp=>{")
          end = s.index("stock.forEach(inp=>{", start)
          new = """incoming.forEach(inp=>{\n const id=inp.dataset.id,total=Number(tot[id]||0),parent=inp.parentElement;\n if(morningActive&&total>0){\n  linked++;\n  if(Number(inp.value)!==total){inp.value=fmt(total);inp.dispatchEvent(new Event('input',{bubbles:true}))}\n  inp.readOnly=true;inp.classList.add('auto-incoming');inp.dataset.morningChecked='1';\n  let note=parent?.querySelector('.morning-linked');if(!note&&parent){note=document.createElement('small');note.className='morning-linked';parent.appendChild(note)}\n  if(note)note.textContent='من الاستلام الصباحي';\n }else{\n  if(inp.classList.contains('auto-incoming')&&Number(inp.value)!==0){inp.value='0';inp.dispatchEvent(new Event('input',{bubbles:true}))}\n  inp.readOnly=false;inp.classList.remove('auto-incoming');inp.dataset.morningChecked='1';\n  let note=parent?.querySelector('.morning-linked');\n  if(morningActive){if(!note&&parent){note=document.createElement('small');note.className='morning-linked';parent.appendChild(note)}if(note)note.textContent='لا يوجد استلام صباحي — يمكن الإدخال يدويًا'}else note?.remove();\n }\n});\n"""
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')

          i = Path('inventory/index.html')
          t = i.read_text(encoding='utf-8')
          if '/inventory/receiving-link-v4.js?v=4' not in t:
              raise SystemExit('expected receiving cache marker not found')
          t = t.replace('/inventory/receiving-link-v4.js?v=4','/inventory/receiving-link-v4.js?v=5')
          t = t.replace('/inventory/original.html?v=38','/inventory/original.html?v=39')
          i.write_text(t, encoding='utf-8')
      - name: Verify patch
        shell: bash
        run: |
          grep -q "morningActive&&total>0" inventory/receiving-link-v4.js
          grep -q "يمكن الإدخال يدويًا" inventory/receiving-link-v4.js
          grep -q "receiving-link-v4.js?v=5" inventory/index.html
          grep -q "original.html?v=39" inventory/index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/receiving-link-v4.js inventory/index.html
          git commit -m "Inventory v39: unlock manual incoming when no morning receipt"
          git push