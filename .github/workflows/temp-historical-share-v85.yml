name: Temporary historical share loader v85
on:
  push:
    paths:
      - '.github/workflows/temp-historical-share-v85.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load historical share before approval guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old="addScript(d,'branch-report-stable-v57-js','/inventory/branch-report-stable-v57.js?v=11');"
          new="addScript(d,'historical-share-v85-js','/inventory/historical-share-v85.js?v=1');addScript(d,'branch-report-stable-v57-js','/inventory/branch-report-stable-v57.js?v=11');"
          if old not in s:
              raise SystemExit('branch loader marker not found')
          s=s.replace(old,new)
          s=s.replace("/inventory/original.html?v=66","/inventory/original.html?v=67")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Activate reliable historical daily sharing v85"
          git push