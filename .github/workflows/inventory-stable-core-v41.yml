name: Inventory stable core v41
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-stable-core-v41.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch branch pages to core-only mode
        shell: python
        run: |
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old="""function enhanceWhenReady(){clearTimeout(bootTimer);let tries=0;const tick=()=>{try{const d=frame.contentDocument;if(!d)return;addStyles(d);const h=(d.querySelector('.head h2')?.textContent||'').trim();const ready=!!h||!!d.querySelector('.section,.dash,.admintable,.adminform');if(!ready){if(++tries<100)bootTimer=setTimeout(tick,100);return}addScript(d,'pro-v16-js','/inventory/pro-v13.js?v=16');addScript(d,'manager-v17-js','/inventory/manager-v17.js?v=17');addScript(d,'mazaq-flat-v22-js','/inventory/mazaq-flat-v22.js?v=22');if(h==='لوحة المدير')addScript(d,'receiving-link-v4-js','/inventory/receiving-link-v4.js?v=5');else addScript(d,'receiving-report-stable-v40-js','/inventory/receiving-report-stable-v40.js?v=1');addScript(d,'report-v33-bridge-js','/inventory/report-v33-bridge.js?v=1');addScript(d,'report-v33-js','/inventory/report-v33.js?v=34')}catch(e){}};tick()}"""
          new="""function enhanceWhenReady(){clearTimeout(bootTimer);let tries=0;const tick=()=>{try{const d=frame.contentDocument;if(!d)return;const h=(d.querySelector('.head h2')?.textContent||'').trim();const ready=!!h||!!d.querySelector('.section,.dash,.admintable,.adminform');if(!ready){if(++tries<100)bootTimer=setTimeout(tick,100);return}if(h!=='لوحة المدير')return;addStyles(d);addScript(d,'pro-v16-js','/inventory/pro-v13.js?v=16');addScript(d,'manager-v17-js','/inventory/manager-v17.js?v=17');addScript(d,'receiving-link-v4-js','/inventory/receiving-link-v4.js?v=5');addScript(d,'report-v33-bridge-js','/inventory/report-v33-bridge.js?v=1');addScript(d,'report-v33-js','/inventory/report-v33.js?v=34')}catch(e){}};tick()}"""
          if old not in s:
              raise SystemExit('enhance block not found')
          s=s.replace(old,new)
          s=s.replace("frame.src='/inventory/original.html?v=40'","frame.src='/inventory/original.html?v=41'")
          p.write_text(s,encoding='utf-8')
      - name: Verify core-only branch mode
        run: |
          grep -q "if(h!=='لوحة المدير')return" inventory/index.html
          grep -q "original.html?v=41" inventory/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('inventory/index.html').read_text()
          block=s[s.index('function enhanceWhenReady'):s.index('frame.addEventListener',s.index('function enhanceWhenReady'))]
          assert 'receiving-report-stable-v40' not in block
          assert 'mazaq-flat-v22' not in block
          print('branch core-only verified')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v41: core-only stable branch mode"
          git push