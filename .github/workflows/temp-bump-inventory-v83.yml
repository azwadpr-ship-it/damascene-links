name: Temporary inventory approval cache bump v83
on:
  push:
    paths:
      - '.github/workflows/temp-bump-inventory-v83.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump inventory caches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace("/inventory/branch-report-stable-v57.js?v=9", "/inventory/branch-report-stable-v57.js?v=10")
          s=s.replace("/inventory/original.html?v=64", "/inventory/original.html?v=65")
          if s==old:
              raise SystemExit('expected cache strings not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Activate inventory approval fix v83"
          git push