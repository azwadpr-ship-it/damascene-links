name: Inventory report PDF fix v56
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-report-pdf-fix-v56.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v56 PDF newline fix
        run: python .github/scripts/inventory_report_pdf_fix_v56.py
      - name: Verify
        run: |
          grep -q "branch-report-stable-v56.js?v=1" inventory/index.html
          grep -q "original.html?v=56" inventory/index.html
          node --check inventory/report-v32.js
          python - <<'PY'
          from pathlib import Path
          s=Path('inventory/report-v32.js').read_text(encoding='utf-8')
          a=s[s.index('async function pdfFromJpegs'):s.index('async function download(files)')]
          assert '\\\\n' not in a
          assert "push('%PDF-1.4\\n%DMG1\\n')" in a
          print('PDF newline encoding OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/index.html
          git commit -m "Inventory v56 fix PDF binary structure"
          git push
