name: Inventory exact report v44
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-report-v44.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch stable branch report loader to exact previous template
        shell: python
        run: |
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old="addScript(d,'branch-report-lazy-v43-js','/inventory/branch-report-lazy-v43.js?v=1');return}addStyles(d);"
          new="addScript(d,'branch-report-lazy-v44-js','/inventory/branch-report-lazy-v44.js?v=1');return}addStyles(d);"
          if old not in s:
              raise SystemExit('v43 lazy hook not found')
          s=s.replace(old,new,1)
          if "/inventory/original.html?v=43" not in s:
              raise SystemExit('v43 original marker not found')
          s=s.replace('/inventory/original.html?v=43','/inventory/original.html?v=44',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q "branch-report-lazy-v44.js?v=1" inventory/index.html
          grep -q "original.html?v=44" inventory/index.html
          ! grep -q "branch-report-lazy-v43.js?v=1" inventory/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v44: restore exact previous professional report lazily"
          git push
