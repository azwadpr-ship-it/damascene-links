name: Inventory manager stable reveal v58
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-manager-stable-reveal-v58.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v58 manager stable reveal patch
        run: python .github/scripts/inventory_manager_stable_reveal_v58.py
      - name: Verify
        run: |
          grep -q "managerWaitStart=Date.now()" inventory/index.html
          grep -q "elapsed>=900" inventory/index.html
          grep -q "stableHits>=3" inventory/index.html
          grep -q "original.html?v=58" inventory/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v58 wait for stable manager layout before reveal"
          git push
