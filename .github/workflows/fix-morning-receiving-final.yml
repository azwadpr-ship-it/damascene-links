name: Fix morning receiving final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-morning-receiving-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch morning receiving
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          idx = Path('inventory/morning/index.html')
          s = idx.read_text()

          # Drafts are date-bound. Never migrate yesterday's unsaved entries into today.
          pat = r"function loadDraft\(\)\{.*?\nfunction saveDraft\(\)"
          repl = "function loadDraft(){try{S.draft=JSON.parse(localStorage.getItem(draftKey())||'{}')||{}}catch{S.draft={}}}\nfunction saveDraft()"
          s2, n = re.subn(pat, repl, s, count=1, flags=re.S)
          assert n == 1, f'loadDraft patch count={n}'
          s = s2

          pat = r"async function ensureCurrentDay\(migrateDraft=true\)\{.*?\nasync function syncDateOnResume\(\)"
          repl = "async function ensureCurrentDay(){const now=today();if(!S.date||S.date===now)return false;S.date=now;const d=await api('receiving_load',{date:S.date});S.data=await enrichSnapshot(d.data);loadDraft();render();return true}\nasync function syncDateOnResume()"
          s2, n = re.subn(pat, repl, s, count=1, flags=re.S)
          assert n == 1, f'ensureCurrentDay patch count={n}'
          s = s2
          idx.write_text(s)

          # Create a clean receiving-only report engine.
          src = Path('inventory/morning/morning-report-v1-base-v12.js')
          dst = Path('inventory/morning/morning-report-v1-base-v13.js')
          shutil.copyfile(src, dst)
          b = dst.read_text()
          b = b.replace('if(window.__morningReportV12)return;window.__morningReportV12=true;', 'if(window.__morningReportV13)return;window.__morningReportV13=true;', 1)

          old = "async function loadDay(date){const loaded=await post('receiving_load',{date});try{loaded.data.inventory_snapshot=await snapshot(date)}catch(e){console.error('morning report snapshot',e)}return loaded}"
          new = "async function loadDay(date){return await post('receiving_load',{date})}"
          assert old in b
          b = b.replace(old, new, 1)

          old = "function reportItemCount(data){const batches=(data?.batches||[]).length;if(batches)return Object.values(data?.totals||{}).filter(v=>Number(v)>0).length;return Number(data?.inventory_snapshot?.count||0)}"
          new = "function reportItemCount(data){if(!(data?.batches||[]).length)return 0;return Object.values(data?.totals||{}).filter(v=>Number(v)>0).length}"
          assert old in b
          b = b.replace(old, new, 1)

          old = "if(hint){const count=(r.data?.batches||[]).length,itemCount=reportItemCount(r.data),fallback=!count&&itemCount>0;hint.textContent=fallback?`تقرير الحالة الصباحية — آخر جرد ${r.data.inventory_snapshot?.date||''} / ${itemCount} صنف — جاهز للمشاركة`:`تقرير اليوم الكامل — ${count} دفعة / ${itemCount} صنف — ${ddmmyyyy(date)} — جاهز للمشاركة`}"
          new = "if(hint){const count=(r.data?.batches||[]).length,itemCount=reportItemCount(r.data);hint.textContent=`تقرير اليوم الكامل — ${count} دفعة / ${itemCount} صنف — ${ddmmyyyy(date)} — جاهز للمشاركة`}"
          assert old in b
          b = b.replace(old, new, 1)

          old = "async function refreshReportState(){injectActions();const card=$('#morningReportActions');if(!card)return;const date=reportDate(),seq=++reportCheckSeq,hint=$('#morningReportHint'),images=$('#morningShareImages'),pdf=$('#morningSharePdf');if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.add('morning-report-empty');if(hint)hint.textContent='جاري التحقق من التقرير المحفوظ...';try{const loaded=await loadDay(date);if(seq!==reportCheckSeq)return;const count=(loaded.data?.batches||[]).length,itemCount=reportItemCount(loaded.data),fallback=!count&&itemCount>0,pending=pendingDraftCount(),disabled=!count&&!fallback&&!pending;preparedReport=null;prepareSeq++;if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.toggle('morning-report-empty',disabled);if(disabled){if(hint)hint.textContent=date===today()?'لا توجد دفعات استلام أو جرد محفوظ لهذا اليوم حتى الآن.':`لا توجد بيانات محفوظة بتاريخ ${ddmmyyyy(date)}.`}else if(pending){if(images)images.disabled=false;if(pdf)pdf.disabled=false;if(hint)hint.textContent=`${pending} صنف جديد غير محفوظ — عند المشاركة سيتم حفظ الدفعة تلقائيًا ثم إرسال تقرير اليوم الكامل.`}else if(fallback){if(hint)hint.textContent=`لا توجد دفعات استلام بعد — سيتم إنشاء تقرير حالة صباحية من آخر جرد محفوظ بتاريخ ${loaded.data.inventory_snapshot?.date||''} (${itemCount} صنف).`;prepareReport(date)}else{if(hint)hint.textContent=`جاري تجهيز تقرير اليوم الكامل — ${count} دفعة / ${itemCount} صنف...`;prepareReport(date)}}catch(e){if(seq!==reportCheckSeq)return;if(hint)hint.textContent=e?.message||'تعذر التحقق من التقرير'}}"
          new = "async function refreshReportState(){injectActions();const card=$('#morningReportActions');if(!card)return;const date=reportDate(),seq=++reportCheckSeq,hint=$('#morningReportHint'),images=$('#morningShareImages'),pdf=$('#morningSharePdf');if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.add('morning-report-empty');if(hint)hint.textContent='جاري التحقق من دفعات الاستلام الصباحي...';try{const loaded=await loadDay(date);if(seq!==reportCheckSeq)return;const count=(loaded.data?.batches||[]).length,itemCount=reportItemCount(loaded.data),pending=pendingDraftCount(),disabled=!count&&!pending;preparedReport=null;prepareSeq++;card.classList.toggle('morning-report-empty',disabled);if(disabled){if(hint)hint.textContent=date===today()?'لا توجد دفعات استلام صباحي محفوظة لهذا اليوم حتى الآن.':`لا توجد دفعات استلام صباحي محفوظة بتاريخ ${ddmmyyyy(date)}.`}else if(pending){if(images)images.disabled=false;if(pdf)pdf.disabled=false;if(hint)hint.textContent=`${pending} صنف جديد غير محفوظ — عند المشاركة سيتم حفظ الدفعة أولًا ثم إرسال تقرير الاستلام الصباحي الكامل.`}else{if(images)images.disabled=false;if(pdf)pdf.disabled=false;if(hint)hint.textContent=`تقرير الاستلام الصباحي — ${count} دفعة / ${itemCount} صنف — جاهز للمشاركة`;prepareReport(date)}}catch(e){if(seq!==reportCheckSeq)return;if(hint)hint.textContent=e?.message||'تعذر التحقق من دفعات الاستلام الصباحي'}}"
          assert old in b
          b = b.replace(old, new, 1)

          old = "function groupTotals(data){const bySec=new Map(),hasBatches=(data.batches||[]).length>0,tot=hasBatches?(data.totals||{}):(data.inventory_snapshot?.values||{});(data.items||[]).forEach(i=>{const raw=tot[i.id];if(raw===undefined||raw===null||raw==='')return;const qty=Number(raw);if(!Number.isFinite(qty))return;if(!hasBatches&&qty===0)return;if(hasBatches&&!(qty>0))return;if(!bySec.has(i.section))bySec.set(i.section,[]);bySec.get(i.section).push({name:i.name,unit:i.unit,qty})});return Array.from(bySec,([section,rows])=>({section,rows}))}"
          new = "function groupTotals(data){const bySec=new Map();if(!(data.batches||[]).length)return[];const tot=data.totals||{};(data.items||[]).forEach(i=>{const raw=tot[i.id];if(raw===undefined||raw===null||raw==='')return;const qty=Number(raw);if(!Number.isFinite(qty)||!(qty>0))return;if(!bySec.has(i.section))bySec.set(i.section,[]);bySec.get(i.section).push({name:i.name,unit:i.unit,qty})});return Array.from(bySec,([section,rows])=>({section,rows}))}"
          assert old in b
          b = b.replace(old, new, 1)

          # Snapshot helper can remain unused, but no report path may consume inventory_snapshot.
          assert 'fallback=!count' not in b
          assert 'data.inventory_snapshot?.values' not in b
          assert 'تقرير الحالة الصباحية' not in b
          dst.write_text(b)

          # Wrapper: use clean v13 and stop injecting the historical-inventory fallback.
          wpath = Path('inventory/morning/morning-report-v1.js')
          w = wpath.read_text()
          w = w.replace('if(window.__morningReportWrapperV94)return;window.__morningReportWrapperV94=true;', 'if(window.__morningReportWrapperV95)return;window.__morningReportWrapperV95=true;', 1)
          w = w.replace("/inventory/morning/morning-report-v1-base-v12.js?v=10", "/inventory/morning/morning-report-v1-base-v13.js?v=1", 1)
          pat = r"\n const oldDay=.*?\n code=code\.replace\(oldDay,newDay\);"
          w2, n = re.subn(pat, '', w, count=1, flags=re.S)
          assert n == 1, f'wrapper fallback removal count={n}'
          w = w2
          assert 'const oldDay=' not in w
          assert 'inventory_snapshot=snap' not in w
          wpath.write_text(w)

          # Force fresh inner page and report wrapper.
          shell = Path('inventory/morning-shell.html')
          sh = shell.read_text()
          sh = sh.replace('/inventory/morning/index.html?inner=18', '/inventory/morning/index.html?inner=19', 1)
          sh = sh.replace('/inventory/morning/morning-report-v1.js?v=19', '/inventory/morning/morning-report-v1.js?v=20', 1)
          shell.write_text(sh)

          # Final static assertions.
          assert "function loadDraft(){try{S.draft=JSON.parse(localStorage.getItem(draftKey())||'{}')||{}}catch{S.draft={}}}" in idx.read_text()
          assert 'تم نقل المدخلات غير المحفوظة من أمس إلى اليوم' not in idx.read_text()
          assert 'receiving_draft_${branchId}_${prevDate}' not in idx.read_text()
          assert 'morning-report-v1-base-v13.js?v=1' in wpath.read_text()
          assert 'inner=19' in shell.read_text()
          assert 'morning-report-v1.js?v=20' in shell.read_text()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/morning/index.html inventory/morning/morning-report-v1-base-v13.js inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m "Fix morning receiving save and receiving-only reports"
          git push
