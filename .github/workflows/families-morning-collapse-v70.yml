name: Families morning collapse v70
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/families-morning-collapse-v70.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch families morning default section state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('inventory/morning/index.html')
          s=p.read_text(encoding='utf-8')
          old="${idx===0||S.query?'open':''}"
          new="${S.query||(S.branch?.id!=='families'&&idx===0)?'open':''}"
          if old not in s:
              raise SystemExit('render open marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('inventory/morning-shell.html')
          s=p.read_text(encoding='utf-8')
          if 'index.html?inner=11' not in s:
              raise SystemExit('inner cache marker missing')
          s=s.replace('index.html?inner=11','index.html?inner=12',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -Fq "S.query||(S.branch?.id!='families'&&idx===0)" inventory/morning/index.html || grep -Fq "S.query||(S.branch?.id!=='families'&&idx===0)" inventory/morning/index.html
          grep -q 'index.html?inner=12' inventory/morning-shell.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/families-morning-collapse-v70.yml
          git add inventory/morning/index.html inventory/morning-shell.html
          git commit -m "Collapse families morning sections by default"
          git push