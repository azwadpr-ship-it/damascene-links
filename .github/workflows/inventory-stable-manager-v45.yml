name: Inventory stable manager v45
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-stable-manager-v45.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove observer-heavy manager runtime and install stable report interceptor
        shell: python
        run: |
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old_branch="addScript(d,'branch-report-lazy-v44-js','/inventory/branch-report-lazy-v44.js?v=1');return}addStyles(d);"
          new_branch="addScript(d,'branch-report-stable-v45-js','/inventory/branch-report-stable-v45.js?v=1');return}addStyles(d);"
          if old_branch not in s:
              raise SystemExit('v44 branch hook not found')
          s=s.replace(old_branch,new_branch,1)
          old_manager="addStyles(d);addScript(d,'pro-v16-js','/inventory/pro-v13.js?v=16');addScript(d,'manager-v17-js','/inventory/manager-v17.js?v=17');addScript(d,'receiving-link-v4-js','/inventory/receiving-link-v4.js?v=5');addScript(d,'report-v33-bridge-js','/inventory/report-v33-bridge.js?v=1');addScript(d,'report-v33-js','/inventory/report-v33.js?v=34')"
          new_manager="addStyles(d);addScript(d,'branch-report-stable-v45-js','/inventory/branch-report-stable-v45.js?v=1');addScript(d,'manager-stable-v45-js','/inventory/manager-stable-v45.js?v=1')"
          if old_manager not in s:
              raise SystemExit('observer-heavy manager hook not found')
          s=s.replace(old_manager,new_manager,1)
          if "/inventory/original.html?v=44" not in s:
              raise SystemExit('v44 original marker not found')
          s=s.replace('/inventory/original.html?v=44','/inventory/original.html?v=45',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q "branch-report-stable-v45.js?v=1" inventory/index.html
          grep -q "manager-stable-v45.js?v=1" inventory/index.html
          grep -q "original.html?v=45" inventory/index.html
          ! grep -q "manager-v17.js?v=17" inventory/index.html
          ! grep -q "receiving-link-v4.js?v=5" inventory/index.html
          ! grep -q "report-v33.js?v=34" inventory/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v45: stabilize manager and force professional report path"
          git push
