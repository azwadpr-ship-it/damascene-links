name: Run Individuals report polish v74
on:
  push:
    branches: [main]
    paths: ['.github/trigger-individuals-report-v74.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply report polish
        run: python3 .github/individuals-report-polish-v74.py
      - name: Commit and clean temporary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/trigger-individuals-report-v74.txt .github/individuals-report-polish-v74.py .github/workflows/run-individuals-report-polish-v74.yml .github/workflows/individuals-report-polish-v74.yml
          git add inventory/report-v32.js inventory/branch-report-stable-v57.js inventory/index.html
          git commit -m 'Polish Individuals daily inventory report'
          git push origin main
