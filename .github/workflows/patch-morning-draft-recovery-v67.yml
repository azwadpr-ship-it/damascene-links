name: Patch morning stale draft recovery v67
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morning-draft-recovery-v67.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale draft recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inventory/morning/index.html')
          s=p.read_text(encoding='utf-8')
          old="function loadDraft(){try{S.draft=JSON.parse(localStorage.getItem(draftKey())||'{}')||{}}catch{S.draft={}}"
          new="function loadDraft(){try{const currentKey=draftKey(),current=JSON.parse(localStorage.getItem(currentKey)||'{}')||{};if(Object.keys(current).length){S.draft=current;return}const base=new Date((S.date||today())+'T12:00:00+03:00');base.setDate(base.getDate()-1);const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(base),o={};parts.forEach(x=>o[x.type]=x.value);const prevDate=`${o.year}-${o.month}-${o.day}`,branchId=S.branch?.id||S.user?.branch_id||'',prevKey=`receiving_draft_${branchId}_${prevDate}`,prev=JSON.parse(localStorage.getItem(prevKey)||'{}')||{};if(Object.keys(prev).length){S.draft=prev;localStorage.setItem(currentKey,JSON.stringify(prev));localStorage.removeItem(prevKey);setTimeout(()=>toast('تم نقل المدخلات غير المحفوظة من أمس إلى اليوم'),50)}else S.draft={}}catch{S.draft={}}}"
          assert old in s, 'loadDraft anchor missing'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('inventory/morning-shell.html')
          s=p.read_text(encoding='utf-8')
          assert '/inventory/morning/index.html?inner=3' in s
          p.write_text(s.replace('/inventory/morning/index.html?inner=3','/inventory/morning/index.html?inner=4',1),encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "تم نقل المدخلات غير المحفوظة من أمس إلى اليوم" inventory/morning/index.html
          grep -q "inner=4" inventory/morning-shell.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/morning/index.html inventory/morning-shell.html
          git commit -m "Recover stale morning drafts on the new day"
          git push origin main