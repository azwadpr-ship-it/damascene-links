name: Families unified identity v73
on:
  push:
    branches: [main]
    paths: ['.github/workflows/families-unified-identity-v73.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Families identity patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(s, old, new, label):
              if old not in s:
                  raise SystemExit('MISSING '+label)
              return s.replace(old,new,1)

          # Daily shell injection + cache bust.
          p=Path('inventory/index.html'); s=p.read_text()
          s=one(s,"addScript(d,'individuals-supervisor-brand-v1-js','/inventory/individuals-supervisor-brand-v1.js?v=1');requestAnimationFrame(revealFrame)","addScript(d,'individuals-supervisor-brand-v1-js','/inventory/individuals-supervisor-brand-v1.js?v=1');addScript(d,'families-supervisor-brand-v1-js','/inventory/families-supervisor-brand-v1.js?v=1');requestAnimationFrame(revealFrame)",'daily branch family injection')
          s=one(s,"addScript(d,'individuals-supervisor-brand-v1-js','/inventory/individuals-supervisor-brand-v1.js?v=1');let revealTries=0","addScript(d,'individuals-supervisor-brand-v1-js','/inventory/individuals-supervisor-brand-v1.js?v=1');addScript(d,'families-supervisor-brand-v1-js','/inventory/families-supervisor-brand-v1.js?v=1');let revealTries=0",'daily manager family injection')
          s=s.replace('/inventory/branch-report-stable-v57.js?v=6','/inventory/branch-report-stable-v57.js?v=7')
          p.write_text(s)

          # Daily report Families theme and logo.
          p=Path('inventory/report-v32.js'); s=p.read_text()
          s=one(s,"const INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nlet individualsReportLogo=null,individualsReportLogoLoading=null;","const INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nconst FAMILIES_REPORT_LOGO='/inventory/families-brand-logo.jpg?v=1';\nlet individualsReportLogo=null,individualsReportLogoLoading=null,familiesReportLogo=null,familiesReportLogoLoading=null;",'daily family logo const')
          loader="function loadIndividualsReportLogo(){\n if(individualsReportLogo)return Promise.resolve(individualsReportLogo);\n if(individualsReportLogoLoading)return individualsReportLogoLoading;\n individualsReportLogoLoading=new Promise(resolve=>{const img=new Image();img.onload=()=>{individualsReportLogo=img;resolve(img)};img.onerror=()=>resolve(null);img.src=INDIVIDUALS_REPORT_LOGO});\n return individualsReportLogoLoading;\n}\n"
          s=one(s,loader,loader+"function loadFamiliesReportLogo(){\n if(familiesReportLogo)return Promise.resolve(familiesReportLogo);\n if(familiesReportLogoLoading)return familiesReportLogoLoading;\n familiesReportLogoLoading=new Promise(resolve=>{const img=new Image();img.onload=()=>{familiesReportLogo=img;resolve(img)};img.onerror=()=>resolve(null);img.src=FAMILIES_REPORT_LOGO});\n return familiesReportLogoLoading;\n}\n",'daily family loader')
          s=one(s," if(r.branch.includes('المشويات أفراد'))return{mode:'individuals',paper:'#f4f5f5',surface:'#ffffff',accent:'#df9022',dark:'#3b3d3f',text:'#3b3d3f',muted:'#717477',line:'#d2d4d5',stripe:'#f4f4f4',soft:'#f7efe4'};"," if(r.branch.includes('المشويات أفراد'))return{mode:'individuals',paper:'#f4f5f5',surface:'#ffffff',accent:'#df9022',dark:'#3b3d3f',text:'#3b3d3f',muted:'#717477',line:'#d2d4d5',stripe:'#f4f4f4',soft:'#f7efe4'};\n if(r.branch.includes('المشويات عوائل'))return{mode:'families',paper:'#faf7f0',surface:'#fffdf9',accent:'#b1740a',dark:'#6b4310',text:'#3d3021',muted:'#7a6a57',line:'#e4d3b8',stripe:'#fbf7ef',soft:'#f4eadb'};",'daily family theme')
          s=one(s,"c.strokeStyle=t.mode==='mazaq'?'#d3d4d6':t.mode==='individuals'?'#c9cbcc':'#eadab8';","c.strokeStyle=t.mode==='mazaq'?'#d3d4d6':t.mode==='individuals'?'#c9cbcc':t.mode==='families'?'#ddc79f':'#eadab8';",'daily family border')
          s=one(s,"const d=dateParts(r.reportDate),branded=t.mode==='individuals'&&individualsReportLogo;","const d=dateParts(r.reportDate),logo=t.mode==='individuals'?individualsReportLogo:t.mode==='families'?familiesReportLogo:null,branded=!!logo;",'daily family header')
          s=one(s,"c.drawImage(individualsReportLogo,P.W-P.M-92,42,82,82);","c.drawImage(logo,P.W-P.M-92,42,82,82);",'daily family draw logo')
          s=s.replace("(t.mode==='mazaq'||t.mode==='individuals')","(['mazaq','individuals','families'].includes(t.mode))")
          s=one(s,"if(t.mode==='individuals')await loadIndividualsReportLogo();","if(t.mode==='individuals')await loadIndividualsReportLogo();if(t.mode==='families')await loadFamiliesReportLogo();",'daily family preload')
          p.write_text(s)

          p=Path('inventory/branch-report-stable-v57.js'); s=p.read_text().replace('report-v32-v65-js','report-v32-v66-js').replace('/inventory/report-v32.js?v=65','/inventory/report-v32.js?v=66'); p.write_text(s)

          # Morning inner Families branding.
          p=Path('inventory/morning/index.html'); s=p.read_text()
          s=one(s,"brand?.classList.remove('individuals-logo');","brand?.classList.remove('individuals-logo','families-logo');",'morning family logo class')
          marker=" }else{\n  root.style.setProperty('--accent','#0f6f78');"
          insert=" }else if(id==='families'){\n  root.style.setProperty('--accent','#b1740a');root.style.setProperty('--dark','#6b4310');root.style.setProperty('--bg','#f8f4ed');root.style.setProperty('--card','#fffdf9');root.style.setProperty('--ink','#3d3021');root.style.setProperty('--muted','#7a6a57');root.style.setProperty('--line','#e4d3b8');root.style.setProperty('--soft','#f4eadb');if(theme)theme.content='#6b4310';\n  if(brand){brand.src='/inventory/families-brand-logo.jpg?v=1';brand.alt='المشويات الدمشقية عوائل';brand.classList.add('families-logo')}if(title)title.textContent='المشويات عوائل - تقرير الاستلام الصباحي';if(sub)sub.textContent='تسجيل المواد الواردة';\n }else{\n  root.style.setProperty('--accent','#0f6f78');"
          s=one(s,marker,insert,'morning family branch')
          p.write_text(s)

          # Morning outer shell Families palette and asset versions.
          p=Path('inventory/morning-shell.html'); s=p.read_text()
          family_css='''html[data-branch="families"]{--accent:#b1740a!important;--dark:#6b4310!important;--bg:#f8f4ed!important;--card:#fffdf9!important;--ink:#3d3021!important;--muted:#7a6a57!important;--line:#e4d3b8!important;--soft:#f4eadb!important;--shadow:0 10px 28px rgba(90,58,18,.08)!important}\nhtml[data-branch="families"],html[data-branch="families"] body{background:#f8f4ed!important;color:#3d3021!important}\nhtml[data-branch="families"] .top{background:rgba(255,253,249,.98)!important;border-bottom-color:#e4d3b8!important}\nhtml[data-branch="families"] .top-title{border-right-color:#e4d3b8!important}html[data-branch="families"] .top-title b{color:#4b351c!important}html[data-branch="families"] .top-title small{color:#7a5a28!important}\nhtml[data-branch="families"] .topbrand img.families-logo{width:58px!important;height:58px!important;object-fit:contain!important;max-width:none!important;border-radius:7px}\nhtml[data-branch="families"] .hero{background:linear-gradient(135deg,#f4eadb,#fffdf9)!important;border-color:#e4d3b8!important;border-top-color:#b1740a!important;box-shadow:0 10px 28px rgba(90,58,18,.08)!important}\nhtml[data-branch="families"] .purpose,html[data-branch="families"] .btn.primary{background:#b1740a!important;border-color:#b1740a!important;color:#fff!important}\nhtml[data-branch="families"] .stat,html[data-branch="families"] .section,html[data-branch="families"] .note-card,html[data-branch="families"] .history,html[data-branch="families"] .morning-report-actions{border-color:#e4d3b8!important}\nhtml[data-branch="families"] .stat strong,html[data-branch="families"] .total b,html[data-branch="families"] .batch-time{color:#b1740a!important}\nhtml[data-branch="families"] .section summary{background:linear-gradient(90deg,#f4eadb,#fffdf9)!important;color:#4b351c!important}\nhtml[data-branch="families"] .row{border-bottom-color:#eadfcd!important}\nhtml[data-branch="families"] .total{background:#f6eddf!important;border-color:#e4d3b8!important}\nhtml[data-branch="families"] .bottom{background:rgba(255,253,249,.98)!important;border-top-color:#e4d3b8!important;box-shadow:0 -5px 20px rgba(90,58,18,.06)!important}\nhtml[data-branch="families"] .toast{background:#5a3b17!important}\n'''
          s=one(s,'html[data-branch="mazaq"]{--accent:#b51f2e!important;',family_css+'html[data-branch="mazaq"]{--accent:#b51f2e!important;','morning shell family css')
          s=s.replace('/inventory/morning/index.html?inner=13','/inventory/morning/index.html?inner=14').replace('/inventory/morning/morning-report-v1.js?v=9','/inventory/morning/morning-report-v1.js?v=10')
          p.write_text(s)

          # Morning report Families palette and logo.
          p=Path('inventory/morning/morning-report-v1.js'); s=p.read_text()
          s=s.replace("if(window.__morningReportV10)return;window.__morningReportV10=true;","if(window.__morningReportV11)return;window.__morningReportV11=true;")
          s=one(s,"const INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';","const INDIVIDUALS_REPORT_LOGO='/inventory/individuals-brand-logo.svg?v=1';\nconst FAMILIES_REPORT_LOGO='/inventory/families-brand-logo.jpg?v=1';",'morning report family const')
          s=one(s,"function themeForBranch(id){if(id==='mazaq')return{paper:'#f5f5f5',card:'#fff',accent:'#b51f2e',dark:'#181818',ink:'#202020',muted:'#666',line:'#d6d6d6',soft:'#f3e8ea'};if(id==='individuals')return{paper:'#f4f5f5',card:'#fff',accent:'#df9022',dark:'#3b3d3f',ink:'#3b3d3f',muted:'#717477',line:'#d3d4d5',soft:'#f7efe4'};return","function themeForBranch(id){if(id==='mazaq')return{paper:'#f5f5f5',card:'#fff',accent:'#b51f2e',dark:'#181818',ink:'#202020',muted:'#666',line:'#d6d6d6',soft:'#f3e8ea'};if(id==='individuals')return{paper:'#f4f5f5',card:'#fff',accent:'#df9022',dark:'#3b3d3f',ink:'#3b3d3f',muted:'#717477',line:'#d3d4d5',soft:'#f7efe4'};if(id==='families')return{paper:'#faf7f0',card:'#fffdf9',accent:'#b1740a',dark:'#6b4310',ink:'#3d3021',muted:'#7a6a57',line:'#e4d3b8',soft:'#f4eadb'};return",'morning report family theme')
          s=one(s,"function loadIndividualsReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=INDIVIDUALS_REPORT_LOGO})}","function loadIndividualsReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=INDIVIDUALS_REPORT_LOGO})}\nfunction loadFamiliesReportLogo(){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=FAMILIES_REPORT_LOGO})}",'morning report family loader')
          s=one(s,"reportLogo=boot.branch?.id==='individuals'?await loadIndividualsReportLogo():null;","reportLogo=boot.branch?.id==='individuals'?await loadIndividualsReportLogo():boot.branch?.id==='families'?await loadFamiliesReportLogo():null;",'morning report family build')
          p.write_text(s)

          # Morning manager branch skin + summary card.
          p=Path('inventory/morning/manager.html'); s=p.read_text()
          css='''\nhtml[data-brand="families"]{--gold:#b1740a;--dark:#6b4310;--bg:#f8f4ed;--card:#fffdf9;--ink:#3d3021;--muted:#7a6a57;--line:#e4d3b8;--soft:#f4eadb}\nhtml[data-brand="families"] body{background:#f8f4ed;color:#3d3021}\nhtml[data-brand="families"] .top{background:rgba(255,253,249,.98)}html[data-brand="families"] .btn.primary{background:#b1740a;border-color:#b1740a}\nhtml[data-brand="families"] .brand img{width:58px;height:58px;object-fit:contain;border-radius:7px}\n.families-summary-card{border-top:4px solid #b1740a!important;background:linear-gradient(145deg,#fffdf9,#f7f0e5)!important}.families-summary-card:before{background:#b1740a!important}.families-summary-card .num b{color:#b1740a!important}\n.families-summary-logo{position:absolute;top:8px;right:9px;width:38px;height:38px;object-fit:contain;background:#fff;border-radius:6px}.families-summary-card h3{padding-right:43px}\n'''
          s=one(s,'</style></head>',css+'</style></head>','manager family css')
          s=one(s,"if(id==='individuals'){if(img){img.src='/inventory/individuals-brand-logo.svg?v=1';img.alt='المشويات الدمشقية'}if(title)title.textContent='المشويات أفراد - إدارة الاستلام الصباحي';if(sub)sub.textContent='متابعة وتدقيق الدفعات'}else{","if(id==='individuals'){if(img){img.src='/inventory/individuals-brand-logo.svg?v=1';img.alt='المشويات الدمشقية'}if(title)title.textContent='المشويات أفراد - إدارة الاستلام الصباحي';if(sub)sub.textContent='متابعة وتدقيق الدفعات'}else if(id==='families'){if(img){img.src='/inventory/families-brand-logo.jpg?v=1';img.alt='المشويات الدمشقية عوائل'}if(title)title.textContent='المشويات عوائل - إدارة الاستلام الصباحي';if(sub)sub.textContent='متابعة وتدقيق الدفعات'}else{",'manager family branch')
          s=one(s,"r.branch_id==='individuals'?'individuals-summary-card':''","r.branch_id==='individuals'?'individuals-summary-card':r.branch_id==='families'?'families-summary-card':''",'manager family summary class')
          s=one(s,"r.branch_id==='individuals'?'<img class=\"individuals-summary-logo\" src=\"/inventory/individuals-brand-logo.svg?v=1\" alt=\"المشويات الدمشقية\">':''","r.branch_id==='individuals'?'<img class=\"individuals-summary-logo\" src=\"/inventory/individuals-brand-logo.svg?v=1\" alt=\"المشويات الدمشقية\">':r.branch_id==='families'?'<img class=\"families-summary-logo\" src=\"/inventory/families-brand-logo.jpg?v=1\" alt=\"المشويات الدمشقية عوائل\">':''",'manager family summary logo')
          p.write_text(s)

          # Guardrails.
          assert Path('inventory/families-brand-logo.jpg').exists()
          assert Path('inventory/families-supervisor-brand-v1.js').exists()
          assert 'morning-og-whatsapp-1200x630.jpg' in Path('inventory/morning-shell.html').read_text()
          assert 'inventory/whatsapp-preview.jpg' in Path('inventory/index.html').read_text()
          print('Families v73 verification PASS')
          PY
      - name: Commit and clean workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/families-unified-identity-v73.yml
          git rm -f .github/workflows/repair-families-v73.yml || true
          git add inventory/index.html inventory/report-v32.js inventory/branch-report-stable-v57.js inventory/morning-shell.html inventory/morning/index.html inventory/morning/morning-report-v1.js inventory/morning/manager.html
          git commit -m 'Apply Families restaurant identity'
          git push origin main
