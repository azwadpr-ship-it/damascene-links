name: temp morning share v98
on:
  push:
    paths:
      - '.github/workflows/temp-morning-share-v98.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch morning sharing context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inventory/morning/morning-report-v1.js')
          s=p.read_text()
          old_guard="if(window.__morningReportWrapperV94)return;window.__morningReportWrapperV94=true;"
          new_guard="if(window.__morningReportWrapperV95)return;window.__morningReportWrapperV95=true;"
          if old_guard not in s:
              raise SystemExit('guard not found')
          s=s.replace(old_guard,new_guard,1)
          anchor="if(!code.includes(oldDay))throw Error('تعذر تثبيت قراءة التقرير الحالية');\n code=code.replace(oldDay,newDay);"
          inject="""if(!code.includes(oldDay))throw Error('تعذر تثبيت قراءة التقرير الحالية');
 code=code.replace(oldDay,newDay);
 const oldShareNav=\"function sharingNavigator(){try{return window.top?.navigator||navigator}catch{return navigator}}\\nfunction sharingFile(parts,name,opts){try{return new window.top.File(parts,name,opts)}catch{return new File(parts,name,opts)}}\";
 const newShareNav=\"function sharingNavigator(){return navigator}\\nfunction sharingFile(parts,name,opts){return new File(parts,name,opts)}\";
 if(!code.includes(oldShareNav))throw Error('تعذر تثبيت سياق المشاركة');
 code=code.replace(oldShareNav,newShareNav);"""
          if anchor not in s:
              raise SystemExit('anchor not found')
          s=s.replace(anchor,inject,1)
          p.write_text(s)

          p=Path('inventory/morning-shell.html')
          s=p.read_text()
          old='/inventory/morning/morning-report-v1.js?v=19'
          new='/inventory/morning/morning-report-v1.js?v=20'
          if old not in s:
              raise SystemExit('shell report version not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q '__morningReportWrapperV95' inventory/morning/morning-report-v1.js
          grep -q 'function sharingNavigator(){return navigator}' inventory/morning/morning-report-v1.js
          grep -q 'morning-report-v1.js?v=20' inventory/morning-shell.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m 'Fix morning native share context v98'
          git push origin main
# trigger 2
