name: Repair Families v73 workflow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-families-v73.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair target workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/families-unified-identity-v73.yml')
          s=p.read_text()
          start=s.index('          old="<div class=')
          end=s.index("          for x in ['families-summary-card'", start)
          replacement=r'''          class_old="""r.branch_id==='individuals'?'individuals-summary-card':''"""
          class_new="""r.branch_id==='individuals'?'individuals-summary-card':r.branch_id==='families'?'families-summary-card':''"""
          img_old="""r.branch_id==='individuals'?'<img class="individuals-summary-logo" src="/inventory/individuals-brand-logo.svg?v=1" alt="المشويات الدمشقية">':''"""
          img_new="""r.branch_id==='individuals'?'<img class="individuals-summary-logo" src="/inventory/individuals-brand-logo.svg?v=1" alt="المشويات الدمشقية">':r.branch_id==='families'?'<img class="families-summary-logo" src="/inventory/families-brand-logo.jpg?v=1" alt="المشويات الدمشقية عوائل">':''"""
          if class_old not in s or img_old not in s: raise SystemExit('manager summary submarkers missing')
          s=s.replace(class_old,class_new,1).replace(img_old,img_new,1)
'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
      - name: Commit repair and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-families-v73.yml
          git add .github/workflows/families-unified-identity-v73.yml
          git commit -m 'Repair Families v73 workflow markers'
          git push origin main
