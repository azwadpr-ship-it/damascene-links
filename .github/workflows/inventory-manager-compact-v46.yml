name: Inventory manager compact v46
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-manager-compact-v46.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate compact manager dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old="addStyles(d);addScript(d,'branch-report-stable-v45-js','/inventory/branch-report-stable-v45.js?v=1');addScript(d,'manager-stable-v45-js','/inventory/manager-stable-v45.js?v=1')"
          new="addStyles(d);if(!d.getElementById('manager-compact-v46-css')){const l=d.createElement('link');l.id='manager-compact-v46-css';l.rel='stylesheet';l.href='/inventory/manager-compact-v46.css?v=1';d.head.appendChild(l)}addScript(d,'branch-report-stable-v45-js','/inventory/branch-report-stable-v45.js?v=1');addScript(d,'manager-compact-v46-js','/inventory/manager-compact-v46.js?v=1')"
          if old not in s:
              raise SystemExit('v45 manager hook not found')
          s=s.replace(old,new,1)
          if "/inventory/original.html?v=45" not in s:
              raise SystemExit('v45 original marker not found')
          s=s.replace('/inventory/original.html?v=45','/inventory/original.html?v=46',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q "manager-compact-v46.css?v=1" inventory/index.html
          grep -q "manager-compact-v46.js?v=1" inventory/index.html
          grep -q "original.html?v=46" inventory/index.html
          ! grep -q "manager-stable-v45.js?v=1" inventory/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v46: compact manager dashboard"
          git push
