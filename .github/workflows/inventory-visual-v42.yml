name: Inventory visual v42
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-visual-v42.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach CSS-only branch visual layer
        shell: python
        run: |
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old="if(h!=='لوحة المدير')return;addStyles(d);"
          new="if(h!=='لوحة المدير'){if(!d.getElementById('branch-stable-v42-css')){const l=d.createElement('link');l.id='branch-stable-v42-css';l.rel='stylesheet';l.href='/inventory/branch-stable-v42.css?v=1';d.head.appendChild(l)}return}addStyles(d);"
          if old not in s:
              raise SystemExit('branch stable hook not found')
          s=s.replace(old,new,1)
          if "/inventory/original.html?v=41" not in s:
              raise SystemExit('v41 marker not found')
          s=s.replace('/inventory/original.html?v=41','/inventory/original.html?v=42',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q "branch-stable-v42.css?v=1" inventory/index.html
          grep -q "original.html?v=42" inventory/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v42: restore elegance with CSS-only stable branch styling"
          git push
