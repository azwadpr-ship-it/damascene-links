name: Manager branch brand cleanup v76
on:
  push:
    branches: [main]
    paths: ['.github/workflows/manager-branch-brand-cleanup-v76.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harden manager branch identities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_apply(path, branch_label, html_class, card_class, logo_class, strip_id):
              p=Path(path); s=p.read_text()
              a=s.index('function apply(){')
              b=s.index('function schedule()', a)
              apply=f'''function apply(){{if(busy)return;busy=true;try{{\n ensureStyle();\n const title=(q('.head h2')?.textContent||'').trim();\n const branchView=title.includes('{branch_label}')&&title!=='لوحة المدير';\n const managerView=title==='لوحة المدير';\n document.documentElement.classList.toggle('{html_class}',branchView);\n outerBrand();\n q('#{strip_id}')?.remove();\n if(!managerView){{\n  qa('.{logo_class}').forEach(x=>x.remove());\n  qa('.{card_class}').forEach(x=>x.classList.remove('{card_class}'));\n  return;\n }}\n qa('.{logo_class}').forEach(x=>{{if(!x.closest('.manager-final-row,.manager-morning-row'))x.remove()}});\n qa('.{card_class}').forEach(x=>{{if(!x.matches('.manager-final-row,.manager-morning-row'))x.classList.remove('{card_class}')}});\n qa('#dash .manager-final-row h3,#managerMorningPanel .manager-morning-row h3').filter(el=>(el.textContent||'').trim()==='{branch_label}').forEach(el=>{{\n  const card=closestCard(el);if(!card)return;card.classList.add('{card_class}');\n  if(!card.querySelector('.{logo_class}')){{const img=document.createElement('img');img.src=LOGO;img.alt='{branch_label}';img.className='{logo_class}';card.appendChild(img)}}\n }})\n}}finally{{busy=false}}}}\n'''
              s=s[:a]+apply+s[b:]
              p.write_text(s)

          patch_apply('inventory/individuals-supervisor-brand-v1.js','المشويات أفراد','individuals-identity','individuals-branch-card','individuals-card-logo','individualsBrandStrip')
          patch_apply('inventory/families-supervisor-brand-v1.js','المشويات عوائل','families-identity','families-branch-card','families-card-logo','familiesBrandStrip')

          p=Path('inventory/index.html'); s=p.read_text()
          s=s.replace('/inventory/individuals-supervisor-brand-v1.js?v=2','/inventory/individuals-supervisor-brand-v1.js?v=3')
          s=s.replace('/inventory/families-supervisor-brand-v1.js?v=2','/inventory/families-supervisor-brand-v1.js?v=3')
          if s.count('/inventory/individuals-supervisor-brand-v1.js?v=3') != 2: raise SystemExit('individuals v3 cache-bust mismatch')
          if s.count('/inventory/families-supervisor-brand-v1.js?v=3') != 2: raise SystemExit('families v3 cache-bust mismatch')
          if 'https://damascene-links.vercel.app/inventory/whatsapp-preview.jpg' not in s: raise SystemExit('inventory OG changed unexpectedly')
          p.write_text(s)

          for f in ['inventory/individuals-supervisor-brand-v1.js','inventory/families-supervisor-brand-v1.js']:
              x=Path(f).read_text()
              if "if(!managerView)" not in x or "closest('.manager-final-row,.manager-morning-row')" not in x: raise SystemExit('loop guard missing '+f)
          print('manager branch identity loop guard PASS')
          PY
      - name: Commit hardened cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/individuals-supervisor-brand-v1.js inventory/families-supervisor-brand-v1.js inventory/index.html
          git commit -m 'Harden manager branch identity cleanup'
          git push origin main
