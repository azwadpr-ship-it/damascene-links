name: Inventory manager fast reveal v59
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-manager-fast-reveal-v59.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v59 manager fast reveal patch
        run: python .github/scripts/inventory_manager_fast_reveal_v59.py
      - name: Verify
        run: |
          grep -q "manager-tabs-v47.js?v=2" inventory/index.html
          grep -q "managerReady==='1'" inventory/index.html
          grep -q "setTimeout(revealWhenReady,20)" inventory/index.html
          grep -q "original.html?v=59" inventory/index.html
          node --check inventory/manager-tabs-v47.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v59 render manager fast and stable"
          git push
