# trigger v100
name: Fix morning receiving-only reports v100
on:
  push:
    paths:
      - .github/workflows/fix-morning-receiving-only-v100.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch morning report to receiving-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          path = Path('inventory/morning/morning-report-v1.js')
          s = path.read_text(encoding='utf-8')
          s = s.replace('__morningReportWrapperV94', '__morningReportWrapperV100')

          old_day = "async function loadDay(date){const loaded=await post('receiving_load',{date});try{loaded.data.inventory_snapshot=await snapshot(date)}catch(e){console.error('morning report snapshot',e)}return loaded}"
          new_day = "async function loadDay(date){const st=window.__morningReceivingState;if(st&&st.date===date&&st.data)return {ok:true,data:st.data};return await post('receiving_load',{date})}"

          old_count = "function reportItemCount(data){const batches=(data?.batches||[]).length;if(batches)return Object.values(data?.totals||{}).filter(v=>Number(v)>0).length;return Number(data?.inventory_snapshot?.count||0)}"
          new_count = "function reportItemCount(data){const batches=(data?.batches||[]).length;if(!batches)return 0;return Object.values(data?.totals||{}).filter(v=>Number(v)>0).length}"

          old_groups = "function groupTotals(data){const bySec=new Map(),hasBatches=(data.batches||[]).length>0,tot=hasBatches?(data.totals||{}):(data.inventory_snapshot?.values||{});(data.items||[]).forEach(i=>{const raw=tot[i.id];if(raw===undefined||raw===null||raw==='')return;const qty=Number(raw);if(!Number.isFinite(qty))return;if(!hasBatches&&qty===0)return;if(hasBatches&&!(qty>0))return;if(!bySec.has(i.section))bySec.set(i.section,[]);bySec.get(i.section).push({name:i.name,unit:i.unit,qty})});return Array.from(bySec,([section,rows])=>({section,rows}))}"
          new_groups = "function groupTotals(data){const bySec=new Map(),tot=data.totals||{};(data.items||[]).forEach(i=>{const raw=tot[i.id];if(raw===undefined||raw===null||raw==='')return;const qty=Number(raw);if(!Number.isFinite(qty)||!(qty>0))return;if(!bySec.has(i.section))bySec.set(i.section,[]);bySec.get(i.section).push({name:i.name,unit:i.unit,qty})});return Array.from(bySec,([section,rows])=>({section,rows}))}"

          old_refresh = "async function refreshReportState(){injectActions();const card=$('#morningReportActions');if(!card)return;const date=reportDate(),seq=++reportCheckSeq,hint=$('#morningReportHint'),images=$('#morningShareImages'),pdf=$('#morningSharePdf');if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.add('morning-report-empty');if(hint)hint.textContent='جاري التحقق من التقرير المحفوظ...';try{const loaded=await loadDay(date);if(seq!==reportCheckSeq)return;const count=(loaded.data?.batches||[]).length,itemCount=reportItemCount(loaded.data),fallback=!count&&itemCount>0,pending=pendingDraftCount(),disabled=!count&&!fallback&&!pending;preparedReport=null;prepareSeq++;if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.toggle('morning-report-empty',disabled);if(disabled){if(hint)hint.textContent=date===today()?'لا توجد دفعات استلام أو جرد محفوظ لهذا اليوم حتى الآن.':`لا توجد بيانات محفوظة بتاريخ ${ddmmyyyy(date)}.`}else if(pending){if(images)images.disabled=false;if(pdf)pdf.disabled=false;if(hint)hint.textContent=`${pending} صنف جديد غير محفوظ — عند المشاركة سيتم حفظ الدفعة تلقائيًا ثم إرسال تقرير اليوم الكامل.`}else if(fallback){if(hint)hint.textContent=`لا توجد دفعات استلام بعد — سيتم إنشاء تقرير حالة صباحية من آخر جرد محفوظ بتاريخ ${loaded.data.inventory_snapshot?.date||''} (${itemCount} صنف).`;prepareReport(date)}else{if(hint)hint.textContent=`جاري تجهيز تقرير اليوم الكامل — ${count} دفعة / ${itemCount} صنف...`;prepareReport(date)}}catch(e){if(seq!==reportCheckSeq)return;if(hint)hint.textContent=e?.message||'تعذر التحقق من التقرير'}}"
          new_refresh = "async function refreshReportState(){injectActions();const card=$('#morningReportActions');if(!card)return;const date=reportDate(),seq=++reportCheckSeq,hint=$('#morningReportHint'),images=$('#morningShareImages'),pdf=$('#morningSharePdf');if(images)images.disabled=true;if(pdf)pdf.disabled=true;card.classList.add('morning-report-empty');if(hint)hint.textContent='جاري التحقق من دفعات الاستلام الصباحي...';try{const loaded=await loadDay(date);if(seq!==reportCheckSeq)return;const count=(loaded.data?.batches||[]).length,itemCount=reportItemCount(loaded.data),pending=pendingDraftCount(),disabled=!count&&!pending;preparedReport=null;prepareSeq++;card.classList.toggle('morning-report-empty',disabled);if(disabled){if(hint)hint.textContent=date===today()?'لا توجد دفعات استلام صباحي محفوظة لهذا اليوم حتى الآن.':`لا توجد دفعات استلام صباحي محفوظة بتاريخ ${ddmmyyyy(date)}.`;return}if(images)images.disabled=false;if(pdf)pdf.disabled=false;if(pending){if(hint)hint.textContent=`${pending} صنف جديد غير محفوظ — عند المشاركة سيتم حفظ دفعة الاستلام أولًا ثم إرسال تقرير الاستلام الصباحي فقط.`}else if(hint)hint.textContent=`تقرير الاستلام الصباحي — ${count} دفعة / ${itemCount} صنف — ${ddmmyyyy(date)} — جاهز للمشاركة`}catch(e){if(seq!==reportCheckSeq)return;if(hint)hint.textContent=e?.message||'تعذر التحقق من دفعات الاستلام الصباحي'}}"

          block_re = re.compile(r" const oldDay=.*?code=code\.replace\(oldDay,newDay\);\n", re.S)
          replacement = (
              ' const oldDay=' + json.dumps(old_day, ensure_ascii=False) + ';\n'
              ' const newDay=' + json.dumps(new_day, ensure_ascii=False) + ';\n'
              " if(!code.includes(oldDay))throw Error('تعذر تثبيت قراءة دفعات الاستلام');\n"
              ' code=code.replace(oldDay,newDay);\n'
              ' const oldCount=' + json.dumps(old_count, ensure_ascii=False) + ';\n'
              ' const newCount=' + json.dumps(new_count, ensure_ascii=False) + ';\n'
              " if(!code.includes(oldCount))throw Error('تعذر تثبيت عداد الاستلام');\n"
              ' code=code.replace(oldCount,newCount);\n'
              ' const oldGroups=' + json.dumps(old_groups, ensure_ascii=False) + ';\n'
              ' const newGroups=' + json.dumps(new_groups, ensure_ascii=False) + ';\n'
              " if(!code.includes(oldGroups))throw Error('تعذر تثبيت أصناف الاستلام');\n"
              ' code=code.replace(oldGroups,newGroups);\n'
              ' const oldRefresh=' + json.dumps(old_refresh, ensure_ascii=False) + ';\n'
              ' const newRefresh=' + json.dumps(new_refresh, ensure_ascii=False) + ';\n'
              " if(!code.includes(oldRefresh))throw Error('تعذر تثبيت حالة تقرير الاستلام');\n"
              ' code=code.replace(oldRefresh,newRefresh);\n'
              " code=code.replace(/,groups=groupTotals\\(data\\),fallback=!\\(data\\.batches\\|\\|\\[\\]\\)\\.length&&Number\\(data\\.inventory_snapshot\\?\\.count\\|\\|0\\)>0;if\\(!\\(data\\.batches\\|\\|\\[\\]\\)\\.length&&!fallback\\)throw Error\\('لا توجد دفعات استلام أو جرد محفوظ لهذا اليوم'\\);if\\(!groups\\.length\\)throw Error\\(fallback\\?'لا توجد قيم محفوظة في آخر جرد':'لا توجد كميات مستلمة في التقرير'\\);/, ",groups=groupTotals(data);if(!(data.batches||[]).length)throw Error('لا توجد دفعات استلام صباحي محفوظة لهذا اليوم');if(!groups.length)throw Error('لا توجد كميات مستلمة في تقرير الاستلام');");\n"
          )
          s2, n = block_re.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('wrapper loadDay block not found')
          path.write_text(s2, encoding='utf-8')

          shell = Path('inventory/morning-shell.html')
          sh = shell.read_text(encoding='utf-8')
          sh2, n = re.subn(r'morning-report-v1\.js\?v=\d+', 'morning-report-v1.js?v=20', sh, count=1)
          if n != 1:
              raise SystemExit('morning report script version not found in shell')
          shell.write_text(sh2, encoding='utf-8')

          vpath = Path('vercel.json')
          cfg = json.loads(vpath.read_text(encoding='utf-8'))
          for r in cfg.get('redirects', []):
              if r.get('source') in ['/inventory/morning','/inventory/morning/']:
                  r['destination'] = '/inventory/morning-shell.html'
          vpath.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          fast = Path('inventory/morning-fast-shell-v99.html')
          if fast.exists():
              fast.unlink()
          PY
      - name: Verify patch
        run: |
          grep -q '__morningReportWrapperV100' inventory/morning/morning-report-v1.js
          grep -q 'لا توجد دفعات استلام صباحي محفوظة بتاريخ' inventory/morning/morning-report-v1.js
          grep -q 'morning-report-v1.js?v=20' inventory/morning-shell.html
          grep -q '"destination": "/inventory/morning-shell.html"' vercel.json
          test ! -e inventory/morning-fast-shell-v99.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/morning/morning-report-v1.js inventory/morning-shell.html vercel.json
          git add -u inventory/morning-fast-shell-v99.html || true
          git commit -m "Use morning receiving batches only in reports v100"
          git push
