name: Inventory report pagination v50
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-report-pagination-v50.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply report pagination patch
        run: python .github/scripts/inventory_report_pagination_v50.py
      - name: Verify
        run: |
          grep -q "const pages=layout(r);" inventory/report-v32.js
          test -z "$(grep -F "layout(r).slice(0,1)" inventory/report-v32.js || true)"
          grep -q "branch-report-stable-v50.js?v=1" inventory/index.html
          grep -q "original.html?v=50" inventory/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/index.html
          git commit -m "Inventory v50 paginate styled reports without clipping"
          git push
