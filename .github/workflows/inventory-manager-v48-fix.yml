name: Inventory manager v48 fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-manager-v48-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v48 manager visual correction
        shell: python
        run: |
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          old="if(!d.getElementById('manager-tabs-v47-css')){const l=d.createElement('link');l.id='manager-tabs-v47-css';l.rel='stylesheet';l.href='/inventory/manager-tabs-v47.css?v=1';d.head.appendChild(l)}"
          new=old+"if(!d.getElementById('manager-tabs-v48-fix-css')){const l=d.createElement('link');l.id='manager-tabs-v48-fix-css';l.rel='stylesheet';l.href='/inventory/manager-tabs-v48-fix.css?v=1';d.head.appendChild(l)}"
          if old not in s:
              raise SystemExit('v47 manager css hook not found')
          s=s.replace(old,new,1)
          if "/inventory/original.html?v=47" not in s:
              raise SystemExit('v47 original marker not found')
          s=s.replace('/inventory/original.html?v=47','/inventory/original.html?v=48',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q "manager-tabs-v48-fix.css?v=1" inventory/index.html
          grep -q "original.html?v=48" inventory/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/index.html
          git commit -m "Inventory v48: isolate manager tabs and compact inventory button"
          git push
