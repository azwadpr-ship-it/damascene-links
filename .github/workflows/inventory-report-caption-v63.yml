name: Inventory report caption v63
on:
  push:
    paths:
      - '.github/workflows/inventory-report-caption-v63.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply caption patch
        run: python .github/scripts/inventory_report_caption_v63.py
      - name: Verify patch
        run: |
          grep -F "text:caption" inventory/report-v32.js
          grep -F "dateLabel=shareDate" inventory/report-v32.js
          grep -F "/inventory/report-v32.js?v=63" inventory/branch-report-stable-v57.js
          grep -F "/inventory/original.html?v=63" inventory/index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/report-v32.js inventory/branch-report-stable-v57.js inventory/index.html
          git commit -m 'Inventory v63 restore WhatsApp image captions and clean filenames'
          git push
