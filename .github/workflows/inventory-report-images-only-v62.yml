name: Inventory report images only v62
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-report-images-only-v62.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v62 image-only share patch
        run: python .github/scripts/inventory_report_images_only_v62.py
      - name: Verify
        run: |
          grep -q "await navigator.share({files});" inventory/report-v32.js
          ! grep -q "navigator.share({files:allFiles" inventory/report-v32.js
          grep -q "report-v32.js?v=62" inventory/branch-report-stable-v57.js
          grep -q "branch-report-stable-v57.js?v=3" inventory/index.html
          grep -q "original.html?v=62" inventory/index.html
          node --check inventory/report-v32.js
          node --check inventory/branch-report-stable-v57.js
      - name: Cleanup one-time patch files
        run: rm -f .github/scripts/inventory_report_images_only_v62.py .github/workflows/inventory-report-images-only-v62.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/branch-report-stable-v57.js inventory/index.html .github/scripts/inventory_report_images_only_v62.py .github/workflows/inventory-report-images-only-v62.yml
          git commit -m "Inventory v62 share JPG pages separately from PDF"
          git push
