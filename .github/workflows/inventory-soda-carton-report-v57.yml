name: Inventory soda carton report v57
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-soda-carton-report-v57.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v57 soda carton report patch
        run: python .github/scripts/inventory_soda_carton_report_v57.py
      - name: Verify
        run: |
          grep -q "function mergeRegularSodaUnits" inventory/report-v32.js
          grep -q "factor:info.carton?24:1" inventory/report-v32.js
          grep -q "sections=mergeRegularSodaUnits(sections)" inventory/report-v32.js
          grep -q "branch-report-stable-v57.js?v=1" inventory/index.html
          grep -q "original.html?v=57" inventory/index.html
          node --check inventory/report-v32.js
          node --check inventory/branch-report-stable-v57.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/index.html
          git commit -m "Inventory v57 combine regular soda cartons into pieces"
          git push
