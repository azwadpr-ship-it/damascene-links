name: Inventory same-origin fix
on:
  push:
    paths:
      - .github/workflows/inventory-same-origin-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch inventory shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inventory/index.html')
          s=p.read_text(encoding='utf-8')
          upstream='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory'
          receiving='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory-receiving'
          old=f" const API='{upstream}';\n const KEY='inventory_token';"
          new=f" const API='/api/inventory-gateway';\n const UPSTREAM='{upstream}';\n const RECEIVING_API='/api/inventory-receiving-gateway';\n const RECEIVING_UPSTREAM='{receiving}';\n const KEY='inventory_token';"
          if old not in s:
              raise SystemExit('API anchor not found')
          s=s.replace(old,new,1)

          old_apply=" function applySmooth(){try{const d=frame.contentDocument;if(!d)return;\n"
          new_apply=""" function applySmooth(){try{const d=frame.contentDocument;if(!d)return;
  if(!d.getElementById('same-origin-gateway-v1')){const g=d.createElement('script');g.id='same-origin-gateway-v1';g.textContent=`(()=>{if(window.__inventorySameOriginV1)return;window.__inventorySameOriginV1=true;const nativeFetch=window.fetch.bind(window);window.fetch=(input,init)=>{if(typeof input==='string'){if(input==='${UPSTREAM}')input='${API}';else if(input==='${RECEIVING_UPSTREAM}')input='${RECEIVING_API}'}return nativeFetch(input,init)}})();`;d.body.appendChild(g)}
"""
          if old_apply not in s:
              raise SystemExit('applySmooth anchor not found')
          s=s.replace(old_apply,new_apply,1)

          old_show=""" function showSystem(){loginScreen.classList.add('hidden');systemScreen.classList.remove('hidden');if(!frame.src)frame.src='/inventory/original.html?v=38'}
 function showLogin(){systemScreen.classList.add('hidden');loginScreen.classList.remove('hidden');frame.removeAttribute('src')}
"""
          new_show=""" async function loadInventoryFrame(){
  if(frame.dataset.boot==='1'||frame.dataset.boot==='loading')return;
  frame.dataset.boot='loading';
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);
  try{
   const r=await fetch('/inventory/original.html?v=38',{cache:'no-store',signal:controller.signal});
   if(!r.ok)throw new Error('تعذر تحميل واجهة الجرد');
   let html=await r.text();
   html=html.replace("const API='"+UPSTREAM+"';","const API='"+API+"';");
   frame.srcdoc=html;frame.dataset.boot='1';
  }catch(e){
   frame.dataset.boot='';
   frame.srcdoc='<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><style>body{margin:0;background:#f7f3ec;font-family:Tahoma,Arial;color:#6f6252;text-align:center;padding:48px 16px}b{display:block;color:#8d6427;font-size:18px;margin-bottom:8px}</style><body><b>تعذر فتح الجرد</b>أعد تحميل الصفحة. إذا استمرت المشكلة سيظهر الخطأ بدل التعليق على جاري التحميل.</body></html>';
  }finally{clearTimeout(timer)}
 }
 function showSystem(){loginScreen.classList.add('hidden');systemScreen.classList.remove('hidden');loadInventoryFrame()}
 function showLogin(){systemScreen.classList.add('hidden');loginScreen.classList.remove('hidden');frame.removeAttribute('src');frame.removeAttribute('srcdoc');frame.dataset.boot=''}
"""
          if old_show not in s:
              raise SystemExit('showSystem anchor not found')
          s=s.replace(old_show,new_show,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -F "const API='/api/inventory-gateway'" inventory/index.html
          grep -F "inventory-receiving-gateway" inventory/index.html
          grep -F "loadInventoryFrame" inventory/index.html
          grep -F "frame.srcdoc=html" inventory/index.html
      - name: Commit fix
        run: |
          git config user.name "azwadpr-ship-it"
          git config user.email "azwadpr@azwadksa.com"
          git add inventory/index.html
          git commit -m "Inventory: route browser traffic through same-origin gateways"
          git push
