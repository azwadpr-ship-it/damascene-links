name: Inventory report file share v60
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-report-file-share-v60.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v60 file-share patch
        run: python .github/scripts/inventory_report_file_share_v60.py
      - name: Verify
        run: |
          grep -q "id=\"pdfShare\"" inventory/original.html
          grep -q "مشاركة الصور" inventory/original.html
          grep -q "pdfOnly=mode==='pdf'" inventory/report-v32.js
          grep -q "#jpg,#share,#pdfShare" inventory/report-v32.js
          ! grep -q "wa.me/?text" inventory/report-v32.js
          grep -q "branch-report-stable-v57.js?v=2" inventory/index.html
          grep -q "original.html?v=60" inventory/index.html
          node --check inventory/report-v32.js
          node --check inventory/branch-report-stable-v57.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/original.html inventory/index.html
          git commit -m "Inventory v60 share report files instead of WhatsApp text fallback"
          git push
