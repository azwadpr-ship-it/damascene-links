name: Inventory share buttons v64
on:
  push:
    paths:
      - '.github/workflows/inventory-share-buttons-v64.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v64 patch
        run: python .github/scripts/inventory_share_buttons_v64.py
      - name: Verify patch
        run: |
          grep -F "function arrangeShareButtons()" inventory/branch-report-stable-v57.js
          grep -F "مشاركة كصور" inventory/original.html
          grep -F "/inventory/branch-report-stable-v57.js?v=5" inventory/index.html
          grep -F "/inventory/original.html?v=64" inventory/index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/branch-report-stable-v57.js inventory/original.html inventory/index.html
          git commit -m 'Inventory v64 stack image and PDF share buttons'
          git push
