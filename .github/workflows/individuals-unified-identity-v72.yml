name: Individuals unified identity v72
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/individuals-unified-identity-v72.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and apply patch
        shell: bash
        run: |
          cat .github/patches/individuals-v72/part* | base64 -d | gzip -d > /tmp/individuals_patch.py
          python /tmp/individuals_patch.py
      - name: Verify
        run: |
          grep -q '__individualsSupervisorBrandV1' inventory/individuals-supervisor-brand-v1.js
          grep -q 'data:image/webp;base64' inventory/individuals-brand-logo.svg
          grep -q "mode:'individuals'" inventory/report-v32.js
          grep -q 'report-v32.js?v=65' inventory/branch-report-stable-v57.js
          grep -q 'individuals-supervisor-brand-v1.js?v=1' inventory/index.html
          grep -q "id==='individuals'" inventory/morning/index.html
          grep -q 'index.html?inner=13' inventory/morning-shell.html
          grep -q 'morning-report-v1.js?v=9' inventory/morning-shell.html
          grep -q '__morningReportV10' inventory/morning/morning-report-v1.js
          grep -q 'themeForBranch' inventory/morning/morning-report-v1.js
          grep -q 'individuals-manager-brand-v1' inventory/morning/manager.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/patches/individuals-v72 .github/patches/individuals-v71 || true
          git rm .github/workflows/individuals-unified-identity-v72.yml
          git add inventory/index.html inventory/branch-report-stable-v57.js inventory/report-v32.js inventory/individuals-brand-logo.svg inventory/individuals-supervisor-brand-v1.js inventory/morning/index.html inventory/morning-shell.html inventory/morning/morning-report-v1.js inventory/morning/manager.html
          git commit -m "Apply Individuals restaurant identity"
          git push
