name: Inventory report visual balance v51
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-report-visual-balance-v51.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual balance patch
        run: python .github/scripts/inventory_report_visual_balance_v51.py
      - name: Verify
        run: |
          grep -q "drawFlowSpread" inventory/report-v32.js
          grep -q "branch-report-stable-v51.js?v=1" inventory/index.html
          grep -q "original.html?v=51" inventory/index.html
          test -z "$(grep -F "صفحة ${pageNo} من ${pageCount}" inventory/report-v32.js || true)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/index.html
          git commit -m "Inventory v51 balance multi-page report layout"
          git push
