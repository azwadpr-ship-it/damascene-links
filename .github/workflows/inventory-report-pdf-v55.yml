name: Inventory report PDF v55
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-report-pdf-v55.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v55 PDF report patch
        run: python .github/scripts/inventory_report_pdf_v55.py
      - name: Verify
        run: |
          grep -q "async function pdfFromJpegs" inventory/report-v32.js
          grep -q "application/pdf" inventory/report-v32.js
          grep -q "branch-report-stable-v55.js?v=1" inventory/index.html
          grep -q "original.html?v=55" inventory/index.html
          node --check inventory/report-v32.js
          node --check inventory/branch-report-stable-v55.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/index.html
          git commit -m "Inventory v55 share JPG pages with PDF"
          git push
