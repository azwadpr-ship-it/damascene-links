name: Fix morning PDF share
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-morning-pdf-share.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch files
        run: python .github/scripts/fix_morning_pdf_share.py
      - name: Verify patch
        run: |
          grep -q 'window.__morningReportV6' inventory/morning/morning-report-v1.js
          grep -q 'sharingNavigator' inventory/morning/morning-report-v1.js
          grep -q 'preparedReport' inventory/morning/morning-report-v1.js
          grep -q 'allow="web-share"' inventory/morning-shell.html
          grep -q 'morning-report-v1.js?v=5' inventory/morning-shell.html
          node --check inventory/morning/morning-report-v1.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory/morning/morning-report-v1.js inventory/morning-shell.html
          git commit -m 'Fix morning report file sharing on mobile' || exit 0
          git push
