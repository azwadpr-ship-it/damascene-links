name: temp-embed-mazaq-daily-logo-v94
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed working Mazaq logo into daily report
        shell: python
        run: |
          from pathlib import Path
          import re
          morning = Path('inventory/morning/morning-report-v1.js').read_text(encoding='utf-8')
          m = re.search(r"const MAZAQ_INLINE='([^']+)'", morning)
          if not m:
              raise SystemExit('Working embedded Mazaq logo not found in morning wrapper')
          inline = m.group(1)
          report_path = Path('inventory/report-v32.js')
          report = report_path.read_text(encoding='utf-8')
          new_report, n = re.subn(r"const MAZAQ_REPORT_LOGO='[^']+';", "const MAZAQ_REPORT_LOGO=" + repr(inline) + ";", report, count=1)
          if n != 1:
              raise SystemExit('Daily report Mazaq logo constant not found')
          report_path.write_text(new_report, encoding='utf-8')
          stable_path = Path('inventory/branch-report-stable-v57.js')
          stable = stable_path.read_text(encoding='utf-8')
          stable = stable.replace('window.__branchReportStableV83', 'window.__branchReportStableV84', 1)
          stable = stable.replace('report-v32-v75-js', 'report-v32-v76-js')
          stable = stable.replace('/inventory/report-v32.js?v=75', '/inventory/report-v32.js?v=76', 1)
          stable_path.write_text(stable, encoding='utf-8')
      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          report = Path('inventory/report-v32.js').read_text(encoding='utf-8')
          stable = Path('inventory/branch-report-stable-v57.js').read_text(encoding='utf-8')
          assert "const MAZAQ_REPORT_LOGO='data:image/png;base64," in report
          assert 'c.drawImage(logo,lx,ly,lw,lh)' in report
          assert '/inventory/report-v32.js?v=76' in stable
          assert 'window.__branchReportStableV84' in stable
          print('PASS')
      - name: Commit patch
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/report-v32.js inventory/branch-report-stable-v57.js
          git commit -m "Embed Mazaq logo in daily inventory report v94"
          git push
