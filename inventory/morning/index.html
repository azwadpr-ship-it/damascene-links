<script>
(()=>{'use strict';
const API='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory-receiving',SNAPSHOT_API='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory-morning-snapshot',KEY='inventory_receiving_token';

async function api(action,p={}){

}
async function enrichSnapshot(data){
 if(S.branch?.id!=='mazaq')return data;
 try{
  const h={'content-type':'application/json'};if(S.token)h.authorization='Bearer '+S.token;
  const r=await fetch(SNAPSHOT_API,{method:'POST',headers:h,body:JSON.stringify({date:S.date})});
  const d=await r.json().catch(()=>({ok:false}));
  if(r.ok&&d.ok!==false)data.inventory_snapshot=d.data||null;
 }catch(e){console.error('mazaq morning snapshot',e)}
 return data
}

function loadDraft(){try{const currentKey=draftKey(),current=JSON.parse(localStorage.getItem(currentKey)||'{}')||{};if(Object.keys(current).length){S.draft=current;return}const base=new Date((S.date||today())+'T12:00:00+03:00');base.setDate(base.getDate()-1);const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(base),o={};parts.forEach(x=>o[x.type]=x.value);const prevDate=`${o.year}-${o.month}-${o.day}`,branchId=S.branch?.id||S.user?.branch_id||'',prevKey=`receiving_draft_${branchId}_${prevDate}`,prev=JSON.parse(localStorage.getItem(prevKey)||'{}')||{};if(Object.keys(prev).length){S.draft=prev;localStorage.setItem(currentKey,JSON.stringify(prev));localStorage.removeItem(prevKey);setTimeout(()=>toast('تم نقل المدخلات غير المحفوظة من أمس إلى اليوم'),50)}else S.draft={}}catch{S.draft={}}}

'بطاطس مجمدة - كرتون':'المقليات','بطاطس مجمدة - كيس':'المقليات',
'مخلل مقطع':'المقبلات','مخلل مشكل - كيلو':'المقبلات','مخلل مشكل - علبة':'المقبلات','حمص':'المقبلات','سلطة ملفوف':'المقبلات',
'ثوم علبة':'الصوصات والتجهيز','ثوم سائل':'الصوصات والتجهيز','طحينة علبة':'الصوصات والتجهيز','طحينة سائلة':'الصوصات والتجهيز','محمرة علبة':'الصوصات والتجهيز','محمرة سائلة':'الصوصات والتجهيز','بقدونس وبصل':'الصوصات والتجهيز','صلصة إيطالي':'الصوصات والتجهيز','دبس رمان':'الصوصات والتجهيز','مايونيز':'الصوصات والتجهيز','شطة':'الصوصات والتجهيز','كاتشب - جالون':'الصوصات والتجهيز','كاتشب - شفرات':'الصوصات والتجهيز','سومطرة':'الصوصات والتجهيز','عصير رمان':'الصوصات والتجهيز',
'خبز تورتيلا أبيض كبير':'الخبز','خبز تورتيلا أسمر كبير':'الخبز','خبز تورتيلا أسمر صغير':'الخبز','خبز شامي':'الخبز','خبز صامولي':'الخبز','خبز لقيمات':'الخبز',
'مشروبات غازية - كرتون':'المشروبات','مشروبات غازية - حبة':'المشروبات','ماء نستله - كرتون':'المشروبات','ماء نستله - حبة':'المشروبات',
'طماطم':'الخضار','زهرة':'الخضار','باذنجان':'الخضار','خس أميركي':'الخضار','ملفوف':'الخضار',
'جبنة شرائح':'المواد العامة','زيت دلال تنك':'المواد العامة','زيت ليزا':'المواد العامة','زيتون أسود':'المواد العامة','فطر':'المواد العامة','ذرة':'المواد العامة',
'جونتي':'مستلزمات التشغيل','غطا راس':'مستلزمات التشغيل','كمامة':'مستلزمات التشغيل'};
function morningSection(i){return S.branch?.id==='mazaq'?(MAZAQ_MORNING_SECTIONS[i.name]||i.section):i.section}
function grouped(items){const g={};(items||[]).forEach(i=>{const sec=morningSection(i);(g[sec]??=[]).push(sec===i.section?i:{...i,section:sec})});if(S.branch?.id!=='mazaq')return g;const o={};MAZAQ_MORNING_SECTION_ORDER.forEach(sec=>{if(g[sec])o[sec]=g[sec]});Object.keys(g).forEach(sec=>{if(!o[sec])o[sec]=g[sec]});return o}
function stats(){const bs=S.data?.batches||[],tot=S.data?.totals||{},count=Object.values(tot).filter(x=>Number(x)>0).length,last=bs[0]?.created_at;return{batches:bs.length,items:count,last:last?time(last):'—'}}
function visibleItems(arr){if(!S.query)return arr;const q=S.query.toLowerCase();return arr.filter(i=>(i.name+' '+i.section+' '+i.unit).toLowerCase().includes(q))}
function render(){const d=S.data;if(!d)return;const st=stats(),groups=grouped(d.items),secs=Object.keys(groups).map((sec,idx)=>{const arr=visibleItems(groups[sec]);if(!arr.length)return'';return`<details class="section" ${S.query||(S.branch?.id!=='families'&&idx===0)?'open':''}><summary><span>${esc(sec)}</span><span>${arr.length} صنف <b aria-hidden="true">⌄</b></span></summary><div class="rows">${arr.map(i=>{const received=Number(d.totals?.[i.id]||0),snap=d.inventory_snapshot?.values?.[i.id],showSnap=S.branch?.id==='mazaq'&&snap!==undefined&&snap!==null,total=showSnap?Number(snap):received,label=showSnap?`آخر جرد ${d.inventory_snapshot?.date||''}`:'إجمالي اليوم',v=S.draft[i.id]??'';return`<div class="row"><div class="name">${esc(i.name)}<small>${esc(i.unit)}</small></div><div class="total"><b>${fmt(total)}</b><small>${esc(label)}</small>${showSnap?`<i>استلام اليوم: ${fmt(received)}</i>`:''}</div><div class="entry"><input class="qty" data-id="${i.id}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" value="${esc(v)}"><span>${esc(i.unit)}</span></div></div>`}).join('')}</div></details>`}).join('');
const history=(d.batches||[]).slice(0,8).map((b,idx)=>`<details class="batch"><summary><span>دفعة ${d.batches.length-idx} · ${b.entries.length} صنف</span><span class="batch-time">${time(b.created_at)}</span></summary>${b.note?`<div class="batch-note">${esc(b.note)}</div>`:''}<div class="batch-items">${b.entries.map(e=>`<span>${esc(e.name)}: <b>${fmt(e.qty)}</b> ${esc(e.unit)}</span>`).join('')}</div></details>`).join('');
$('#content').innerHTML=`<section class="hero"><div class="hero-row"><div><h2>${esc(S.branch?.name||'')}</h2><div class="date">${esc(S.date)} · ${esc(dateLabel(S.date))}</div></div><span class="purpose">استلامات اليوم</span></div><div class="stats"><div class="stat"><strong>${st.batches}</strong><span>دفعات محفوظة</span></div><div class="stat"><strong>${st.items}</strong><span>أصناف استُلمت</span></div><div class="stat"><strong>${st.last}</strong><span>آخر استلام</span></div></div></section>${S.branch?.id==='mazaq'&&d.inventory_snapshot?.count?`<div class="snapshot-note"><b>آخر جرد محفوظ:</b> ${esc(d.inventory_snapshot.date)} · ${d.inventory_snapshot.count} صنف. الأرقام داخل البطاقات هي رصيد الجرد المحفوظ، وخانة الإدخال مخصصة للاستلام الجديد فقط.</div>`:''}<div class="tools"><div class="search"><input id="search" class="input" placeholder="بحث عن صنف..." value="${esc(S.query)}"></div><span class="draft-note">تُحفظ المدخلات غير المرسلة تلقائيًا على الجهاز</span></div><div id="sections">${secs||'<div class="empty">لا توجد أصناف مطابقة</div>'}</div><section class="note-card"><label>ملاحظة على هذه الدفعة <span style="color:var(--muted);font-weight:600">(اختياري)</span></label><textarea id="batchNote" class="textarea" placeholder="مثال: توريد الخضار الصباحي"></textarea></section><section class="history"><h3>دفعات اليوم</h3>${history||'<div class="empty">لم يتم تسجيل أي دفعة حتى الآن</div>'}</section>`;
$('#search').oninput=e=>{S.query=e.target.value.trim();render()};document.querySelectorAll('.qty').forEach(inp=>inp.oninput=()=>{const v=inp.value;if(v===''||Number(v)<=0)delete S.draft[inp.dataset.id];else S.draft[inp.dataset.id]=v;saveDraft()});updatePending();publishState()}
function updatePending(){const vals=Object.values(S.draft).map(Number).filter(x=>x>0),n=vals.length;$('#pendingTitle').textContent=n?`${n} صنف جاهز للحفظ`:'لا توجد كميات جديدة';$('#pendingSub').textContent=n?'سيتم إضافتها إلى إجمالي استلامات اليوم':'أدخل الكمية المستلمة الآن فقط';$('#saveBtn').disabled=!n}
function renderCatalogStatus(message,bad=false){$('#content').innerHTML=`<section class="history"><div class="empty"${bad?' style="color:var(--bad);font-weight:800"':''}>${esc(message)}</div></section>`}
async function refreshMazaqSnapshot(data,date){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),SNAPSHOT_TIMEOUT_MS);
 try{
  const h={'content-type':'application/json'};if(S.token)h.authorization='Bearer '+S.token;
  const r=await fetch(SNAPSHOT_API,{method:'POST',headers:h,body:JSON.stringify({date}),signal:controller.signal});
  const d=await r.json().catch(()=>({ok:false}));
  if(!r.ok||d.ok===false)throw Error(d.error||'تعذر تحميل آخر جرد');
  if(S.branch?.id!=='mazaq'||S.date!==date||S.data!==data)return;
  const note=$('#batchNote')?.value||'';
  data.inventory_snapshot=d.data||null;render();
  if($('#batchNote'))$('#batchNote').value=note
 }catch(e){console.error(e.name==='AbortError'?'mazaq morning snapshot timeout':'mazaq morning snapshot',e)}finally{clearTimeout(timer)}
}
async function load(){
 renderCatalogStatus('جاري تحميل الأصناف...');
 try{
  const d=await api('receiving_load',{date:S.date}),data=d?.data;
  if(!data||!Array.isArray(data.items)||!data.items.length)throw Error('لم تصل قائمة أصناف صالحة من المصدر');
  S.data=data;loadDraft();render();
  if(S.branch?.id==='mazaq')refreshMazaqSnapshot(data,S.date)
 }catch(e){S.data=null;renderCatalogStatus(`تعذر تحميل قائمة الأصناف: ${e.message||'حدث خطأ غير معروف'}`,true);toast('تعذر تحميل قائمة الأصناف',true)}
}
async function bootstrap(){try{const d=await api('bootstrap');S.user=d.user;S.branch=d.branch;S.date=today();applyTheme();$('#loginScreen').classList.add('hidden');$('#appScreen').classList.remove('hidden');await load()}catch(e){toast(e.message,true);signOut(false)}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginBtn'),er=$('#loginError');er.textContent='';b.disabled=true;b.textContent='جاري الدخول...';try{const d=await api('login',{username:$('#username').value.trim(),password:$('#password').value});S.token=d.token;localStorage.setItem(KEY,d.token);await bootstrap()}catch(x){er.textContent=x.message}finally{b.disabled=false;b.textContent='دخول'}};
$('#logoutBtn').onclick=()=>signOut(true);
async function savePendingDraftForReport(){
 const moved=await ensureCurrentDay(true);
 const entries={};for(const [id,v] of Object.entries(S.draft)){const q=Number(v);if(q>0)entries[id]=q}
 const n=Object.keys(entries).length;if(!n)return false;
 const note=$('#batchNote')?.value.trim()||'';
 const b=$('#saveBtn'),oldText=b?.textContent||'';if(b){b.disabled=true;b.textContent='جاري الحفظ والمشاركة...'}
 try{
  if(moved)toast('تم تحديث تاريخ الاستلام تلقائيًا إلى اليوم');
  const d=await api('receiving_post',{date:S.date,entries,note});S.data=await enrichSnapshot(d.data);clearDraft();render();toast('تم حفظ دفعة الاستلام وتجهيز التقرير');return true
 }catch(e){toast(e.message,true);updatePending();throw e}
 finally{const nb=$('#saveBtn');if(nb&&oldText)nb.textContent=oldText;updatePending()}
}
window.__morningSavePendingDraftForReport=savePendingDraftForReport;
$('#saveBtn').onclick=async()=>{
 const b=$('#saveBtn');if(b.disabled)return;
 const note=$('#batchNote')?.value.trim()||'',oldText=b.textContent;
 b.disabled=true;b.textContent='جاري التحقق...';
 try{
  const moved=await ensureCurrentDay(true);
  const entries={};for(const [id,v] of Object.entries(S.draft)){const q=Number(v);if(q>0)entries[id]=q}
  const n=Object.keys(entries).length;if(!n){updatePending();return}
  if(moved)toast('تم تحديث تاريخ الاستلام تلقائيًا إلى اليوم');
  if(!confirm(`حفظ دفعة استلام تحتوي على ${n} صنف؟
سيتم إضافتها إلى إجمالي استلامات اليوم.`))return;
  b.textContent='جاري الحفظ...';
  const d=await api('receiving_post',{date:S.date,entries,note});S.data=await enrichSnapshot(d.data);clearDraft();render();toast('تم حفظ دفعة الاستلام بنجاح')
 }catch(e){toast(e.message,true);updatePending()}finally{b.textContent=oldText;updatePending()}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDateOnResume()});
window.addEventListener('focus',syncDateOnResume);
if(S.token)bootstrap();
})();
</script>
