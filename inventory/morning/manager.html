<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b88932"><title>إدارة الاستلام الصباحي | مطاعم الدمشقية</title>
<style>
:root{--gold:#b88932;--dark:#8e6524;--bg:#f7f3eb;--card:#fffdfa;--ink:#2f2922;--muted:#786f63;--line:#e5d9c6;--ok:#287b54;--bad:#a7433d;--soft:#fff8ec;--shadow:0 10px 28px rgba(56,43,24,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(255,253,250,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{max-width:1080px;margin:auto;height:68px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:205px;max-width:42vw}.brand-title{border-right:1px solid var(--line);padding-right:11px}.brand-title b{display:block;font-size:14px}.brand-title small{font-size:10px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:800}.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}.btn.danger{background:#fff5f4;color:var(--bad);border-color:#e7b9b5}.shell{max-width:1080px;margin:auto;padding:15px 14px 50px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.hero h1{font-size:23px;margin:0 0 4px}.sub{font-size:11px;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap}.input,.select{border:1px solid #d9cdb9;background:#fff;border-radius:10px;padding:9px 10px;color:var(--ink);outline:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.branch{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow);position:relative;overflow:hidden}.branch:before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--gold)}.branch h3{font-size:15px;margin:0 0 9px}.nums{display:flex;gap:12px}.num b{display:block;color:var(--gold);font-size:21px}.num span{font-size:9px;color:var(--muted)}.last{font-size:10px;color:var(--muted);margin-top:9px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--soft),#fff)}.panel-head h2{font-size:16px;margin:0}.count{font-size:10px;color:var(--muted)}.list{padding:4px 12px 12px}.batch{border-bottom:1px solid #eee5d8;padding:11px 2px}.batch:last-child{border-bottom:0}.batch-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.who{font-weight:900;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.badge.posted{background:#e8f4ed;color:#216a46}.badge.voided{background:#fdeceb;color:#9d413b}.note{font-size:11px;margin:8px 0;color:#5d5144}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 8px;margin-top:8px}.item{background:#faf7f1;border:1px solid #eee2d0;border-radius:8px;padding:6px 7px;font-size:10px}.item b{color:var(--dark)}.void-info{font-size:10px;color:var(--bad);margin-top:7px}.actions{margin-top:9px}.empty,.loading{text-align:center;color:var(--muted);padding:40px 15px;font-size:12px}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gate-card{width:min(430px,95vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;text-align:center;box-shadow:var(--shadow)}.gate-card h2{margin:0 0 8px}.gate-card p{color:var(--muted);font-size:12px;line-height:1.7}.toast{position:fixed;left:16px;bottom:18px;background:#2e2a25;color:#fff;padding:11px 14px;border-radius:11px;font-size:11px;opacity:0;transform:translateY(7px);transition:.18s;pointer-events:none;z-index:99}.toast.show{opacity:1;transform:none}.toast.bad{background:var(--bad)}@media(max-width:720px){.topin{height:58px;padding:0 9px}.brand img{width:145px}.brand-title{padding-right:7px}.brand-title small{display:none}.shell{padding:10px 9px 35px}.hero{align-items:start;flex-direction:column}.filters{width:100%}.filters .input,.filters .select{flex:1;min-width:0}.summary{grid-template-columns:1fr}.items{grid-template-columns:1fr 1fr}.batch-top{align-items:center}.who{font-size:12px}}@media(max-width:430px){.items{grid-template-columns:1fr}.brand-title b{font-size:11px}}
</style><style id="individuals-manager-brand-v1">
html[data-brand="individuals"]{--gold:#df9022;--dark:#3b3d3f;--bg:#f2f3f3;--card:#fff;--ink:#3b3d3f;--muted:#717477;--line:#d3d4d5;--soft:#f7efe4}
html[data-brand="individuals"] body{background:#f2f3f3;color:#3b3d3f}
html[data-brand="individuals"] .top{background:rgba(250,250,250,.98)}
html[data-brand="individuals"] .btn.primary{background:#df9022;border-color:#df9022}
html[data-brand="individuals"] .brand img{width:58px;height:58px;object-fit:contain}
.individuals-summary-card{border-top:4px solid #df9022!important;background:linear-gradient(145deg,#fff,#f6f6f6)!important}
.individuals-summary-card:before{background:#df9022!important}
.individuals-summary-card .num b{color:#df9022!important}
.individuals-summary-logo{position:absolute;top:8px;right:9px;width:38px;height:38px;object-fit:contain;background:#fff;border-radius:6px}
.individuals-summary-card h3{padding-right:43px}

html[data-brand="families"]{--gold:#b1740a;--dark:#6b4310;--bg:#f8f4ed;--card:#fffdf9;--ink:#3d3021;--muted:#7a6a57;--line:#e4d3b8;--soft:#f4eadb}
html[data-brand="families"] body{background:#f8f4ed;color:#3d3021}
html[data-brand="families"] .top{background:rgba(255,253,249,.98)}html[data-brand="families"] .btn.primary{background:#b1740a;border-color:#b1740a}
html[data-brand="families"] .brand img{width:58px;height:58px;object-fit:contain;border-radius:7px}
.families-summary-card{border-top:4px solid #b1740a!important;background:linear-gradient(145deg,#fffdf9,#f7f0e5)!important}.families-summary-card:before{background:#b1740a!important}.families-summary-card .num b{color:#b1740a!important}
.families-summary-logo{position:absolute;top:8px;right:9px;width:38px;height:38px;object-fit:contain;background:#fff;border-radius:6px}.families-summary-card h3{padding-right:43px}
</style></head>
<body><div id="app"><div class="loading">جاري التحميل...</div></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const MAIN='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory',RAPI='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory-receiving',KEY='inventory_token';const S={token:localStorage.getItem(KEY)||'',user:null,branches:[],date:null,branch:''};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=x.value);return`${o.year}-${o.month}-${o.day}`}function time(v){try{return new Intl.DateTimeFormat('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}).format(new Date(v))}catch{return''}}function fmt(n){const x=Number(n||0);return Number.isInteger(x)?String(x):String(Math.round(x*100)/100)}function applyBranchBrand(){const id=S.branch||'',root=document.documentElement,img=$('.brand img'),title=$('.brand-title b'),sub=$('.brand-title small');root.dataset.brand=id;if(id==='individuals'){if(img){img.src='/inventory/individuals-brand-logo.svg?v=1';img.alt='المشويات الدمشقية'}if(title)title.textContent='المشويات أفراد - إدارة الاستلام الصباحي';if(sub)sub.textContent='متابعة وتدقيق الدفعات'}else if(id==='families'){if(img){img.src='/inventory/families-brand-logo.jpg?v=1';img.alt='المشويات الدمشقية عوائل'}if(title)title.textContent='المشويات عوائل - إدارة الاستلام الصباحي';if(sub)sub.textContent='متابعة وتدقيق الدفعات'}else{if(img){img.src='/inventory/inventory-brands-banner.webp?v=9';img.alt='مطاعم الدمشقية'}if(title)title.textContent='إدارة الاستلام الصباحي';if(sub)sub.textContent='متابعة وتدقيق الدفعات'}}function toast(m,bad=false){const t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(window.__rt);window.__rt=setTimeout(()=>t.className='toast',2600)}async function api(url,action,p={}){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+S.token},body:JSON.stringify({action,...p})}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||'حدث خطأ');return d}function gate(msg='يجب الدخول بحساب المدير أولًا.'){document.getElementById('app').innerHTML=`<div class="gate"><div class="gate-card"><h2>إدارة الاستلام الصباحي</h2><p>${esc(msg)}</p><button class="btn primary" id="back">العودة إلى نظام الجرد</button></div></div>`;$('#back').onclick=()=>location.href='/inventory/?v=34'}async function init(){if(!S.token)return gate();try{const d=await api(MAIN,'bootstrap');if(d.user?.role!=='manager')return gate('هذه الصفحة مخصصة لحساب المدير فقط.');S.user=d.user;S.branches=d.branches||[];S.date=today();renderShell();applyBranchBrand();await load()}catch(e){gate('انتهت جلسة المدير أو تعذر التحقق منها. ادخل إلى نظام الجرد بحساب المدير ثم افتح هذه الصفحة من جديد.')}}function renderShell(){document.getElementById('app').innerHTML=`<header class="top"><div class="topin"><div class="brand"><img src="/inventory/inventory-brands-banner.webp?v=9" alt="مطاعم الدمشقية"><div class="brand-title"><b>إدارة الاستلام الصباحي</b><small>متابعة وتدقيق الدفعات</small></div></div><button class="btn" id="back">رجوع للجرد</button></div></header><main class="shell"><div class="hero"><div><h1>استلامات الصباح</h1><div class="sub">سجل كامل للدفعات قبل اعتماد الجرد المسائي</div></div><div class="filters"><input id="date" class="input" type="date" value="${S.date}"><select id="branch" class="select"><option value="">كل المطاعم</option>${S.branches.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('')}</select><button class="btn primary" id="refresh">تحديث</button></div></div><div id="summary" class="summary"><div class="loading">جاري التحميل...</div></div><section class="panel"><div class="panel-head"><h2>سجل الدفعات</h2><span id="count" class="count"></span></div><div id="list" class="list"><div class="loading">جاري التحميل...</div></div></section></main>`;$('#back').onclick=()=>location.href='/inventory/?v=34';$('#date').onchange=e=>{S.date=e.target.value;load()};$('#branch').onchange=e=>{S.branch=e.target.value;applyBranchBrand();loadBatches()};$('#refresh').onclick=()=>load()}
async function load(){await Promise.all([loadSummary(),loadBatches()])}async function loadSummary(){const box=$('#summary');box.innerHTML='<div class="loading">جاري التحميل...</div>';try{const d=await api(RAPI,'manager_summary',{date:S.date}),rows=d.rows||[];box.innerHTML=rows.map(r=>`<div class="branch ${r.branch_id==='individuals'?'individuals-summary-card':r.branch_id==='families'?'families-summary-card':''}">${r.branch_id==='individuals'?'<img class="individuals-summary-logo" src="/inventory/individuals-brand-logo.svg?v=1" alt="المشويات الدمشقية">':r.branch_id==='families'?'<img class="families-summary-logo" src="/inventory/families-brand-logo.jpg?v=1" alt="المشويات الدمشقية عوائل">':''}<h3>${esc(r.branch_name)}</h3><div class="nums"><div class="num"><b>${r.batch_count}</b><span>دفعات</span></div><div class="num"><b>${r.item_count}</b><span>أصناف مختلفة</span></div></div><div class="last">${r.last_at?'آخر استلام: '+time(r.last_at):'لم يُسجّل استلام بعد'}</div></div>`).join('')||'<div class="empty">لا توجد فروع</div>'}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function loadBatches(){const box=$('#list');box.innerHTML='<div class="loading">جاري التحميل...</div>';try{const d=await api(RAPI,'manager_batches',{date:S.date,branch_id:S.branch}),bs=d.batches||[];$('#count').textContent=bs.length?`${bs.length} دفعة`:'';box.innerHTML=bs.map(b=>{const br=S.branches.find(x=>x.id===b.branch_id),posted=b.status==='posted';return`<article class="batch"><div class="batch-top"><div><div class="who">${esc(br?.name||b.branch_id)} · ${esc(b.receiver?.display_name||b.receiver?.username||'مشرف صباحي')}</div><div class="meta">${esc(b.receipt_date)} · ${time(b.created_at)} · ${b.entries.length} صنف</div></div><span class="badge ${posted?'posted':'voided'}">${posted?'فعالة':'ملغاة'}</span></div>${b.note?`<div class="note">${esc(b.note)}</div>`:''}<div class="items">${b.entries.map(e=>`<div class="item">${esc(e.name)}: <b>${fmt(e.qty)}</b> ${esc(e.unit)}</div>`).join('')}</div>${!posted?`<div class="void-info">أُلغيت ${b.voided_at?'الساعة '+time(b.voided_at):''}${b.void_reason?' · '+esc(b.void_reason):''}</div>`:`<div class="actions"><button class="btn danger void" data-id="${b.id}">إلغاء هذه الدفعة</button></div>`}</article>`}).join('')||'<div class="empty">لا توجد دفعات استلام لهذا التاريخ</div>';box.querySelectorAll('.void').forEach(btn=>btn.onclick=()=>voidBatch(btn.dataset.id))}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function voidBatch(id){const reason=prompt('سبب إلغاء الدفعة؟\nسيُحفظ السبب في السجل.','تصحيح إدخال');if(reason===null)return;if(!confirm('تأكيد إلغاء هذه الدفعة؟\nسيُعاد حساب الوارد المسائي تلقائيًا.'))return;try{await api(RAPI,'manager_void',{batch_id:id,reason});toast('تم إلغاء الدفعة وإعادة احتساب الوارد');await load()}catch(e){toast(e.message,true)}}init();})();
</script></body></html>
