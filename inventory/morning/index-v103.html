<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الاستلام الصباحي</title>
<style>html,body{margin:0;min-height:100%;background:#edf6f6}body{font-family:Tahoma,Arial,sans-serif;color:#183638}.boot{min-height:100vh;display:grid;place-items:center;font-weight:800}.err{padding:24px;color:#9b2836}</style>
</head>
<body><div id="boot" class="boot">جاري تحميل الاستلام الصباحي...</div>
<script>
(async()=>{'use strict';
 try{
  const r=await fetch('/inventory/morning/index.html?source=v103',{cache:'no-store'});
  if(!r.ok)throw new Error('تعذر تحميل صفحة الاستلام');
  let html=await r.text();

  const draftPattern=/function loadDraft\(\)\{[\s\S]*?\}\nfunction saveDraft\(\)/;
  if(!draftPattern.test(html))throw new Error('تعذر تثبيت حماية مسودة الاستلام');
  html=html.replace(draftPattern,"function loadDraft(){try{S.draft=JSON.parse(localStorage.getItem(draftKey())||'{}')||{}}catch{S.draft={}}}\nfunction saveDraft()");

  const dayPattern=/async function ensureCurrentDay\(migrateDraft=true\)\{[\s\S]*?\}\nasync function syncDateOnResume\(\)/;
  if(!dayPattern.test(html))throw new Error('تعذر تثبيت تاريخ الاستلام');
  html=html.replace(dayPattern,"async function ensureCurrentDay(){const now=today();if(!S.date||S.date===now)return false;S.date=now;const d=await api('receiving_load',{date:S.date});S.data=await enrichSnapshot(d.data);loadDraft();render();return true}\nasync function syncDateOnResume()");

  const fastCache=`<script>(()=>{'use strict';
const rawFetch=window.fetch.bind(window),cache=new Map(),TTL=30000;
function urlOf(input){return typeof input==='string'?input:(input&&input.url)||''}
function parseBody(init){try{return typeof init?.body==='string'?JSON.parse(init.body):null}catch{return null}}
function isLoad(url,body){return (url.includes('/functions/v1/daily-inventory-receiving')&&body?.action==='receiving_load')||url.includes('inventory_family_morning_load_v1')}
function isPost(url,body){return (url.includes('/functions/v1/daily-inventory-receiving')&&body?.action==='receiving_post')||url.includes('inventory_family_morning_post_v1')}
function dateOf(body){return body?.date||body?.p_date||''}
function cacheKey(url,body){return url+'|'+JSON.stringify(body||{})}
function previousDay(d){try{const x=new Date(d+'T12:00:00+03:00');x.setDate(x.getDate()-1);const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(x),o={};p.forEach(v=>o[v.type]=v.value);return o.year+'-'+o.month+'-'+o.day}catch{return''}}
function todayRiyadh(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(v=>o[v.type]=v.value);return o.year+'-'+o.month+'-'+o.day}
function responseFrom(c){return new Response(c.text,{status:c.status,statusText:c.statusText,headers:new Headers(c.headers)})}
async function store(key,r){try{const text=await r.clone().text();cache.set(key,{t:Date.now(),text,status:r.status,statusText:r.statusText,headers:Array.from(r.headers.entries())})}catch{}return r}
async function prefetchYesterday(url,init,body){const d=dateOf(body);if(d!==todayRiyadh())return;const prev=previousDay(d);if(!prev)return;const b={...body};if('date'in b)b.date=prev;if('p_date'in b)b.p_date=prev;const key=cacheKey(url,b);if(cache.has(key))return;try{const rr=await rawFetch(url,{...init,body:JSON.stringify(b),cache:'no-store'});if(rr.ok)await store(key,rr)}catch{}}
window.fetch=async function(input,init){const url=urlOf(input),body=parseBody(init);if(isPost(url,body)){cache.clear();return rawFetch(input,init)}if(!isLoad(url,body))return rawFetch(input,init);const key=cacheKey(url,body),hit=cache.get(key);if(hit&&Date.now()-hit.t<TTL)return responseFrom(hit);const r=await rawFetch(input,init);if(r.ok){await store(key,r);setTimeout(()=>prefetchYesterday(url,init,body),0)}return r};
window.__morningFastCacheV103=cache;
})();<\/script>`;
  html=html.replace('</head>',fastCache+'</head>');

  if(html.includes('تم نقل المدخلات غير المحفوظة من أمس إلى اليوم'))throw new Error('بقي منطق نقل مسودة أمس');
  if(html.includes('receiving_draft_${branchId}_${prevDate}'))throw new Error('بقي مفتاح ترحيل مسودة أمس');

  document.open();
  document.write(html);
  document.close();
 }catch(e){
  const b=document.getElementById('boot');
  if(b){b.className='err';b.textContent=e?.message||'تعذر تشغيل الاستلام الصباحي'}
  console.error('morning index v103',e);
 }
})();
</script></body>
</html>
