<body>
<iframe id="app" title="الاستلام الصباحي" allow="web-share" src="/inventory/morning/index.html?inner=10"></iframe>
<script>
(()=>{
 const frame=document.getElementById('app');
 frame.addEventListener('load',()=>{
   try{
     const d=frame.contentDocument;
     const style=d.createElement('style');
     style.id='morning-distinct-theme';
     style.textContent=`
:root{--accent:#0f6f78!important;--dark:#0a4f57!important;--bg:#edf6f6!important;--card:#fbffff!important;--ink:#183638!important;--muted:#63787a!important;--line:#cfe2e3!important;--soft:#e5f3f4!important;--shadow:0 10px 28px rgba(15,77,84,.08)!important}
html,body{background:#edf6f6!important;color:#183638!important}
.login-screen{background:linear-gradient(180deg,#f5fbfb,#e2f0f1)!important}
.login-card{background:#fbffff!important;border-color:#cfe2e3!important;box-shadow:0 22px 60px rgba(15,77,84,.13)!important}
.login-card h1,.top-title b,.history h3{color:#0a4f57!important}
.input,.textarea,.entry input{border-color:#c7dcde!important}
.btn.primary{background:#0f6f78!important;border-color:#0f6f78!important;color:#fff!important}
.top{background:rgba(248,254,254,.97)!important;border-bottom-color:#cfe2e3!important;box-shadow:0 2px 14px rgba(15,77,84,.05)!important}
.top-title{border-right-color:#cfe2e3!important}.top-title small{color:#0f6f78!important;font-weight:800!important}
.hero{background:linear-gradient(135deg,#dff0f1,#fbffff)!important;border-color:#cfe2e3!important;border-top:4px solid #0f6f78!important;box-shadow:0 10px 28px rgba(15,77,84,.08)!important}
.purpose{background:#0f6f78!important;border-color:#0f6f78!important;color:#fff!important;font-weight:900!important}
.stat,.section,.note-card,.history,.morning-report-actions{border-color:#cfe2e3!important}.stat strong,.total b,.batch-time{color:#0f6f78!important}
.section summary{background:linear-gradient(90deg,#e5f3f4,#fff)!important;color:#0a4f57!important}.row{border-bottom-color:#dcebea!important}
.total{background:#e5f3f4!important;border-color:#cfe2e3!important}
.bottom{background:rgba(248,254,254,.98)!important;border-top-color:#cfe2e3!important;box-shadow:0 -5px 20px rgba(15,77,84,.06)!important}
.toast{background:#173a3e!important}
`;
     d.head.appendChild(style);
     const theme=d.querySelector('meta[name="theme-color"]'); if(theme) theme.content='#0f6f78';
     if(!d.getElementById('morning-report-v1-js')){
       const script=d.createElement('script');
       script.id='morning-report-v1-js';
       script.src='/inventory/morning/morning-report-v1.js?v=6';
       script.async=false;
       d.body.appendChild(script);
     }
   }catch(e){console.error(e)}
 });
})();
