<style>
:root{--gold:#b78b42;--ink:#2e281f;--muted:#786f63;--line:#e5d9c4;--bg:#f7f3ec}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;display:grid;place-items:center;padding:12px;background:#f7f3ec}.loginCard{width:min(292px,90vw);background:#fffdfa;border:1px solid var(--line);border-radius:14px;padding:12px 13px 13px;box-shadow:0 12px 34px rgba(62,45,21,.08)}
.loginBrands{height:72px;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;overflow:hidden}.loginBrands img{display:block;width:238px;max-width:100%;height:auto;object-fit:contain}.loginCard h1{font-size:17px;text-align:center;margin:0 0 2px;font-weight:800}.loginCard p{text-align:center;margin:0 0 9px;color:var(--muted);font-size:10px}.field{margin-bottom:7px}.field label{display:block;font-size:10px;font-weight:700;margin:0 2px 3px}.field input{width:100%;height:35px;border:1px solid #ded3c1;border-radius:8px;background:#fff;padding:6px 9px;outline:none;font:inherit;font-size:12px;color:var(--ink)}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(183,139,66,.10)}.loginBtn{width:100%;height:37px;border:0;border-radius:8px;background:#ad7f32;color:#fff;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.loginBtn:disabled{opacity:.6;cursor:wait}.err{min-height:14px;text-align:center;font-size:10px;color:#a33;margin:4px 0 0}
#systemScreen{position:fixed;inset:0;background:var(--bg)}.brandBar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 8px;position:relative;z-index:3;overflow:hidden}.brandBar img{display:block;width:min(350px,72vw);height:auto;object-fit:contain}#inventoryApp{position:absolute;top:72px;right:0;bottom:0;left:0;width:100%;height:calc(100% - 72px);border:0;background:var(--bg);visibility:visible}.frameLoading{position:absolute;top:72px;right:0;bottom:0;left:0;z-index:2;display:flex;align-items:flex-start;justify-content:center;padding-top:46px;background:var(--bg);color:var(--muted);font-size:14px;font-weight:700;transition:opacity .16s ease}.frameLoading.hide{opacity:0;pointer-events:none}
@media(max-width:720px){.brandBar{height:60px;padding:0 5px}.brandBar img{width:min(300px,84vw)}#inventoryApp{top:60px;height:calc(100% - 60px)}.frameLoading{top:60px;padding-top:38px}.loginCard{width:min(280px,91vw)}.loginBrands{height:68px}.loginBrands img{width:225px}}
</style>
</head>
<body>
<section id="loginScreen"><div class="loginCard"><div class="loginBrands"><img src="/inventory/inventory-brands-login.webp?v=6" alt="شعارات مطاعم الدمشقية"></div><h1>نظام الجرد اليومي</h1><p>دخول الفرع أو المدير</p><form id="loginForm"><div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="loginBtn" type="submit">دخول</button><div id="err" class="err"></div></form></div></section>
<section id="systemScreen" class="hidden"><div class="brandBar"><img src="/inventory/inventory-brands-banner.webp?v=9" alt="شعارات مطاعم الدمشقية"></div><div id="frameLoading" class="frameLoading">جاري فتح الجرد...</div><iframe id="inventoryApp" title="نظام الجرد اليومي"></iframe></section>
<script>
(()=>{'use strict';
 const API='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory';
 const KEY='inventory_token';
 const loginScreen=document.getElementById('loginScreen'),systemScreen=document.getElementById('systemScreen'),frame=document.getElementById('inventoryApp'),frameLoading=document.getElementById('frameLoading'),form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),err=document.getElementById('err');
 const revealFrame=()=>{frame.style.visibility='visible';frameLoading?.classList.add('hide')};
 const showFrameLoading=()=>{frame.style.visibility='visible';frameLoading?.classList.remove('hide')};
 let bootTimer=0;
 const addScript=(d,id,src)=>{if(d.getElementById(id))return;const s=d.createElement('script');s.id=id;s.async=false;s.src=src;d.body.appendChild(s)};
 function addStyles(d){if(!d.getElementById('smooth-v12')){const l=d.createElement('link');l.id='smooth-v12';l.rel='stylesheet';l.href='/inventory/smooth-v10.css?v=12';d.head.appendChild(l)}if(!d.getElementById('pro-v16')){const l=d.createElement('link');l.id='pro-v16';l.rel='stylesheet';l.href='/inventory/pro-v13.css?v=16';d.head.appendChild(l)}if(!d.getElementById('manager-v17-css')){const l=d.createElement('link');l.id='manager-v17-css';l.rel='stylesheet';l.href='/inventory/manager-v17.css?v=17';d.head.appendChild(l)}if(!d.getElementById('receiving-link-v2-css')){const l=d.createElement('link');l.id='receiving-link-v2-css';l.rel='stylesheet';l.href='/inventory/receiving-link-v2.css?v=1';d.head.appendChild(l)}}
 function enhanceWhenReady(){clearTimeout(bootTimer);let tries=0;const tick=()=>{try{const d=frame.contentDocument;if(!d)return;const h=(d.querySelector('.head h2')?.textContent||'').trim();const ready=!!h||!!d.querySelector('.section,.dash,.admintable,.adminform');if(!ready){if(++tries<100)bootTimer=setTimeout(tick,100);else revealFrame();return}if(h!=='لوحة المدير'){if(!d.getElementById('branch-stable-v42-css')){const l=d.createElement('link');l.id='branch-stable-v42-css';l.rel='stylesheet';l.href='/inventory/branch-stable-v42.css?v=1';d.head.appendChild(l)}addScript(d,'branch-report-stable-v57-js','/inventory/branch-report-stable-v57.js?v=9');addScript(d,'individuals-supervisor-brand-v1-js','/inventory/individuals-supervisor-brand-v1.js?v=3');addScript(d,'families-supervisor-brand-v1-js','/inventory/families-supervisor-brand-v1.js?v=3');requestAnimationFrame(revealFrame);return}addStyles(d);if(!d.getElementById('manager-tabs-v47-css')){const l=d.createElement('link');l.id='manager-tabs-v47-css';l.rel='stylesheet';l.href='/inventory/manager-tabs-v47.css?v=1';d.head.appendChild(l)}if(!d.getElementById('manager-tabs-v48-fix-css')){const l=d.createElement('link');l.id='manager-tabs-v48-fix-css';l.rel='stylesheet';l.href='/inventory/manager-tabs-v48-fix.css?v=1';d.head.appendChild(l)}addScript(d,'branch-report-stable-v57-js','/inventory/branch-report-stable-v57.js?v=9');addScript(d,'manager-tabs-v47-js','/inventory/manager-tabs-v47.js?v=2');addScript(d,'individuals-supervisor-brand-v1-js','/inventory/individuals-supervisor-brand-v1.js?v=3');addScript(d,'families-supervisor-brand-v1-js','/inventory/families-supervisor-brand-v1.js?v=3');let revealTries=0;const revealWhenReady=()=>{try{const md=frame.contentDocument,tabs=md?.querySelector('#managerModeTabs'),rows=md?Array.from(md.querySelectorAll('.manager-final-row')):[];const styleIds=['smooth-v12','pro-v16','manager-v17-css','receiving-link-v2-css','manager-tabs-v47-css','manager-tabs-v48-fix-css'];const stylesReady=!!md&&styleIds.every(id=>{const el=md.getElementById(id);return !el||!!el.sheet});if(md?.body?.dataset?.managerReady==='1'&&tabs&&rows.length>=3&&stylesReady){requestAnimationFrame(()=>requestAnimationFrame(revealFrame));return}}catch(e){}if(++revealTries<120)setTimeout(revealWhenReady,20);else revealFrame()};revealWhenReady()}catch(e){revealFrame()}};tick()}
 frame.addEventListener('load',()=>{revealFrame();enhanceWhenReady()});
 function showSystem(){loginScreen.classList.add('hidden');systemScreen.classList.remove('hidden');showFrameLoading();if(!frame.getAttribute('src'))frame.src='/inventory/original.html?v=64'}
 function showLogin(){systemScreen.classList.add('hidden');loginScreen.classList.remove('hidden');clearTimeout(bootTimer);frame.removeAttribute('src')}
 if(localStorage.getItem(KEY))showSystem();else showLogin();
 form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='جاري الدخول...';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',username:document.getElementById('username').value.trim(),password:document.getElementById('password').value}),signal:controller.signal});const d=await r.json().catch(()=>({}));if(!r.ok||!d.token)throw new Error(d.error||'اسم المستخدم أو كلمة المرور غير صحيحة');localStorage.setItem(KEY,d.token);showSystem()}catch(x){err.textContent=x?.name==='AbortError'?'انتهت مهلة الاتصال، حاول مرة أخرى':(x.message||'تعذر تسجيل الدخول')}finally{clearTimeout(timer);btn.disabled=false;btn.textContent='دخول'}});
 setInterval(()=>{const has=!!localStorage.getItem(KEY);if(!has&&!systemScreen.classList.contains('hidden'))showLogin()},1500);
})();
</script>
</body>
</html>
