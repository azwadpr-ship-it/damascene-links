<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b78b42">
<title>الجرد اليومي | مطاعم الدمشقية</title>
<style>
:root{--bg:#f5f0e6;--card:#fffdfa;--ink:#2e281f;--muted:#786f63;--gold:#b78b42;--gold2:#916a2f;--line:#e8ddca;--ok:#24734c;--bad:#a9453d;--warn:#8a5b0e;--shadow:0 12px 32px rgba(60,45,22,.09)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#faf6ef,#f2ebdd);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;background:rgba(248,244,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{max-width:1240px;margin:auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px}.brand b{display:block}.brand small{color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:var(--gold2);color:white}.btn.ok{background:var(--ok);border-color:var(--ok);color:white}.btn:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:1240px;margin:auto;padding:16px 16px 115px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 70px rgba(54,42,25,.14);padding:28px}.biglogo{width:78px;height:78px;margin:0 auto 16px;border-radius:24px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:white;font-size:34px;font-weight:900}.login h1{text-align:center;font-size:25px;margin:0 0 7px}.login p{text-align:center;color:var(--muted);margin:0 0 22px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:14px;font-weight:800}.input,.select,.textarea{width:100%;border:1px solid #d9cdb8;border-radius:12px;padding:12px;background:white;color:var(--ink);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(183,139,66,.12)}.login .btn{width:100%;padding:13px}.head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:10px 0 16px}.head h2{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.datebar .input{width:auto;min-width:165px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.dash{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.dash:before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--gold)}.dash h3{margin:0 0 9px}.status{display:inline-flex;padding:6px 10px;border-radius:99px;font-size:13px;font-weight:900}.status.ok{background:#e7f4ed;color:#1e6844}.status.draft{background:#fff3d9;color:#8a5b0e}.status.miss{background:#fdecea;color:#9d3f37}.meta{color:var(--muted);font-size:13px;margin:12px 0 14px;min-height:18px}.note{background:#fff8e9;border:1px solid #ead29d;color:#705018;border-radius:12px;padding:10px 13px;margin:12px 0}.section{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}.sectitle{padding:13px 16px;background:linear-gradient(90deg,#fbf4e7,#fffdf9);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.sectitle h3{margin:0;font-size:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}.item{border:1px solid #e8ddca;border-radius:14px;background:#fff;padding:12px}.item .name{font-weight:900;margin-bottom:9px}.qtyrow{display:flex;align-items:center;gap:8px}.qty{width:100%;border:1px solid #d7cbb7;border-radius:10px;padding:10px;text-align:center;font-weight:900;font-size:16px}.unit{white-space:nowrap;color:var(--muted);font-size:13px}.tablewrap{overflow:auto;padding:10px 14px 14px}.flow{width:100%;min-width:760px;border-collapse:separate;border-spacing:0 8px}.flow th{font-size:12px;color:var(--muted)}.flow td{background:white;border-top:1px solid #e8ddca;border-bottom:1px solid #e8ddca;padding:8px;text-align:center}.flow td:first-child{border-right:1px solid #e8ddca;border-radius:0 11px 11px 0;text-align:right;font-weight:900}.flow td:last-child{border-left:1px solid #e8ddca;border-radius:11px 0 0 11px}.ro,.sold{display:inline-block;min-width:72px;padding:9px;border-radius:9px;font-weight:900}.ro{background:#f4eee3}.sold{background:#e8f4ed;color:#1f6846}.sold.neg{background:#fde9e7;color:#a63c35}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.bottomin{max-width:1240px;margin:auto;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.bottomin .btn{min-width:145px}.combined{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.minisec{border:1px solid var(--line);border-radius:12px;padding:10px}.minisec b{color:#745925;display:block;margin-bottom:6px}.miniline{font-size:13px;padding:4px 0;border-bottom:1px dashed #ecdfca}.toast{position:fixed;left:18px;bottom:90px;z-index:50;background:#2f2a23;color:white;border-radius:12px;padding:12px 15px;max-width:360px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.loader,.empty{text-align:center;color:var(--muted);padding:45px}.adminlist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto}.admintable{width:100%;min-width:720px;border-collapse:collapse}.admintable th,.admintable td{padding:10px;border-bottom:1px solid #eee3d2;text-align:right}.admintable th{background:#faf5eb;color:var(--muted);font-size:13px}.adminform{display:grid;grid-template-columns:1fr 1.4fr .7fr .9fr .6fr auto;gap:8px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}.adminform .field{margin:0}.switch{width:42px;height:24px;appearance:none;background:#d5cbbb;border-radius:50px;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;right:3px;top:3px;box-shadow:0 1px 4px #777}.switch:checked{background:#2c8058}.switch:checked:after{right:21px}@media(max-width:900px){.grid3,.cards{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:1fr}.adminform{grid-template-columns:1fr 1fr}.head{align-items:start;flex-direction:column}}@media(max-width:620px){.shell{padding:10px 10px 120px}.topin{padding:9px 10px}.brand small,.userlabel{display:none}.grid3,.cards{grid-template-columns:1fr}.bottomin{display:grid;grid-template-columns:1fr 1fr}.bottomin .btn{min-width:0;padding:11px 6px}.adminform{grid-template-columns:1fr}.login{padding:22px}.datebar{width:100%}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const API='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory';
const app=document.getElementById('app');
const S={token:localStorage.getItem('inventory_token')||'',user:null,branches:[],date:null,branchId:null,data:null,values:{},combined:[],adminItems:[],editing:null};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const fmt=n=>n===null||n===undefined||n===''?'—':(Number.isFinite(Number(n))?String(Math.round(Number(n)*100)/100):'—');
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day}`}
function hijri(d){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{weekday:'long',year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Riyadh'}).format(new Date(d+'T12:00:00+03:00'))}catch{return''}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2800)}
function loading(){app.innerHTML='<div class="loader">جاري التحميل...</div>'}
async function api(action,payload={}){const h={'content-type':'application/json'};if(S.token)h.authorization='Bearer '+S.token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({ok:false,error:'تعذر قراءة الرد'}));if(r.status===401&&action!=='login'){localStorage.removeItem('inventory_token');S.token='';S.user=null;login();throw Error(d.error||'انتهت الجلسة')}if(!r.ok||d.ok===false)throw Error(d.error||'حدث خطأ');return d}
function branchName(id){return S.branches.find(b=>b.id===id)?.name||id}
function top(extra=''){return `<div class="top"><div class="topin"><div class="brand"><div class="logo">د</div><div><b>الجرد اليومي</b><small>مطاعم الدمشقية</small></div></div><div class="actions">${extra}<span class="btn userlabel">${esc(S.user?.display_name||'')}</span><button class="btn" id="logout">خروج</button></div></div></div>`}
function wireTop(){document.getElementById('logout')?.addEventListener('click',logout)}
function login(){app.innerHTML=`<div class="loginwrap"><div class="login"><div class="biglogo">د</div><h1>نظام الجرد اليومي</h1><p>دخول الفرع أو المدير</p><form id="lf"><div class="field"><label>اسم المستخدم</label><input class="input" id="u" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input class="input" id="p" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">دخول</button></form></div></div>`;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='جاري الدخول...';try{const d=await api('login',{username:u.value,password:p.value});S.token=d.token;S.user=d.user;localStorage.setItem('inventory_token',d.token);await bootstrap()}catch(x){toast(x.message);b.disabled=false;b.textContent='دخول'}}}
async function logout(){try{await api('logout')}catch{}localStorage.removeItem('inventory_token');S.token='';S.user=null;login()}
async function bootstrap(){if(!S.token)return login();loading();try{const d=await api('bootstrap');S.user=d.user;S.branches=d.branches||[];S.date=today();if(S.user.role==='manager')await manager();else await openReport(S.user.branch_id,S.date,false)}catch(x){toast(x.message);login()}}
async function manager(){app.innerHTML=top('<button class="btn" id="items">إدارة الأصناف</button>')+`<main class="shell"><div class="head"><div><h2>لوحة المدير</h2><div class="muted">متابعة تقارير الفروع الثلاثة</div></div><div class="datebar"><input class="input" type="date" id="md" value="${esc(S.date)}"><button class="btn primary" id="refresh">تحديث</button><button class="btn" id="all">تقرير موحد</button></div></div><div id="dash" class="grid3"><div class="loader">جاري التحميل...</div></div></main>`;wireTop();items.onclick=admin;refresh.onclick=()=>{S.date=md.value;loadDash()};md.onchange=()=>{S.date=md.value;loadDash()};all.onclick=()=>{S.date=md.value;combined()};await loadDash()}
async function loadDash(){const box=document.getElementById('dash');box.innerHTML='<div class="loader">جاري التحميل...</div>';try{const d=await api('dashboard',{date:S.date});box.innerHTML=(d.rows||[]).map(r=>{const q=r.report,cl=!q?'miss':q.status==='submitted'?'ok':'draft',lab=!q?'لم يُرسل':q.status==='submitted'?'تم الاعتماد':'مسودة',meta=!q?'لا يوجد تقرير':q.submitted_at?'اعتمد: '+new Date(q.submitted_at).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'}):'آخر تعديل محفوظ';return `<div class="dash"><h3>${esc(r.name)}</h3><span class="status ${cl}">${lab}</span><div class="meta">${esc(meta)}</div><button class="btn primary open" data-id="${r.id}">فتح التقرير</button></div>`}).join('')||'<div class="empty">لا توجد فروع</div>';box.querySelectorAll('.open').forEach(b=>b.onclick=()=>openReport(b.dataset.id,S.date,true))}catch(x){box.innerHTML='<div class="empty">'+esc(x.message)+'</div>'}}
function grouped(items){const g={};(items||[]).forEach(i=>(g[i.section]||(g[i.section]=[])).push(i));return g}
async function openReport(branch,date,managerMode){S.branchId=branch;S.date=date;loading();try{const d=await api('report_load',{branch_id:branch,date});S.data=d.data;S.values=JSON.parse(JSON.stringify(d.data.values||{}));renderReport(managerMode)}catch(x){toast(x.message);S.user?.role==='manager'?manager():login()}}
function renderReport(managerMode){const d=S.data,g=grouped(d.items),st=d.report?.status==='submitted'?'تم الاعتماد':d.report?.status==='draft'?'مسودة محفوظة':'تقرير جديد';let h=top(managerMode?'<button class="btn" id="back">رجوع للمدير</button>':'')+`<main class="shell"><div class="head"><div><h2>${esc(branchName(d.branch_id))}</h2><div class="muted">${esc(d.date)} · ${esc(hijri(d.date))} · <b>${st}</b></div></div><div class="datebar"><input class="input" type="date" id="rd" value="${esc(d.date)}"><button class="btn" id="goDate">فتح التاريخ</button></div></div>`;if(d.previous_report_date)h+=`<div class="note">أول اليوم مأخوذ تلقائيًا من إغلاق ${esc(d.previous_report_date)}.</div>`;Object.keys(g).forEach(sec=>{const a=g[sec],flow=a[0]?.mode==='flow';h+=`<section class="section"><div class="sectitle"><h3>${esc(sec)}</h3><small>${a.length} صنف</small></div>`;if(flow){h+='<div class="tablewrap"><table class="flow"><thead><tr><th>الصنف</th><th>أول اليوم</th><th>الوارد</th><th>آخر اليوم</th><th>المباع</th><th>الوحدة</th></tr></thead><tbody>';a.forEach(i=>{const v=S.values[i.id]||{opening:0,incoming:0,closing:null},sold=v.closing===null||v.closing===''?null:Number(v.opening||0)+Number(v.incoming||0)-Number(v.closing);h+=`<tr><td>${esc(i.name)}</td><td><span class="ro">${fmt(v.opening)}</span></td><td><input class="qty ri" type="number" step="0.01" inputmode="decimal" data-id="${i.id}" data-key="incoming" value="${esc(v.incoming??0)}"></td><td><input class="qty ri" type="number" step="0.01" inputmode="decimal" data-id="${i.id}" data-key="closing" value="${esc(v.closing??'')}"></td><td><span id="sold-${i.id}" class="sold ${sold!==null&&sold<0?'neg':''}">${fmt(sold)}</span></td><td>${esc(i.unit)}</td></tr>`});h+='</tbody></table></div>'}else{h+='<div class="cards">';a.forEach(i=>{const v=S.values[i.id]||{value:null};h+=`<div class="item"><div class="name">${esc(i.name)}</div><div class="qtyrow"><input class="qty ri" type="number" step="0.01" inputmode="decimal" data-id="${i.id}" data-key="value" value="${esc(v.value??'')}"><span class="unit">${esc(i.unit)}</span></div></div>`});h+='</div>'}h+='</section>'});h+=`<div class="field"><label>ملاحظات التقرير</label><textarea class="textarea" id="notes" rows="3" placeholder="اختياري">${esc(d.report?.notes||'')}</textarea></div></main><div class="bottom"><div class="bottomin"><button class="btn" id="draft">حفظ مسودة</button><button class="btn ok" id="submit">اعتماد التقرير</button><button class="btn" id="jpg">إنشاء JPG</button><button class="btn primary" id="share">مشاركة واتساب</button></div></div>`;app.innerHTML=h;wireTop();if(managerMode)back.onclick=manager;goDate.onclick=()=>openReport(d.branch_id,rd.value,managerMode);document.querySelectorAll('.ri').forEach(inp=>inp.oninput=()=>{const id=inp.dataset.id,k=inp.dataset.key,v=S.values[id]||(S.values[id]={});v[k]=inp.value===''?null:Number(inp.value);if(k==='incoming'||k==='closing'){const z=v.closing===null?null:Number(v.opening||0)+Number(v.incoming||0)-Number(v.closing),el=document.getElementById('sold-'+id);v.computed=z;if(el){el.textContent=fmt(z);el.className='sold '+(z!==null&&z<0?'neg':'')}}});draft.onclick=()=>save(false,managerMode);submit.onclick=()=>save(true,managerMode);jpg.onclick=()=>makeCurrent(false);share.onclick=()=>makeCurrent(true)}
async function save(submit,managerMode){if(submit&&!confirm('اعتماد تقرير اليوم؟'))return;document.querySelectorAll('.bottom button').forEach(b=>b.disabled=true);try{const d=await api('report_save',{branch_id:S.branchId,date:S.date,values:S.values,notes:notes.value,submit});S.data=d.data;S.values=JSON.parse(JSON.stringify(d.data.values||{}));toast(submit?'تم اعتماد التقرير':'تم حفظ المسودة');renderReport(managerMode)}catch(x){toast(x.message);document.querySelectorAll('.bottom button').forEach(b=>b.disabled=false)}}
function lines(data,values){const out=[{t:'branch',s:branchName(data.branch_id)},{t:'date',s:data.date+' · '+hijri(data.date)},{t:'status',s:data.report?.status==='submitted'?'تقرير معتمد':'مسودة / غير معتمد'}],g=grouped(data.items);Object.keys(g).forEach(sec=>{out.push({t:'section',s:sec});g[sec].forEach(i=>{const v=values[i.id]||{};if(i.mode==='flow'){if(v.closing===null||v.closing===undefined)return;const sold=Number(v.opening||0)+Number(v.incoming||0)-Number(v.closing);out.push({t:'item',s:`${i.name}: أول ${fmt(v.opening)} | وارد ${fmt(v.incoming)} | آخر ${fmt(v.closing)} | المباع ${fmt(sold)} ${i.unit}`})}else if(v.value!==null&&v.value!==undefined)out.push({t:'item',s:`${i.name}: ${fmt(v.value)} ${i.unit}`})})});return out}
function wrap(ctx,text,max){const w=String(text).split(' '),a=[];let l='';w.forEach(x=>{const t=l?l+' '+x:x;if(ctx.measureText(t).width>max&&l){a.push(l);l=x}else l=t});if(l)a.push(l);return a}
async function canvasFor(reports){await document.fonts.ready;let all=[];reports.forEach((r,n)=>{if(n)all.push({t:'gap',s:''});all=all.concat(lines(r.data,r.values))});const W=1400,c=document.createElement('canvas');c.width=W;c.height=Math.max(900,Math.min(24000,all.length*72+320));let x=c.getContext('2d');x.fillStyle='#f7f1e5';x.fillRect(0,0,c.width,c.height);x.direction='rtl';x.textAlign='right';x.fillStyle='#b78b42';x.fillRect(0,0,W,18);x.fillStyle='#2d261d';x.font='bold 50px Tahoma,Arial';x.fillText(reports.length>1?'التقرير اليومي الموحد للفروع':'تقرير الجرد اليومي',1280,88);x.fillStyle='#806c4d';x.font='28px Tahoma,Arial';x.fillText('مطاعم الدمشقية',1280,132);let y=190;for(const L of all){if(L.t==='gap'){y+=45;continue}if(L.t==='branch'){x.fillStyle='#a77b36';x.font='bold 43px Tahoma,Arial';x.fillText(L.s,1280,y);y+=58;continue}if(L.t==='date'||L.t==='status'){x.fillStyle='#6f6557';x.font='25px Tahoma,Arial';x.fillText(L.s,1280,y);y+=44;continue}if(L.t==='section'){x.fillStyle='#efe1c5';x.fillRect(80,y-38,1240,55);x.fillStyle='#60491f';x.font='bold 30px Tahoma,Arial';x.fillText(L.s,1280,y);y+=48;continue}x.fillStyle='#302a23';x.font='25px Tahoma,Arial';for(const q of wrap(x,L.s,1160)){x.fillText(q,1260,y);y+=38}x.strokeStyle='#e7dcc9';x.beginPath();x.moveTo(100,y-17);x.lineTo(1300,y-17);x.stroke();y+=12}const H=Math.max(900,y+90);if(H!==c.height){const o=document.createElement('canvas');o.width=W;o.height=H;o.getContext('2d').drawImage(c,0,0);return o}return c}
const blob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.93));
async function makeCurrent(share){try{const c=await canvasFor([{data:S.data,values:S.values}]),b=await blob(c),name=`جرد-${branchName(S.branchId).replace(/\s+/g,'-')}-${S.date}.jpg`,f=new File([b],name,{type:'image/jpeg'});if(share&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({files:[f],title:'تقرير الجرد',text:branchName(S.branchId)+' - '+S.date});return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);if(share){window.open('https://wa.me/?text='+encodeURIComponent('تقرير الجرد - '+branchName(S.branchId)+' - '+S.date),'_blank');toast('تم تنزيل الصورة وفتح واتساب')}}catch(x){toast(x.message||'تعذر إنشاء الصورة')}}
async function combined(){loading();try{const rows=await Promise.all(S.branches.map(async b=>{const d=await api('report_load',{branch_id:b.id,date:S.date});return{branch:b,data:d.data,values:d.data.values||{}}}));S.combined=rows;let h=top('<button class="btn" id="backAll">رجوع للمدير</button>')+`<main class="shell"><div class="head"><div><h2>تقرير الفروع الثلاثة</h2><div class="muted">${esc(S.date)} · ${esc(hijri(S.date))}</div></div><button class="btn primary" id="allJpg">إنشاء JPG موحد</button></div>`;rows.forEach(r=>{const st=r.data.report?.status||'missing';h+=`<div class="combined"><h3>${esc(r.branch.name)}</h3><span class="status ${st==='submitted'?'ok':st==='draft'?'draft':'miss'}">${st==='submitted'?'معتمد':st==='draft'?'مسودة':'لم يُرسل'}</span>`;if(r.data.report){h+='<div class="mini">';const g=grouped(r.data.items);Object.keys(g).forEach(sec=>{h+=`<div class="minisec"><b>${esc(sec)}</b>`;let n=0;g[sec].forEach(i=>{const v=r.values[i.id]||{};let t='';if(i.mode==='flow'){if(v.closing===null||v.closing===undefined)return;t=`${i.name} — المباع ${fmt(Number(v.opening||0)+Number(v.incoming||0)-Number(v.closing))} ${i.unit}`}else{if(v.value===null||v.value===undefined)return;t=`${i.name} — ${fmt(v.value)} ${i.unit}`}if(n<8)h+=`<div class="miniline">${esc(t)}</div>`;n++});if(n>8)h+=`<div class="miniline">+ ${n-8} أصناف أخرى</div>`;h+='</div>'});h+='</div>'}h+='</div>'});h+='</main>';app.innerHTML=h;wireTop();backAll.onclick=manager;allJpg.onclick=downloadAll}catch(x){toast(x.message);manager()}}
async function downloadAll(){try{const rr=S.combined.filter(r=>r.data.report).map(r=>({data:r.data,values:r.values}));if(!rr.length)return toast('لا توجد تقارير لهذا التاريخ');const c=await canvasFor(rr),b=await blob(c),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`تقرير-الفروع-الثلاثة-${S.date}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}catch(x){toast(x.message)}}
async function admin(){S.editing=null;app.innerHTML=top('<button class="btn" id="backAdm">رجوع للمدير</button>')+`<main class="shell"><div class="head"><div><h2>إدارة الأصناف</h2><div class="muted">إضافة أو تعديل أو إيقاف صنف</div></div><select class="select" id="ab">${S.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div id="af"></div><div id="alist" class="adminlist"><div class="loader">جاري التحميل...</div></div></main>`;wireTop();backAdm.onclick=manager;ab.onchange=()=>{S.branchId=ab.value;S.editing=null;adminForm();loadItems()};S.branchId=ab.value;adminForm();await loadItems()}
function adminForm(){const i=S.editing||{};af.innerHTML=`<div class="adminform"><div class="field"><label>القسم</label><input class="input" id="as" value="${esc(i.section||'')}"></div><div class="field"><label>الصنف</label><input class="input" id="an" value="${esc(i.name||'')}"></div><div class="field"><label>الوحدة</label><input class="input" id="au" value="${esc(i.unit||'')}"></div><div class="field"><label>نوع الإدخال</label><select class="select" id="am"><option value="stock" ${i.mode==='stock'?'selected':''}>كمية متبقية</option><option value="flow" ${i.mode==='flow'?'selected':''}>أول + وارد + آخر</option><option value="sales" ${i.mode==='sales'?'selected':''}>مبيعات / عدد</option></select></div><div class="field"><label>الترتيب</label><input class="input" id="ao" type="number" value="${esc(i.sort_order||9990)}"></div><button class="btn primary" id="saveItem">${i.id?'حفظ التعديل':'إضافة'}</button></div>`;saveItem.onclick=saveItemFn}
async function loadItems(){alist.innerHTML='<div class="loader">جاري التحميل...</div>';try{const d=await api('items_admin',{branch_id:S.branchId});S.adminItems=d.items||[];alist.innerHTML=`<table class="admintable"><thead><tr><th>القسم</th><th>الصنف</th><th>الوحدة</th><th>النوع</th><th>فعال</th><th></th></tr></thead><tbody>${S.adminItems.map(i=>`<tr><td>${esc(i.section)}</td><td><b>${esc(i.name)}</b></td><td>${esc(i.unit)}</td><td>${i.mode==='flow'?'حركة':i.mode==='sales'?'مبيعات':'متبقي'}</td><td><input class="switch tog" type="checkbox" data-id="${i.id}" ${i.active?'checked':''}></td><td><button class="btn edit" data-id="${i.id}">تعديل</button></td></tr>`).join('')}</tbody></table>`;alist.querySelectorAll('.tog').forEach(x=>x.onchange=async()=>{try{await api('item_toggle',{id:x.dataset.id,active:x.checked});toast('تم تحديث الحالة')}catch(e){toast(e.message);x.checked=!x.checked}});alist.querySelectorAll('.edit').forEach(x=>x.onclick=()=>{S.editing=S.adminItems.find(i=>i.id===x.dataset.id);adminForm();scrollTo({top:0,behavior:'smooth'})})}catch(x){alist.innerHTML='<div class="empty">'+esc(x.message)+'</div>'}}
async function saveItemFn(){const item={id:S.editing?.id||null,branch_id:S.branchId,section:as.value,name:an.value,unit:au.value,mode:am.value,sort_order:Number(ao.value||9990),active:true};try{await api('item_save',{item});toast(item.id?'تم تعديل الصنف':'تمت إضافة الصنف');S.editing=null;adminForm();await loadItems()}catch(x){toast(x.message)}}
bootstrap();
})();
</script>
</body></html>
