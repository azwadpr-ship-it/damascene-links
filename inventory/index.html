<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b78b42">
<title>الجرد اليومي | مطاعم الدمشقية</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f1e8}
#inventoryApp{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f1e8}
</style>
</head>
<body>
<iframe id="inventoryApp" src="/inventory/original.html" title="نظام الجرد اليومي"></iframe>
<script>
(()=>{
 const frame=document.getElementById('inventoryApp');
 const BRAND='/inventory/inventory-brands.jpg';
 const css=`
 .login{width:min(330px,92vw)!important;padding:18px 18px 16px!important;border-radius:18px!important}
 .biglogo{width:50px!important;height:50px!important;margin-bottom:9px!important;border-radius:15px!important;font-size:23px!important}
 .login h1{font-size:20px!important;margin-bottom:4px!important}
 .login p{font-size:12px!important;margin-bottom:14px!important}
 .login .field{margin-bottom:10px!important;gap:5px!important}
 .login .field label{font-size:12px!important}
 .login .input{padding:9px 10px!important;height:42px!important;border-radius:10px!important}
 .login .btn{padding:10px!important;margin-top:2px!important}
 .login-wrap,.loginwrap{padding:14px!important}
 .inventory-brand-banner{background:#fff;border:1px solid #e6dccb;border-radius:14px;padding:7px 14px;margin:7px 0 13px;box-shadow:0 9px 26px rgba(58,44,23,.07);overflow:hidden}
 .inventory-brand-banner img{display:block;width:min(720px,100%);max-height:145px;object-fit:contain;margin:auto}
 @media(max-width:620px){
   .login{width:min(310px,92vw)!important;padding:16px!important}
   .inventory-brand-banner{padding:5px 9px;margin:6px 0 10px}
   .inventory-brand-banner img{max-height:108px}
 }`;
 function apply(){
   let d;
   try{d=frame.contentDocument}catch(e){return}
   if(!d||!d.head||!d.body)return;
   if(!d.getElementById('inventory-ui-overrides')){
     const st=d.createElement('style'); st.id='inventory-ui-overrides'; st.textContent=css; d.head.appendChild(st);
   }
   const shell=d.querySelector('main.shell');
   if(shell && !shell.querySelector('.inventory-brand-banner')){
     const b=d.createElement('div'); b.className='inventory-brand-banner';
     const img=d.createElement('img'); img.src=BRAND; img.alt='شعارات مطاعم الدمشقية';
     b.appendChild(img); shell.insertBefore(b,shell.firstChild);
   }
 }
 frame.addEventListener('load',()=>{
   apply();
   const d=frame.contentDocument;
   if(!d)return;
   const target=d.getElementById('app')||d.body;
   new MutationObserver(()=>apply()).observe(target,{childList:true,subtree:true});
 });
})();
</script>
</body>
</html>
