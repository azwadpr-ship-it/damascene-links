<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b78b42">
<title>الجرد اليومي | مطاعم الدمشقية</title>
<style>
:root{--gold:#b78b42;--gold2:#916a2f;--ink:#2e281f;--muted:#786f63;--line:#e5d9c4;--bg:#f6f1e8;--card:#fffdfa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 50% 44%,#fffaf1 0,#f6f1e8 48%,#efe7d8 100%)}
.loginCard{width:min(300px,91vw);background:rgba(255,253,250,.98);border:1px solid var(--line);border-radius:17px;padding:13px 14px 14px;box-shadow:0 18px 50px rgba(62,45,21,.12)}
.loginBrands{height:78px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;overflow:hidden}
.loginBrands img{display:block;width:250px;max-width:100%;height:auto;object-fit:contain}
.loginCard h1{font-size:18px;text-align:center;margin:1px 0 3px;font-weight:900}.loginCard p{text-align:center;margin:0 0 10px;color:var(--muted);font-size:11px}
.field{margin-bottom:8px}.field label{display:block;font-size:11px;font-weight:800;margin:0 2px 4px}.field input{width:100%;height:37px;border:1px solid #d8c9b1;border-radius:9px;background:#fff;padding:7px 9px;outline:none;font:inherit;font-size:13px;color:var(--ink)}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(183,139,66,.12)}
.loginBtn{width:100%;height:39px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font:inherit;font-size:14px;font-weight:900;cursor:pointer}.loginBtn:disabled{opacity:.6;cursor:wait}.err{min-height:16px;text-align:center;font-size:11px;color:#a33;margin:5px 0 0}
#systemScreen{position:fixed;inset:0;background:var(--bg)}
.brandBar{height:132px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 14px;box-shadow:0 5px 18px rgba(57,43,23,.05);position:relative;z-index:3;overflow:hidden}
.brandBar img{display:block;width:min(620px,88vw);height:auto;object-fit:contain}
#inventoryApp{position:absolute;top:132px;right:0;bottom:0;left:0;width:100%;height:calc(100% - 132px);border:0;background:var(--bg)}
@media(max-width:720px){.brandBar{height:86px;padding:0 6px}.brandBar img{width:min(520px,94vw)}#inventoryApp{top:86px;height:calc(100% - 86px)}.loginCard{width:min(286px,92vw);padding:12px}.loginBrands{height:72px}.loginBrands img{width:232px}}
</style>
</head>
<body>
<section id="loginScreen">
  <div class="loginCard">
    <div class="loginBrands"><img src="/inventory/inventory-brands-login.png?v=5" alt="شعارات مطاعم الدمشقية"></div>
    <h1>نظام الجرد اليومي</h1>
    <p>دخول الفرع أو المدير</p>
    <form id="loginForm">
      <div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="loginBtn" type="submit">دخول</button>
      <div id="err" class="err"></div>
    </form>
  </div>
</section>
<section id="systemScreen" class="hidden">
  <div class="brandBar">
    <img src="/inventory/inventory-brands-banner.png?v=5" alt="شعارات مطاعم الدمشقية">
  </div>
  <iframe id="inventoryApp" title="نظام الجرد اليومي"></iframe>
</section>
<script>
(()=>{'use strict';
 const API='https://wnknxjxipkvioegskefd.supabase.co/functions/v1/daily-inventory';
 const KEY='inventory_token';
 const loginScreen=document.getElementById('loginScreen');
 const systemScreen=document.getElementById('systemScreen');
 const frame=document.getElementById('inventoryApp');
 const form=document.getElementById('loginForm');
 const btn=document.getElementById('loginBtn');
 const err=document.getElementById('err');
 function showSystem(){loginScreen.classList.add('hidden');systemScreen.classList.remove('hidden');if(!frame.src)frame.src='/inventory/original.html?v=5'}
 function showLogin(){systemScreen.classList.add('hidden');loginScreen.classList.remove('hidden');frame.removeAttribute('src')}
 if(localStorage.getItem(KEY)) showSystem(); else showLogin();
 form.addEventListener('submit',async e=>{
   e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='جاري الدخول...';
   try{
     const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});
     const d=await r.json().catch(()=>({}));
     if(!r.ok||!d.token)throw new Error(d.error||'اسم المستخدم أو كلمة المرور غير صحيحة');
     localStorage.setItem(KEY,d.token);showSystem();
   }catch(x){err.textContent=x.message||'تعذر تسجيل الدخول'}
   finally{btn.disabled=false;btn.textContent='دخول'}
 });
 setInterval(()=>{const has=!!localStorage.getItem(KEY);if(!has&&!systemScreen.classList.contains('hidden'))showLogin()},700);
})();
</script>
</body>
</html>
