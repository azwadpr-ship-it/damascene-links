  <meta name="twitter:image" content="https://damascene-links.vercel.app/assets/social-links-banner-final.png?v=5" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root{
      --bg:#f4e8d3;
      --gold:#b98a2f;
      --gold-dark:#8a611b;
      --text:#2a241b;
      --muted:#766c5e;
      --card:rgba(248,239,225,.94);
      --shadow:0 14px 34px rgba(90,61,11,.10);
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Tahoma,Arial,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 12% 0%,rgba(185,138,47,.11),transparent 27%),
        radial-gradient(circle at 100% 38%,rgba(185,138,47,.08),transparent 25%),
        linear-gradient(180deg,#f8eedf 0%,#efe2ca 100%);
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.10;
      background-image:
        linear-gradient(45deg,transparent 48%,rgba(185,138,47,.13) 49%,transparent 50%),
        linear-gradient(-45deg,transparent 48%,rgba(185,138,47,.08) 49%,transparent 50%);
      background-size:32px 32px;
      mask-image:linear-gradient(to bottom,#000,transparent 30%,transparent 72%,#000);
    }
    .page{
      width:min(100%, 620px);
      margin:0 auto;
      padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
    }
    .shell{
      position:relative;
      overflow:hidden;
      border:1px solid rgba(190,146,70,.50);
      border-radius:26px;
      background:rgba(247,238,224,.78);
      backdrop-filter:blur(12px);
      box-shadow:0 14px 34px rgba(120,88,33,.12);
      padding:15px;
    }
    .shell::before{
      content:"";
      position:absolute;
      inset:7px;
      border:1px solid rgba(185,138,47,.16);
      border-radius:20px;
      pointer-events:none;
    }
    .brand{
      position:relative;
      z-index:1;
      margin:2px 2px 14px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(190,146,70,.28);
      background:#f1e3ca;
      aspect-ratio:1968 / 799;
    }
    .brand img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .primary-actions{
      position:relative;
      z-index:1;
      display:grid;
      gap:10px;
      margin-top:4px;
    }
    .split-actions{
      display:grid;
      grid-template-columns:minmax(0,3fr) minmax(0,2fr);
      gap:10px;
      direction:rtl;
    }
    .cta.compact{
      min-height:82px;
      grid-template-columns:34px 1fr;
      gap:8px;
      padding:10px 12px;
    }
    .cta,.social{text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none}
    .cta{
      min-height:70px;
      border-radius:18px;
      display:grid;
      grid-template-columns:46px 1fr;
      align-items:center;
      gap:12px;
      padding:11px 15px;
      border:1px solid rgba(185,138,47,.58);
      color:var(--text);
      background:rgba(247,239,226,.95);
      box-shadow:0 7px 20px rgba(75,49,6,.06);
      transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
    }
    .cta .icon,.social .icon{display:grid;place-items:center;color:var(--gold)}
    .cta.primary .icon{color:var(--gold)}
    .cta .icon i{font-size:24px}
    .cta strong{display:block;font-size:17px;margin-bottom:2px}
    .cta small{opacity:.78;font-size:11px}
    .cta.compact .icon i{font-size:22px}
    .cta.compact strong{font-size:14px;line-height:1.55}
    .cta.compact small{font-size:10px}
    .section-title{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:18px 3px 10px;
    }
    .section-title h2{margin:0;font-size:15px;color:var(--gold-dark)}
    .section-title span{font-size:10px;color:var(--muted)}
    .social-grid{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }
    .social{
      min-height:74px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:6px;
      padding:9px 7px;
      color:var(--text);
      border:1px solid rgba(190,146,70,.30);
      border-radius:16px;
      background:var(--card);
      box-shadow:0 6px 16px rgba(85,56,7,.05);
      transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    }
    .social .icon i{font-size:25px;color:var(--gold)!important}
    .social .name{font-size:12px;font-weight:700}
    .cta:active,.social:active{transform:scale(.985)}
    @media (hover:hover){
      .cta:hover,.social:hover{
        transform:translateY(-2px);
        border-color:rgba(185,138,47,.74);
        box-shadow:0 11px 24px rgba(90,61,11,.09);
      }
    }
    .footer{
      position:relative;
      z-index:1;
      text-align:center;
      margin-top:16px;
      padding:8px 0 3px;
      color:var(--gold-dark);
      font-size:11px;
    }
    @media (max-width:360px){
      .page{padding-left:9px;padding-right:9px}
      .shell{padding:12px;border-radius:22px}
      .split-actions{gap:8px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
      .cta.compact{min-height:86px;padding:9px 9px;grid-template-columns:28px 1fr;gap:6px}
      .cta.compact .icon i{font-size:20px}
      .cta.compact strong{font-size:13px}
      .cta.compact small{font-size:9px}
      .social-grid{gap:8px}
      .cta strong{font-size:16px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <div class="brand" aria-label="المشويات الدمشقية">
        <img src="assets/social-links-banner-final.png?v=5" alt="المشويات الدمشقية" />
      </div>

      <div class="primary-actions">
        <div class="split-actions">

            <span><strong>قائمة طعام قسم الأفراد</strong></span>

          <a class="cta compact" href="https://damascene-grill.netlify.app" target="_blank" rel="noopener noreferrer">
            <span class="icon"><i class="fa-solid fa-bag-shopping"></i></span>
            <span><strong>تطبيق الطلبات</strong><small>اطلب مباشرة من تطبيقنا</small></span>

          <span><strong>قائمة طعام قسم العوائل</strong><small>تصفح الأصناف والأسعار</small></span>

      </div>

      <div class="section-title">
        <h2>تابعونا وتواصلوا معنا</h2>
        <span>اضغط على المنصة</span>
      </div>

      <div class="social-grid">
        <a class="social" href="https://wa.me/966559988654" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><span class="icon"><i class="fa-brands fa-whatsapp"></i></span><span class="name">WhatsApp</span></a>
        <a class="social" href="https://www.instagram.com/damascene.grill?igsh=MTM2Y29xamVkZDZmNw%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><span class="icon"><i class="fa-brands fa-instagram"></i></span><span class="name">Instagram</span></a>
        <a class="social" href="https://www.tiktok.com/@damascene_grill?_r=1&_t=ZS-98lx7Ft4R89" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><span class="icon"><i class="fa-brands fa-tiktok"></i></span><span class="name">TikTok</span></a>
        <a class="social" href="https://snapchat.com/t/biyvIpF3" target="_blank" rel="noopener noreferrer" aria-label="Snapchat"><span class="icon"><i class="fa-brands fa-snapchat"></i></span><span class="name">Snapchat</span></a>
        <a class="social" href="https://x.com/damascenegrill?s=11" target="_blank" rel="noopener noreferrer" aria-label="X"><span class="icon"><i class="fa-brands fa-x-twitter"></i></span><span class="name">X</span></a>
        <a class="social" href="https://www.facebook.com/share/1JMKi6Br8y/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><span class="icon"><i class="fa-brands fa-facebook-f"></i></span><span class="name">Facebook</span></a>
      </div>

      <div class="footer">المشويات الدمشقية</div>
    </section>
  </main>
</body>
</html>
