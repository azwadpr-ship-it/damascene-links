<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f0e3" />
  <meta name="description" content="روابط المشويات الدمشقية الرسمية: الطلب، المنيو، واتساب ومنصات التواصل الاجتماعي." />
  <title>المشويات الدمشقية | الروابط الرسمية</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root{
      --bg:#f8f2e7;
      --gold:#b98a2f;
      --gold-dark:#8a611b;
      --gold-light:#d7b46b;
      --text:#2a241b;
      --muted:#766c5e;
      --card:rgba(255,253,248,.88);
      --shadow:0 14px 34px rgba(90,61,11,.10);
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Tahoma,Arial,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 12% 0%,rgba(185,138,47,.11),transparent 27%),
        radial-gradient(circle at 100% 38%,rgba(185,138,47,.08),transparent 25%),
        linear-gradient(180deg,#fffaf2 0%,#f7efe1 100%);
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.13;
      background-image:
        linear-gradient(45deg,transparent 48%,rgba(185,138,47,.13) 49%,transparent 50%),
        linear-gradient(-45deg,transparent 48%,rgba(185,138,47,.08) 49%,transparent 50%);
      background-size:32px 32px;
      mask-image:linear-gradient(to bottom,#000,transparent 30%,transparent 72%,#000);
    }
    .page{
      width:min(100%,540px);
      margin:0 auto;
      padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
    }
    .shell{
      position:relative;
      overflow:hidden;
      border:1px solid rgba(185,138,47,.52);
      border-radius:26px;
      background:rgba(255,252,246,.64);
      backdrop-filter:blur(12px);
      box-shadow:var(--shadow);
      padding:15px;
    }
    .shell::before{
      content:"";
      position:absolute;
      inset:7px;
      border:1px solid rgba(185,138,47,.16);
      border-radius:20px;
      pointer-events:none;
    }
    .brand{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:16px 10px 15px;
      margin-bottom:5px;
    }
    .brand-mark{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:1px solid rgba(185,138,47,.58);
      transform:rotate(45deg);
      border-radius:8px;
      color:var(--gold);
      background:rgba(255,250,240,.7);
      box-shadow:0 6px 18px rgba(100,68,13,.07);
    }
    .brand-mark i{transform:rotate(-45deg);font-size:18px}
    .brand-name{
      color:var(--gold-dark);
      font-weight:800;
      font-size:clamp(22px,6vw,28px);
      line-height:1.2;
      white-space:nowrap;
    }
    .primary-actions{
      position:relative;
      z-index:1;
      display:grid;
      gap:10px;
      margin-top:4px;
    }
    .cta,.social{text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none}
    .cta{
      min-height:68px;
      border-radius:18px;
      display:grid;
      grid-template-columns:46px 1fr 26px;
      align-items:center;
      gap:12px;
      padding:11px 15px;
      border:1px solid rgba(185,138,47,.62);
      transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
    }
    .cta.primary{
      color:#fffaf0;
      background:linear-gradient(135deg,#90641b 0%,#b98a2f 53%,#d4ab55 100%);
      box-shadow:0 10px 23px rgba(147,101,27,.20);
    }
    .cta.secondary{
      color:var(--text);
      background:rgba(255,253,248,.88);
      box-shadow:0 7px 20px rgba(75,49,6,.06);
    }
    .cta .icon,.social .icon{display:grid;place-items:center;color:var(--gold)}
    .cta.primary .icon{color:#fff4d7}
    .cta .icon i{font-size:24px}
    .cta strong{display:block;font-size:17px;margin-bottom:2px}
    .cta small{opacity:.72;font-size:11px}
    .cta .arrow{font-size:17px;opacity:.78;text-align:left}
    .section-title{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:18px 3px 10px;
    }
    .section-title h2{margin:0;font-size:15px;color:var(--gold-dark)}
    .section-title span{font-size:10px;color:var(--muted)}
    .social-grid{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }
    .social{
      min-height:72px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:6px;
      padding:9px 7px;
      color:var(--text);
      border:1px solid rgba(185,138,47,.33);
      border-radius:16px;
      background:var(--card);
      box-shadow:0 6px 16px rgba(85,56,7,.05);
      transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    }
    .social .icon i{font-size:25px;color:var(--gold)!important}
    .social .name{font-size:12px;font-weight:700}
    .social.google{grid-column:1/-1;width:calc(50% - 4.5px);justify-self:center}
    .cta:active,.social:active{transform:scale(.985)}
    @media (hover:hover){
      .cta:hover,.social:hover{
        transform:translateY(-2px);
        border-color:rgba(185,138,47,.74);
        box-shadow:0 11px 24px rgba(90,61,11,.09);
      }
    }
    .footer{
      position:relative;
      z-index:1;
      text-align:center;
      margin-top:16px;
      padding:8px 0 3px;
      color:var(--gold-dark);
      font-size:11px;
    }
    @media (max-width:360px){
      .page{padding-left:9px;padding-right:9px}
      .shell{padding:12px;border-radius:22px}
      .brand-name{font-size:21px}
      .brand-mark{width:38px;height:38px}
      .social-grid{gap:8px}
      .cta strong{font-size:16px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <div class="brand" aria-label="المشويات الدمشقية">
        <div class="brand-mark"><i class="fa-solid fa-star"></i></div>
        <div class="brand-name">المشويات الدمشقية</div>
      </div>

      <div class="primary-actions">
        <a class="cta primary" href="https://damascene-grill.netlify.app" target="_blank" rel="noopener noreferrer">
          <span class="icon"><i class="fa-solid fa-bag-shopping"></i></span>
          <span><strong>تطبيق الطلبات</strong><small>اطلب مباشرة من تطبيقنا</small></span>
          <span class="arrow">‹</span>
        </a>
        <a class="cta secondary" href="https://damascene-grill-yanbu.web.app/menu" target="_blank" rel="noopener noreferrer">
          <span class="icon"><i class="fa-solid fa-utensils"></i></span>
          <span><strong>المنيو الإلكتروني</strong><small>تصفح الأصناف والأسعار</small></span>
          <span class="arrow">‹</span>
        </a>
      </div>

      <div class="section-title">
        <h2>تابعونا وتواصلوا معنا</h2>
        <span>اضغط على المنصة</span>
      </div>

      <div class="social-grid">
        <a class="social" href="https://wa.me/966559988654" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><span class="icon"><i class="fa-brands fa-whatsapp"></i></span><span class="name">WhatsApp</span></a>
        <a class="social" href="https://www.instagram.com/damascene.grill?igsh=MTM2Y29xamVkZDZmNw%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><span class="icon"><i class="fa-brands fa-instagram"></i></span><span class="name">Instagram</span></a>
        <a class="social" href="https://www.tiktok.com/@damascene_grill?_r=1&_t=ZS-98lx7Ft4R89" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><span class="icon"><i class="fa-brands fa-tiktok"></i></span><span class="name">TikTok</span></a>
        <a class="social" href="https://snapchat.com/t/biyvIpF3" target="_blank" rel="noopener noreferrer" aria-label="Snapchat"><span class="icon"><i class="fa-brands fa-snapchat"></i></span><span class="name">Snapchat</span></a>
        <a class="social" href="https://x.com/damascenegrill?s=11" target="_blank" rel="noopener noreferrer" aria-label="X"><span class="icon"><i class="fa-brands fa-x-twitter"></i></span><span class="name">X</span></a>
        <a class="social" href="https://www.facebook.com/share/1JMKi6Br8y/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><span class="icon"><i class="fa-brands fa-facebook-f"></i></span><span class="name">Facebook</span></a>
        <a class="social google" href="https://share.google/YdRP55rLnyTNEz6Qc" target="_blank" rel="noopener noreferrer" aria-label="Google Business"><span class="icon"><i class="fa-brands fa-google"></i></span><span class="name">Google</span></a>
      </div>

      <div class="footer">المشويات الدمشقية</div>
    </section>
  </main>
</body>
</html>
