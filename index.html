    .page{width:min(100%,620px);margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}

    .brand{position:relative;z-index:1;margin:2px 2px 14px;border-radius:18px;overflow:hidden;border:1px solid rgba(190,146,70,.28);background:#f1e3ca}
    .brand img{width:100%;height:auto;display:block}
    .primary-actions{position:relative;z-index:1;display:grid;gap:8px;margin-top:4px}
    .split-actions{display:grid;grid-template-columns:minmax(0,13fr) minmax(0,7fr);gap:8px;direction:rtl}
    .cta,.social{text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none}
    .cta{height:62px;min-height:62px;border-radius:16px;display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;padding:6px 13px;border:1px solid rgba(185,138,47,.58);color:var(--text);background:rgba(247,239,226,.95);box-shadow:0 7px 20px rgba(75,49,6,.06);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
    .cta.compact{height:62px;min-height:62px;grid-template-columns:30px 1fr;gap:7px;padding:6px 10px}
    .cta .icon,.social .icon{display:grid;place-items:center;color:var(--gold)}
    .cta .icon i{font-size:22px}.cta strong{display:block;font-size:13px;margin-bottom:0;line-height:1.35}.cta small{opacity:.78;font-size:11px}.cta.compact .icon i{font-size:20px}.cta.compact strong{font-size:13px;line-height:1.35}.cta.compact small{font-size:10px}
    .cta strong.menu-label{font-size:18px;font-weight:700}
    .cta strong.app-label{font-size:15px;font-weight:700}
    .section-title{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 3px 10px}.section-title h2{margin:0;font-size:15px;color:var(--gold-dark)}.section-title span{font-size:10px;color:var(--muted)}
    .social-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .social{min-height:74px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:9px 7px;color:var(--text);border:1px solid rgba(190,146,70,.30);border-radius:16px;background:var(--card);box-shadow:0 6px 16px rgba(85,56,7,.05);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.social .icon i{font-size:25px;color:var(--gold)!important}.social .name{font-size:12px;font-weight:700}.cta:active,.social:active{transform:scale(.985)}
    @media(hover:hover){.cta:hover,.social:hover{transform:translateY(-2px);border-color:rgba(185,138,47,.74);box-shadow:0 11px 24px rgba(90,61,11,.09)}}
    .footer{position:relative;z-index:1;text-align:center;margin-top:16px;padding:8px 0 3px;color:var(--gold-dark);font-size:11px}
    @media(max-width:360px){.page{padding-left:9px;padding-right:9px}.shell{padding:12px;border-radius:22px}.split-actions{gap:7px}.cta,.cta.compact{height:64px;min-height:64px}.cta{grid-template-columns:38px 1fr;padding:6px 10px}.cta.compact{padding:6px 8px;grid-template-columns:26px 1fr;gap:5px}.cta.compact .icon i{font-size:18px}.cta strong,.cta.compact strong{font-size:12px}.cta strong.menu-label{font-size:16px}.cta strong.app-label{font-size:14px}.social-grid{gap:8px}}
