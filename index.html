  <style>
    :root{--bg:#f8f2e7;--gold:#b98a2f;--gold-dark:#8a611b;--text:#2a241b;--muted:#756b5d;--card:rgba(255,252,246,.82);--shadow:0 12px 35px rgba(82,55,10,.10)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Tahoma,Arial,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(185,138,47,.11),transparent 28%),radial-gradient(circle at 100% 35%,rgba(185,138,47,.08),transparent 26%),linear-gradient(180deg,#fffaf2 0%,#f7efe1 100%)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(45deg,transparent 48%,rgba(185,138,47,.13) 49%,transparent 50%),linear-gradient(-45deg,transparent 48%,rgba(185,138,47,.08) 49%,transparent 50%);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 32%,transparent 72%,#000)}
    .page{width:min(100%,560px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}.shell{position:relative;overflow:hidden;border:1px solid rgba(185,138,47,.55);border-radius:28px;background:rgba(255,252,246,.60);backdrop-filter:blur(12px);box-shadow:var(--shadow);padding:16px}.shell::before{content:"";position:absolute;inset:8px;border:1px solid rgba(185,138,47,.18);border-radius:21px;pointer-events:none}.brand{position:relative;z-index:1;margin:2px 2px 14px;border-radius:20px;overflow:hidden;border:1px solid rgba(185,138,47,.24);background:#f7eddd;aspect-ratio:4/1;display:flex;align-items:center;justify-content:center}.brand img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}.primary-actions{position:relative;z-index:1;display:grid;gap:10px;margin-top:4px}.cta,.social{text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none}.cta{min-height:70px;border-radius:18px;display:grid;grid-template-columns:46px 1fr 28px;align-items:center;gap:12px;padding:12px 15px;border:1px solid rgba(185,138,47,.65);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.cta.primary{color:#fffaf0;background:linear-gradient(135deg,#8d621a 0%,#b98a2f 52%,#d5ad59 100%);box-shadow:0 10px 24px rgba(147,101,27,.22)}.cta.secondary{color:var(--text);background:rgba(255,253,248,.84);box-shadow:0 8px 22px rgba(75,49,6,.07)}.cta .icon,.social .icon{display:grid;place-items:center;color:var(--gold)}.cta.primary .icon{color:#fff5dc}.cta .icon i{font-size:25px}.cta .label{min-width:0}.cta strong{display:block;font-size:18px;margin-bottom:2px}.cta small{opacity:.74;font-size:12px;letter-spacing:.02em}.cta .arrow{font-size:17px;opacity:.78;text-align:left}.section-title{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:19px 3px 10px}.section-title h2{margin:0;font-size:16px;color:var(--gold-dark)}.section-title span{font-size:11px;color:var(--muted)}.social-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.social{min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;padding:10px 8px;color:var(--text);border:1px solid rgba(185,138,47,.34);border-radius:17px;background:var(--card);box-shadow:0 7px 18px rgba(85,56,7,.055);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.social .icon i{font-size:26px;color:var(--gold)!important}.social .name{font-size:13px;font-weight:700}.cta:active,.social:active{transform:scale(.985)}@media (hover:hover){.cta:hover,.social:hover{transform:translateY(-2px);border-color:rgba(185,138,47,.75);box-shadow:0 12px 26px rgba(90,61,11,.10)}}.footer{position:relative;z-index:1;text-align:center;color:var(--gold-dark);margin-top:19px;padding:10px 0 3px;font-family:Georgia,"Times New Roman",serif;font-size:14px;letter-spacing:.08em}.footer small{display:block;margin-top:5px;color:var(--muted);font-family:Tahoma,Arial,sans-serif;font-size:10px;letter-spacing:0}@media (max-width:360px){.page{padding-left:10px;padding-right:10px}.shell{padding:12px;border-radius:23px}.social-grid{gap:8px}.cta strong{font-size:16px}}
  </style>
