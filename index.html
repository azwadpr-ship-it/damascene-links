;color:var(--muted)}.social-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.social{min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;padding:10px 8px;color:var(--text);border:1px solid rgba(185,138,47,.34);border-radius:17px;background:var(--card);box-shadow:0 7px 18px rgba(85,56,7,.055);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.social .icon i{font-size:26px;color:var(--gold)!important}.social .name{font-size:13px;font-weight:700}.cta:active,.social:active{transform:scale(.985)}@media (hover:hover){.cta:hover,.social:hover{transform:translateY(-2px);border-color:rgba(185,138,47,.75);box-shadow:0 12px 26px rgba(90,61,11,.10)}}.footer{position:relative;z-index:1;text-align:center;color:var(--gold-dark);margin-top:19px;padding:10px 0 3px;font-family:Georgia,"Times New Roman",serif;font-size:14px;letter-spacing:.08em}.footer small{display:block;margin-top:5px;color:var(--muted);font-family:Tahoma,Arial,sans-serif;font-size:10px;letter-spacing:0}@media (max-width:360px){.page{padding-left:10px;padding-right:10px}.shell{padding:12px;border-radius:23px}.social-grid{gap:8px}.cta strong{font-size:16px}}
